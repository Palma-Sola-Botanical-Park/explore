<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>80th Birthday — family photo show</title>
<link rel="icon" type="image/png" href="../../images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Oswald:wght@500&family=Source+Sans+3:wght@400;600&family=Yellowtail&display=swap" rel="stylesheet">
<!-- 80th birthday photo show. First built 2026-11-14; this family-album look
     with a chapter per decade replaced the first version the same evening.

     THE PHOTOS AND THE LIST ARE NOT IN THE REPO (a family's pictures and
     names; the repo is public). They live in the folder birthday80-local/
     beside this page, which is gitignored:
        birthday80-local/photos.js     the list: file, part, caption, year
        birthday80-local/photos/*.jpg  TV-size photos
     Copy that folder to C:\PSBP\repo\screens\events\ on each PC.

     Play order, every loop: the invitation; the hospital story; the dated
     photos in order, a chapter per decade, each opening with a full-colour
     divider card (1940s navy, 1950s mustard, 1960s coral, 1970s & 1980 navy)
     and sitting on a light wash of that colour, in a mount of the era; the
     family card; the rest shuffled, with a "Happy 80th" card every 25 photos
     and at the end. Photos are never altered: every effect sits around them.
     It loads one photo ahead; a photo that will not load is skipped.

     ?speed=5 fast · ?start=N begin at item N · keys: right arrow = next, P = pause -->
<style>
  :root{--ivory:#f4ead7;--mat:#fdf8ee;--navy:#1c2a4a;--coral:#e0623f;--mustard:#e4a83b;
    --serif:'DM Serif Display',Georgia,serif;--script:'Yellowtail',cursive;--cond:'Oswald','Arial Narrow',sans-serif;--sans:'Source Sans 3',Arial,sans-serif}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--navy)}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease-in-out;background:var(--ivory);color:var(--navy);font-family:var(--sans);overflow:hidden}
  .slide.on{opacity:1;z-index:1}

  /* ---- grounds: a light wash of each chapter's colour ---- */
  .t40{background:color-mix(in srgb,var(--navy) 6%,var(--ivory))}
  .t50{background:color-mix(in srgb,var(--mustard) 26%,var(--mat))}
  .t60{background:color-mix(in srgb,var(--coral) 15%,var(--ivory))}
  .t70{background:color-mix(in srgb,var(--navy) 15%,var(--ivory))}
  .t40::before,.t70::before{content:"";position:absolute;inset:0;pointer-events:none;     /* faint paper fibres */
    background:repeating-linear-gradient(28deg,rgba(28,42,74,.022) 0 1px,transparent 1px 6px),
               repeating-linear-gradient(-34deg,rgba(28,42,74,.016) 0 1px,transparent 1px 7px)}
  .t50::before{content:"";position:absolute;inset:0;pointer-events:none;                  /* dot field in the side margins */
    background:radial-gradient(circle,rgba(28,42,74,.10) 1.4px,transparent 1.9px) 0 0/10px 10px;
    -webkit-mask-image:linear-gradient(90deg,#000 0,transparent 17%,transparent 83%,#000 100%);
            mask-image:linear-gradient(90deg,#000 0,transparent 17%,transparent 83%,#000 100%)}

  /* ---- corner shapes: fixed per chapter ---- */
  .shape{position:absolute;display:block;pointer-events:none}
  .disc{border-radius:50%}
  .pill{border-radius:999px}

  /* ---- header on photo slides ---- */
  .hdr{position:absolute;left:112px;right:112px;top:62px;height:62px;border-bottom:2px solid rgba(28,42,74,.17);
    font-family:var(--cond);font-weight:500;font-size:30px;letter-spacing:4px;text-transform:uppercase;line-height:56px;z-index:2}

  /* ---- the photo and its mount ---- */
  .area{position:absolute;left:0;right:0;top:132px;bottom:60px;display:flex;align-items:center;justify-content:center}
  .wrap{transform:rotate(var(--tilt,0deg));filter:drop-shadow(0 14px 18px rgba(28,42,74,.14)) drop-shadow(0 3px 4px rgba(28,42,74,.12))}
  .paper{background:var(--mat);padding:var(--b) var(--b) 0;display:flex;flex-direction:column;align-items:center}
  .paper img{display:block;width:var(--w);height:var(--h)}
  .cap{font-family:var(--serif);font-style:italic;font-size:48px;line-height:1.18;text-align:center;
    max-width:var(--w);padding:22px 10px 26px;text-wrap:balance}
  .cap.long{font-family:var(--sans);font-style:normal;font-size:46px;line-height:1.3}
  .nocap .paper{padding-bottom:var(--b)}
  .era-round .paper{border-radius:var(--r)}
  .era-round .wrap{filter:drop-shadow(0 14px 18px rgba(28,42,74,.15)) drop-shadow(0 3px 4px rgba(28,42,74,.12))}
  .rule50 .paper img{outline:2px solid rgba(28,42,74,.16);outline-offset:8px}

  /* ---- year pill: bottom-left, never moves ---- */
  .year{position:absolute;left:112px;bottom:72px;height:64px;padding:0 28px;border-radius:999px;display:flex;align-items:center;
    font-family:var(--serif);font-size:44px;z-index:2;box-sizing:border-box}
  .t40 .year,.t70 .year{background:var(--navy);color:var(--ivory)}
  .t50 .year{background:var(--mustard);color:var(--navy)}
  .t60 .year{background:var(--mat);color:var(--navy);border:4px solid var(--coral)}

  /* ---- divider cards: full colour ---- */
  .div{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .div .lab{font-family:var(--cond);font-weight:500;font-size:30px;letter-spacing:5px;text-transform:uppercase;margin-bottom:26px}
  .div .big{font-family:var(--serif);font-size:220px;line-height:1.05}
  .div .big.long{font-size:150px}
  .div .rule{width:260px;height:3px;margin:40px 0 30px}
  .div .scr{font-family:var(--script);font-size:84px;line-height:1.1}
  .d40,.d70{background:var(--navy);color:var(--ivory)}
  .d40 .lab,.d40 .scr{color:var(--mustard)} .d40 .rule{background:var(--mustard)}
  .d70 .lab,.d70 .scr{color:var(--coral)} .d70 .rule{background:var(--coral)}
  .d50{background:var(--mustard);color:var(--navy)} .d50 .rule{background:var(--navy)}
  .d60{background:var(--coral);color:var(--navy)} .d60 .rule{background:var(--navy)}

  /* ---- invitation and hospital ---- */
  .invite .paper{padding:16px}
  .story{position:absolute;left:112px;right:112px;top:150px;bottom:150px;display:flex;align-items:center;gap:70px}
  .story .area{position:static;flex:0 0 auto;display:block}
  .story .txt{flex:1 1 0}
  .story .tit{font-family:var(--serif);font-size:74px;line-height:1.05;margin-bottom:28px}
  .story .body{font-size:46px;line-height:1.3}
  .tstory .year{background:var(--navy);color:var(--ivory)}

  /* ---- cards ---- */
  .fam{display:flex;align-items:center;justify-content:center;gap:90px;padding:0 160px}
  .fam .left{text-align:right}
  .fam .left .t{font-family:var(--serif);font-size:114px;line-height:1}
  .fam .left .s{font-family:var(--script);font-size:76px;color:var(--coral);margin-top:10px}
  .fam .vr{width:3px;align-self:stretch;margin:260px 0;background:var(--mustard)}
  .fam .lab{font-family:var(--cond);font-weight:500;font-size:30px;letter-spacing:5px;text-transform:uppercase;margin:0 0 14px}
  .fam .row{display:grid;grid-template-columns:repeat(2,minmax(300px,auto));gap:10px 70px;font-family:var(--serif)}
  .fam .kids{font-size:64px} .fam .gk{font-size:54px}
  .fam hr{border:0;border-top:2px solid rgba(28,42,74,.2);margin:40px 0 34px}
  .happy{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .happy .s{font-family:var(--script);font-size:142px;line-height:1}
  .happy .n{font-family:var(--serif);font-size:208px;line-height:1.05}
  .happy .rule{width:324px;height:3px;background:var(--mustard);margin:34px 0 30px}
  .happy .m{font-size:48px}
  .note{display:flex;align-items:center;justify-content:center;text-align:center;font-size:46px;padding:0 260px;line-height:1.35}

</style>
</head>
<body>
<div id="stage"><div class="slide" id="s0"></div><div class="slide" id="s1"></div></div>
<script src="birthday80-local/photos.js"></script>
<script>
(function(){
  var Q = new URLSearchParams(location.search);
  var SPEED = Math.max(0.1, parseFloat(Q.get('speed')) || 1);
  var D = window.BIRTHDAY80 || null, DIR = 'birthday80-local/photos/';
  var stage = document.getElementById('stage');
  function fit(){ var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = 'translate(' + (innerWidth - 1920 * s) / 2 + 'px,' + (innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')'; }
  addEventListener('resize', fit); fit();

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function shape(cls, css){ return '<i class="shape ' + cls + '" style="' + css + '"></i>'; }
  var C = { navy:'var(--navy)', coral:'var(--coral)', mustard:'var(--mustard)', mat:'var(--mat)' };

  /* ---- the chapters ---- */
  var ERA = {
    t40: { label:'The 1940s', border:24, tilt:-0.65, deckle:true,
           title:'The 1940s', script:'The first few years',
           shapes: shape('disc','left:-130px;top:-130px;width:230px;height:230px;background:' + C.navy)
                 + shape('disc','right:-70px;bottom:-70px;width:190px;height:190px;background:' + C.coral)
                 + shape('pill','left:-24px;top:420px;width:56px;height:190px;background:' + C.mustard),
           dshapes: shape('disc','left:-120px;top:-120px;width:300px;height:300px;background:' + C.mustard)
                 + shape('disc','right:-140px;bottom:-140px;width:360px;height:360px;background:' + C.coral) },
    t50: { label:'The 1950s', border:24, tilt:0.55, deckle:true, rule:true,
           title:'The 1950s', script:'Ages 3 to 13',
           shapes: shape('disc','right:-150px;top:-150px;width:330px;height:330px;background:' + C.mustard)
                 + shape('disc','right:-60px;bottom:-60px;width:150px;height:150px;background:' + C.navy)
                 + shape('pill','right:-24px;top:430px;width:56px;height:170px;background:' + C.coral),
           dshapes: shape('disc','right:-130px;top:-130px;width:320px;height:320px;background:' + C.navy)
                 + shape('pill','left:-30px;bottom:180px;width:70px;height:240px;background:' + C.coral) },
    t60: { label:'The 1960s', border:28, tilt:-0.55, round:16,
           title:'The 1960s', script:'Ages 13 to 23',
           shapes: shape('disc','left:-130px;top:-130px;width:230px;height:230px;background:' + C.coral)
                 + shape('disc','right:-90px;bottom:-90px;width:230px;height:230px;background:' + C.mustard)
                 + shape('pill','left:-24px;top:380px;width:56px;height:180px;background:' + C.navy),
           dshapes: shape('disc','left:-140px;bottom:-160px;width:380px;height:380px;background:' + C.navy)
                 + shape('disc','right:-90px;top:-90px;width:240px;height:240px;background:' + C.mustard) },
    t70: { label:'The 1970s & 1980', border:20, tilt:0.6, round:11,
           title:'The 1970s<br>& 1980', titleLong:true, script:'Family life unfolds',
           shapes: shape('disc','right:-150px;top:-150px;width:330px;height:330px;background:' + C.navy)
                 + shape('disc','right:-100px;bottom:-100px;width:260px;height:260px;background:' + C.mustard)
                 + shape('pill','left:-24px;top:420px;width:56px;height:170px;background:' + C.coral),
           dshapes: shape('disc','left:-130px;top:-130px;width:320px;height:320px;background:' + C.mustard)
                 + shape('disc','right:-150px;bottom:-150px;width:380px;height:380px;background:' + C.coral) },
    tmix:{ label:'More good days', border:24, tilt:-0.45, round:5,
           shapes: shape('disc','right:-150px;top:-150px;width:320px;height:320px;background:' + C.navy)
                 + shape('disc','left:-70px;top:-70px;width:150px;height:150px;background:' + C.mustard)
                 + shape('pill','right:-24px;bottom:240px;width:56px;height:170px;background:' + C.coral) }
  };
  function eraOf(year){
    var m = String(year || '').match(/(19|20)\d\d/); if (!m) return null;
    var y = +m[0]; return y < 1950 ? 't40' : y < 1960 ? 't50' : y < 1970 ? 't60' : 't70';
  }
  function yearOnly(year){ var m = String(year || '').match(/(19|20)\d\d/); return m ? m[0] : ''; }

  /* ---- slides that are only words ---- */
  function divider(k){ var e = ERA[k], d = 'd' + k.slice(1);
    return { secs:7, cls:'div ' + d, html: e.dshapes + '<div class="lab">The family album</div>'
      + '<div class="big' + (e.titleLong ? ' long' : '') + '">' + e.title + '</div><div class="rule"></div><div class="scr">' + e.script + '</div>' }; }
  function happy(){ return { secs:9, cls:'happy', html: ERA.t40.dshapes
      + '<div class="s">Happy 80th,</div><div class="n">' + esc(D.name || '') + '!</div><div class="rule"></div><div class="m">With love from all of us.</div>' }; }
  function family(){ var f = D.family || {}, k = f.kids || [], g = f.grandkids || [];
    if (!k.length && !g.length) return null;
    function names(list, cls){ return '<div class="row ' + cls + '">' + list.map(function(n){ return '<div>' + esc(n) + '</div>'; }).join('') + '</div>'; }
    return { secs:14, cls:'fam', html: ERA.tmix.shapes + '<div class="left"><div class="t">His family</div><div class="s">With love</div></div><div class="vr"></div><div>'
      + (k.length ? '<div class="lab">His kids</div>' + names(k, 'kids') : '') + (k.length && g.length ? '<hr>' : '')
      + (g.length ? '<div class="lab">His grandkids</div>' + names(g, 'gk') : '') + '</div>' }; }

  /* ---- the running order for one loop ---- */
  function loop(){
    var ph = (D.photos || []).map(function(p, i){ p._i = i; return p; });
    var out = [], cur = null;
    ph.filter(function(p){ return p.part === 'a'; }).forEach(function(p, i){ out.push({ photo:p, kind: i === 0 ? 'invite' : 'story', secs: i === 0 ? 12 : 16 }); });
    ph.filter(function(p){ return p.part === 'b'; }).forEach(function(p){
      var k = eraOf(p.year) || cur || 't40';
      if (k !== cur){ out.push(divider(k)); cur = k; }
      out.push({ photo:p, kind:'dated', era:k, secs:9 });
    });
    var fam = family(); if (fam) out.push(fam);
    shuffle(ph.filter(function(p){ return p.part === 'c'; })).forEach(function(p, i){
      if (i && i % 25 === 0) out.push(happy());
      out.push({ photo:p, kind:'mixed', era:'tmix', secs:8 });
    });
    out.push(happy());
    return out;
  }

  /* ---- a photo slide, sized to its photo ---- */
  function photoSlide(item, ar){
    var p = item.photo, src = esc(DIR + p.file);
    if (item.kind === 'invite'){
      var h = 900, w = Math.round(h * ar); if (w > 1500){ w = 1500; h = Math.round(w / ar); }
      return { cls:'invite', html: '<div class="area" style="top:90px;bottom:90px"><div class="wrap"><div class="paper"><img src="' + src + '" alt="The invitation" style="width:' + w + 'px;height:' + h + 'px"></div></div></div>' };
    }
    if (item.kind === 'story'){
      var sw = 930, sh = Math.round(sw / ar); if (sh > 620){ sh = 620; sw = Math.round(sh * ar); }
      return { cls:'tstory', html: ERA.tmix.shapes + '<div class="hdr">November 1946</div><div class="story"><div class="area"><div class="wrap" style="--tilt:-0.4deg"><div class="paper" style="--b:24px;padding-bottom:24px">'
        + '<img src="' + src + '" alt="" style="width:' + sw + 'px;height:' + sh + 'px"></div></div></div>'
        + '<div class="txt"><div class="tit">The story begins</div><div class="body">' + esc(p.caption) + '</div></div></div><div class="year">1946</div>' };
    }
    var e = ERA[item.era], cap = p.caption || '';
    if (item.kind === 'mixed' && p.year) cap = cap ? cap + ' · ' + p.year : p.year;
    var long = cap.length > 60;
    var mods = (e.round ? ' era-round' : '') + (e.rule ? ' rule50' : '') + (cap ? '' : ' nocap');
    var yr = item.kind === 'dated' ? yearOnly(p.year) : '';
    return { cls: item.era + mods, deckle: !!e.deckle, ar: ar, hasCap: !!cap,
      html: e.shapes + '<div class="hdr">' + e.label + '</div>'
        + '<div class="area"><div class="wrap" style="--tilt:' + e.tilt + 'deg"><div class="paper" style="--b:' + e.border + 'px;--r:' + (e.round || 0) + 'px">'
        + '<img src="' + src + '" alt="' + esc(cap || 'Family photo') + '">'
        + (cap ? '<div class="cap' + (long ? ' long' : '') + '">' + esc(cap) + '</div>' : '') + '</div></div></div>'
        + (yr ? '<div class="year">' + yr + '</div>' : '') };
  }
  // Size the photo inside its window (1180 x 690 at most), shrinking it if the caption needs a second line.
  function sizePhoto(slide, ready){
    var img = slide.querySelector('.paper img'), cap = slide.querySelector('.cap'), paper = slide.querySelector('.paper');
    if (!img || !ready.ar) return;
    function set(maxH){ var w = 1180, h = w / ready.ar; if (h > maxH){ h = maxH; w = h * ready.ar; }
      paper.style.setProperty('--w', Math.round(w) + 'px'); paper.style.setProperty('--h', Math.round(h) + 'px'); }
    set(690);
    if (cap){ var lines = Math.round((cap.offsetHeight - 48) / 57); if (lines > 1) set(690 - (lines - 1) * 57 - (lines > 2 ? 40 : 0)); }
    else set(740);
    if (ready.deckle) deckle(paper);
  }
  // A torn-paper edge on the mount only (never on the photo): a jittered outline, clipped.
  function deckle(el){
    var w = el.offsetWidth, h = el.offsetHeight, pts = [], step = 22;
    function j(){ return (Math.random() * 2.2).toFixed(1); }
    for (var x = 0; x <= w; x += step) pts.push(Math.min(x, w) + 'px ' + j() + 'px');
    for (var y = step; y <= h; y += step) pts.push((w - j()) + 'px ' + Math.min(y, h) + 'px');
    for (x = w - step; x >= 0; x -= step) pts.push(Math.max(x, 0) + 'px ' + (h - j()) + 'px');
    for (y = h - step; y > 0; y -= step) pts.push(j() + 'px ' + y + 'px');
    el.style.clipPath = 'polygon(' + pts.join(',') + ')';
  }

  /* ---- player: two slides, the next one built while the current one shows ---- */
  var slides = [document.getElementById('s0'), document.getElementById('s1')], front = 0, queue = [], timer, paused = false;
  function render(item, done){
    if (!item.photo){ done(item); return; }
    var im = new Image(), t = setTimeout(fail, 20000);
    function fail(){ clearTimeout(t); im.onload = im.onerror = null; console.warn('Birthday deck: skipped ' + item.photo.file); done(null); }
    im.onload = function(){ clearTimeout(t); if (!im.naturalWidth) return fail();
      var r = photoSlide(item, im.naturalWidth / im.naturalHeight); r.secs = item.secs; done(r); };
    im.onerror = fail; im.src = DIR + item.photo.file;
  }
  function next(){
    if (!queue.length) queue = loop();
    var item = queue.shift();
    render(item, function(ready){
      if (!ready){ next(); return; }
      var back = slides[1 - front];
      back.className = 'slide ' + (ready.cls || '');
      back.style.clipPath = '';
      back.innerHTML = ready.html;
      sizePhoto(back, ready);
      var img = back.querySelector('img'), went = false;
      function go(){ if (!went){ went = true; show(back, ready.secs); } }
      if (img && img.decode) img.decode().then(go, go); else go();
      setTimeout(go, 2500);
    });
  }
  function show(el, secs){
    slides[front].classList.remove('on'); el.classList.add('on'); front = slides.indexOf(el);
    clearTimeout(timer); if (!paused) timer = setTimeout(next, secs / SPEED * 1000);
  }
  addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight'){ clearTimeout(timer); next(); }
    if (e.key === 'p' || e.key === 'P'){ paused = !paused; if (!paused) next(); else clearTimeout(timer); }
  });

  if (!D || !(D.photos || []).length){
    slides[0].className = 'slide on note';
    slides[0].innerHTML = '<div>The photos are not on this computer yet. Put the <b>birthday80-local</b> folder next to this page, in screens\\events.</div>';
    return;
  }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function(){
    queue = loop();
    var start = Math.max(0, parseInt(Q.get('start'), 10) || 0);
    queue = queue.slice(Math.min(start, queue.length - 1));
    next();
  });
})();
</script>
</body>
</html>
