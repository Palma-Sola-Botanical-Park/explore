<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winter Nights under the Lights — in-event screen</title>
<link rel="icon" type="image/png" href="../../images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="event-deck.css">
<link rel="stylesheet" href="event-winternights.css">
<!-- In-event deck for Winter Nights. Redesigned 2026-09-25 from Bev's actual
     flyer (winternights.jpg — NOT the -2/-3 files, which are AI mockups and
     must never be shown as real park photography). Midnight ground, soft
     out-of-focus bokeh instead of a fixed glow, a cranberry script line
     echoing the flyer's red lettering, a gift-tag treatment for Toys for
     Tots so it does not read as just another green slide. See
     event-winternights.css for the theme. [Bracketed gold] text is a fact
     still to supply; a real night photo of the lit park would improve the
     welcome/best-outside slides whenever one exists. -->
</head>
<body>
<div class="frame"></div>
<div class="eyebrow-fixed">Palma Sola Botanical Park</div>
<div class="clock" id="clock"></div>
<img class="logo-mark" src="../../images/white_PSBP_logo.png" alt="Palma Sola Botanical Park">
<div class="deck"></div>
<div id="bar"></div>
<script>
window.SLIDES = [
  { id: 'welcome', html:
    '<div class="copy"><div class="wn-script">Palma Sola Botanical Park&rsquo;s</div><div class="wn-word">Winter Nights<em>under the Lights</em></div><ul class="lines" style="margin-top:3vmin"><li>Warm up in here, then go back out &mdash; the lights are the point.</li><li>Free admission. Donations keep the park open all year.</li><li>Four nights only, Thursday to Sunday.</li></ul></div><div class="poster"><img src="../../images/events/winternights.jpg" alt="Winter Nights under the Lights poster"></div>' },
  { id: 'outside', html:
    '<div class="wn-moment"><h1>The best part<br><em style="font-style:italic;color:var(--gold)">is outside.</em></h1><div class="sub">Seriously. Go look.</div><div class="sub" style="margin-top:5vmin;color:var(--ink-quiet);font-style:normal;font-size:.7em">Florida&rsquo;s version of a winter walk &mdash; no snow required.</div></div>' },
  { id: 'curve', html:
    '<div class="copy"><div class="label">The tree at the curve</div><h2>That huge tree by the Front Pond<br><em>isn&rsquo;t a Christmas tree.</em></h2><div class="rule"></div><div class="body">It&rsquo;s a Royal Poinciana &mdash; and our high-school volunteers light it every year, string by string.</div></div>' },
  { id: 'decorated', html:
    '<div class="copy"><div class="label">The decorated trees</div><h2>Who decorated that one?</h2><div class="rule"></div><div class="body">Local families, groups and businesses help turn the park into Winter Nights along the lit walk. Look closely &mdash; each one is different. <span class="todo">[How the voting or judging works, if there is one this year.]</span></div></div>' },
  { id: 'tonight', html:
    '<div class="copy"><div class="label">Tonight</div><div class="where"><div><b>Santa &amp; Mrs. Claus</b><span class="todo">[where they sit, and until when]</span></div><div><b>Gift market</b><span class="todo">[location]</span></div><div><b>Food trucks</b><span class="todo">[location]</span></div><div><b>Hot cider &amp; cocoa</b><span class="todo">[location]</span></div><div><b>Live holiday music</b><span class="todo">[where, and who\'s on tonight]</span></div><div><b>Children\'s crafts</b><span class="todo">[location]</span></div></div></div>' },
  { id: 'toys', html:
    '<div class="gifttag"><div class="label">Toys for Tots</div><h2>Bring a toy,<br><em>make a kid\'s December.</em></h2><div class="rule"></div><div class="body">New, unwrapped toys are being collected all four nights for Toys for Tots. The drop box is <span class="todo" style="color:var(--cranberry)">[location]</span>.</div></div>' },
  { id: 'practical', html:
    '<div class="copy"><div class="label">Good to know</div><div class="where"><div><b>Restrooms</b><span>Inside the Galleria, and the ramped building by the Pavilion</span></div><div><b>Step-free routes</b><span>The Galleria and the office both have ramps as well as stairs</span></div><div><b>Lost &amp; found</b><span class="todo">[the office / a table]</span></div><div><b>First aid</b><span class="todo">[where]</span></div></div></div>' },
  { id: 'support', html:
    '<div class="copy"><div class="label">Free to visit, funded by you</div><h2>The lights are free.<br><em>The park runs on you.</em></h2><div class="rule"></div><div class="body">No entrance fee, no government money. Members and donors keep this park open every day of the year, lights or no lights.</div><div class="qr-row"><div class="qr-card"><img src="../../images/qr-donate-onetime.png" alt="QR code for a one-time donation"><div class="qr-label">One-time gift</div></div><div class="qr-card"><img src="../../images/qr-membership.png" alt="QR code to join as a member"><div class="qr-label">Membership</div></div></div></div>' }
];
</script>
<script src="event-deck.js"></script>
</body>
</html>
