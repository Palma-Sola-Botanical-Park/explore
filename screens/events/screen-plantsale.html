<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fall Plant & Garden Festival — in-event screen</title>
<link rel="icon" type="image/png" href="../../images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="event-deck.css">
<!-- In-event deck for the Fall Plant & Garden Festival. The visitor is already here. [Bracketed gold] text is a fact Randy or Bev still has to supply. Poster is Bev's (fallplant.jpg). -->
</head>
<body>
<div class="frame"></div>
<div class="eyebrow-fixed">Palma Sola Botanical Park</div>
<div class="clock" id="clock"></div>
<img class="logo-mark" src="../../images/white_PSBP_logo.png" alt="Palma Sola Botanical Park">
<div class="deck"></div>
<div id="bar"></div>
<script>
window.SLIDES = [
  { id: 'welcome', html:
    '<div class="copy"><div class="label">Welcome to the</div><h1>Fall Plant &amp;<br><em>Garden Festival</em></h1><div class="rule"></div><ul class="lines"><li>You made it. The plants are outside — this room is for cooling off.</li><li>Free admission, all day. Every purchase supports the park.</li><li>Bring a wagon — and a friend.</li></ul></div><div class="poster"><img src="../../images/events/fallplant.jpg" alt="Fall Plant &amp; Garden Festival poster"></div>' },
  { id: 'where', html:
    '<div class="copy"><div class="label">Where to find things today</div><div class="where"><div><b>Plant vendors</b><span class="todo">[which lawn / field — Bev]</span></div><div><b>Artisans</b><span class="todo">[where the artisan booths are]</span></div><div><b>Food</b><span class="todo">[food trucks / tent location]</span></div><div><b>Music</b><span class="todo">[stage or deck]</span></div><div><b>Restrooms</b><span>Inside the Galleria, and the ramped building by the Pavilion</span></div><div><b>Checkout &amp; donations</b><span class="todo">[table location]</span></div></div></div>' },
  { id: 'signs', html:
    '<div class="copy"><div class="label">While you are here</div><h2>Scan a sign.<br><em>Meet the plant.</em></h2><div class="rule"></div><div class="body">More than a hundred plants in the park carry a small laminated sign with a QR code. Scan one with your phone and you get that plant\'s own page: where it comes from, how to know it, and photographs taken right here by the people who walk this park.</div><div class="foot">Every photograph on those pages was taken in this park.<span>Most on phones. A few on serious cameras.</span></div></div>' },
  { id: 'rarefruit', html:
    '<div class="copy"><div class="label">Don\'t miss</div><h2>The Rare Fruit Garden</h2><div class="rule"></div><div class="body">Past the Pavilion and the raised restrooms, a garden of tropical fruit trees planted and tended by the Manatee Rare Fruit Council — jackfruit, black sapote, longan, mango and more, each with its own big sign.</div><div class="body">Walk in at the big Rare Fruit Garden sign and follow the trail south to the bridge.</div></div>' },
  { id: 'support', html:
    '<div class="copy"><div class="label">Free to visit, funded by you</div><h2>Take a plant home.<br><em>Take the park with it.</em></h2><div class="rule"></div><div class="body">There is no entrance fee here, and no government money. Members and donors keep the gates open 365 days a year. A plant from a vendor today, a membership, or a one-time gift all do the same job.</div><div class="qr-row"><div class="qr-card"><img src="../../images/qr-donate-onetime.png" alt="QR code for a one-time donation"><div class="qr-label">One-time gift</div></div><div class="qr-card"><img src="../../images/qr-membership.png" alt="QR code to join as a member"><div class="qr-label">Membership</div></div></div></div>' },
  { id: 'inat', html:
    '<div class="copy"><div class="label">Curious about the wildlife here?</div><h2>Photograph it.<br><em>We\'ll find out what it is.</em></h2><div class="rule"></div><div class="body">Every plant and animal page on our website started as a photograph someone posted to iNaturalist from inside this park. Ask a volunteer how — it takes a phone and a minute.</div></div>' }
];
</script>
<script src="event-deck.js"></script>
</body>
</html>
