<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you, Friends of the Park — deck renovation</title>
<link rel="icon" type="image/png" href="../../images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="event-deck.css">
<!-- Thank-you deck for the deck renovation, played in the Galleria during the
     plaque dedication at the Fall Plant & Garden Festival. Four slides in
     order, about 40 seconds a loop: thank you, the names (two slides,
     alphabetical), the closing line. It supports the person speaking, so it is
     deliberately still: slow crossfades, nothing moving, no sound.
     The look is type only, like the plaque: cream ground, a fine double gold
     border, centred lines, a small gold lozenge between two rules. No drawings.
     The only images are the two logos at the bottom: ours and the matching donor's.
     Shared mechanics come from event-deck.css / event-deck.js; the theme is
     inline below so the whole deck is this one file. To change a name, edit
     the two lists in the script at the bottom. An entry written as
     {memory:'Name'} gets the small "In memory of" line above it. -->
<style>
:root{
  --ground:#f6f1e5; --glow:#fcf9f2; --ink:#1a3a1f; --ink-soft:#4d5b4a;
  --gold:#b0822a; --rule:rgba(176,130,42,.55); --rule-faint:rgba(176,130,42,.28);
  --fade:2s;
}
body{background:var(--ground);color:var(--ink)}
.slide .bg{background:radial-gradient(130vmin 90vmin at 50% 42%, var(--glow) 0%, var(--ground) 75%)}
.clock,#bar{display:none}

/* A double hairline, like the border of an engraved card */
.frame{border-color:var(--rule)}
.frame::after{content:'';position:absolute;inset:.9vmin;border:1px solid var(--rule-faint)}

/* Our logo and the Bishop-Parker Foundation's, bottom centre on every slide,
   either side of a gold hairline. Fixed, so they stay put through each fade.
   Both in their own colours; theirs is never recoloured. */
.logos{position:fixed;left:0;right:0;bottom:calc(var(--frame) + 2.2vmin);z-index:41;
  display:flex;align-items:center;justify-content:center;gap:4.4vmin}
.logos img{display:block;width:auto}
.logos .ours{height:8.6vmin}
.logos .theirs{height:6.8vmin}   /* a touch taller: their thin grey lettering reads lighter than our solid green */
.logos i{width:1px;height:6.4vmin;background:var(--rule)}

.slide{justify-content:center;text-align:center}
.copy{flex:0 1 auto;max-width:150vmin}

/* rule — lozenge — rule */
.orn{display:flex;align-items:center;justify-content:center;gap:1.8vmin;margin:3.8vmin auto}
.orn::before,.orn::after{content:'';width:13vmin;height:1px;background:var(--gold)}
.orn i{width:.9vmin;height:.9vmin;background:var(--gold);transform:rotate(45deg)}

/* Slides 1 and 4 — one thought, huge */
.kicker{font-family:var(--serif);font-style:italic;font-size:6.4vmin;color:var(--gold);line-height:1.1;margin-bottom:1vmin}
.title{font-family:var(--serif);font-weight:400;font-size:11.5vmin;line-height:1.04;letter-spacing:-.005em}
.title.two{font-size:9.6vmin}
.title em{font-style:italic;color:var(--gold)}
.lead{font-size:4.2vmin;line-height:1.35;font-weight:400}
.lead.small{font-size:3.7vmin}
.match{margin-top:3.4vmin;font-size:3vmin;color:var(--ink-soft)}
.match b{font-weight:600;color:var(--ink)}

/* Slides 2 and 3 — the names, two centred columns either side of a hairline.
   Both slides come from one function, so they are identical apart from the
   names. Rows are a fixed height so the two columns line up whether or not an
   entry carries an "In memory of" line. */
.slide.names{align-items:flex-start;padding-top:calc(var(--frame) + 6.4vmin)}
.names .copy{width:100%}
.nm-h{font-family:var(--serif);font-weight:400;font-size:6.6vmin;line-height:1.08}
.nm-sub{font-size:2.9vmin;color:var(--ink-soft);margin-top:.8vmin}
.names .orn{margin:2.6vmin auto 1.4vmin}
.nm-grid{display:grid;grid-auto-flow:column;grid-template-columns:1fr 1fr;grid-template-rows:repeat(8,7.2vmin);
  column-gap:10vmin;max-width:142vmin;margin:0 auto;
  background:linear-gradient(var(--rule-faint),var(--rule-faint)) center/1px 92% no-repeat}
.nm{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;white-space:nowrap;
  font-size:3.9vmin;line-height:1.12;font-weight:600}
.nm i{display:block;font-family:var(--serif);font-style:italic;font-weight:400;font-size:2.3vmin;line-height:1.15;color:#86621a}   /* deeper gold: small type has to survive a bright room */
</style>
</head>
<body>
<div class="frame"></div>
<div class="logos"><img class="ours" src="../../images/psbp_logo_green.png" alt="Palma Sola Botanical Park"><i></i><img class="theirs" src="../../images/logos/bishop-parker.webp" alt="Bishop-Parker Foundation"></div>
<div class="clock" id="clock"></div>
<div class="deck"></div>
<div id="bar"></div>
<script>
/* The names, alphabetical, exactly as supplied. {memory:'…'} = an "In memory of" entry. */
var NAMES_1 = [
  'Bill & Pam Blalock', 'Guy & Patricia Bond', 'Ken & Cary Brickse', 'Emily & Frank Buskirk',
  'Susan & G. Slade Cargill, III', 'Maddy & Ed Freshwater', 'Fritzmeier/Paxton', 'Ralph & Sandy Garrison',
  'Gifts from the Heart Foundation', 'Leah & Ray Greenberg', 'Jack & Paula Hawkins', 'Sharon & Tommie Howze',
  'Barbara Jennings', 'Betsy Lieberman', {memory: 'Rebecca S. Linton'}
];
var NAMES_2 = [
  'John & Susan Lowenberg', 'Steve & Kristin Mead', 'Bruce & Christine Meyer', {memory: 'Turner Miles'},
  'Stewart & Trudy Moon', 'Merrie Lynn & Chick Parker', 'Kevin & Rebecca Pease',
  'The Pullen Family', 'The Seagreaves Family', {memory: 'Alice Trice'}, 'The Van Collie Family',
  {memory: 'John W. & Betty M. Vanderbilt'}, 'Britt & Erin Williams', {memory: 'Eileen Williams'}
];

function esc(s){ return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
var ORN = '<div class="orn"><i></i></div>';

function namesSlide(list){
  return '<div class="copy"><div class="nm-h">With our sincere thanks</div>'
    + '<div class="nm-sub">Friends who helped make our deck renovation possible</div>' + ORN
    + '<div class="nm-grid">' + list.map(function(n){
        return '<div class="nm">' + (typeof n === 'string' ? esc(n) : '<i>In memory of</i>' + esc(n.memory)) + '</div>';
      }).join('') + '</div></div>';
}

window.DECK_ORDER = 'seq';   /* thank you → names → names → closing, in order; opens on thank you */
window.SLIDES = [
  { id: 'thanks', seconds: 8, html:
      '<div class="copy"><div class="kicker">Thank you,</div><div class="title">Friends of the Park</div>' + ORN
    + '<div class="lead">Your generosity made our deck renovation possible.</div>'
    + '<div class="match">With matching support from the <b>Bishop-Parker Foundation</b></div></div>' },
  { id: 'names-1', seconds: 12, html: namesSlide(NAMES_1) },
  { id: 'names-2', seconds: 12, html: namesSlide(NAMES_2) },
  { id: 'community', seconds: 8, html:
      '<div class="copy"><div class="title two">A growing park.<br><em>A generous community.</em></div>' + ORN
    + '<div class="lead small">To our donors, volunteers, vendors and neighbors:<br>thank you for helping Palma Sola Botanical Park<br>grow as a place to gather, learn and discover.</div></div>' }
];
</script>
<script src="event-deck.js"></script>
<script>
/* The names slides start from the top instead of centring. */
document.querySelectorAll('#slide-names-1,#slide-names-2').forEach(function(el){ el.classList.add('names'); });
</script>
</body>
</html>
