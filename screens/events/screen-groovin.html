    '<div class="copy"><div class="label">Tonight\'s band</div><h2>The Pops Orchestra<br><em>of Bradenton &amp; Sarasota</em></h2><div class="rule"></div><div class="body">It started in 1975 as seven or eight musicians meeting at a Senior Friendship Center. Fifty years on it is a 65-piece orchestra that sells out halls across the Suncoast, led since 2011 by Dr. Robyn Bell.</div><div class="body">Tonight you get the small version: the Pops Jazz Combo, sponsored by the Manatee Community Foundation. Groovin\' in the Gardens is the first time the orchestra has played outdoors in a garden — and this is the garden.</div></div><div class="photo-col"><div class="placeholder">[Photo of the Pops Jazz Combo — ask The Pops for one they\'re happy to have on a wall; thepopsorchestra.org]</div></div>' },
