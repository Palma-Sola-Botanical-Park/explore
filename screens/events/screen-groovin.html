<!-- In-event deck for Groovin' in the Gardens (The Pops Orchestra Jazz Combo).
     Redesigned 2026-09-25 from Bev's actual flyer (groovin-2026.jpg): a soft
     garden-party look — deep green brush-script, olive vine + music notes,
     cream paint-stroke callouts, mustard gold — not a generic jazz-club
     palette. See event-groovin.css for the theme; event-deck.css is shared
     mechanics only now. Pops history from bradentonmag.com / scenesarasota.com
     (50th season, 2025-26). Photo of the band is a placeholder until The Pops
     supplies one. [Bracketed gold] text is a fact still to supply. -->
</head>
<body>
<div class="frame"></div>
<div class="eyebrow-fixed">Palma Sola Botanical Park</div>
<div class="clock" id="clock"></div>
<img class="logo-mark" src="../../images/white_PSBP_logo.png" alt="Palma Sola Botanical Park">
<div class="deck"></div>
<div id="bar"></div>
<script>
window.SLIDES = [
  { id: 'welcome', html:
    '<div class="copy"><div class="grv-word">Groovin&rsquo;<em>in the Gardens</em></div>'
    + '<svg class="vine" viewBox="0 0 200 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 30 Q40 6 80 22 T160 14 Q180 10 196 20"/><path d="M30 20 q6 -14 16 -10" /><path d="M70 18 q4 -12 14 -10" /><path d="M112 16 q6 -12 16 -8" /><path d="M150 15 q4 -10 12 -8" /><path d="M46 27l3 -6 3 6" stroke-width="1.6"/><circle cx="46" cy="27" r="2.4" fill="currentColor" stroke="none"/><path d="M96 24l3 -7 3 7" stroke-width="1.6"/><circle cx="96" cy="24" r="2.4" fill="currentColor" stroke="none"/><path d="M132 19l3 -6 3 6" stroke-width="1.6"/><circle cx="132" cy="19" r="2.4" fill="currentColor" stroke="none"/></svg>'
    + '<ul class="lines"><li>Live jazz on the lawn, 4 to 6. Find your spot and settle in.</li><li>Wine, beer, soda and food are <span class="todo">[where]</span>.</li><li>Brought a chair or a blanket? Good. Lawn seating is <span class="todo">[where]</span>.</li></ul></div><div class="poster"><img src="../../images/events/groovin-2026.jpg" alt="Groovin\' in the Gardens poster"></div>' },
  { id: 'seat', bg: '../../images/events/groovin-2026.jpg', html:
    '<div class="grv-hero"><div class="ghost">Groovin&rsquo;</div><div class="copy"><div class="paint">You found a pretty good seat.</div><h2 style="margin-top:2.4vmin">The garden was here first.</h2><div class="rule"></div><div class="body">This was a county nursery. The Royal Palms north-east of the Galleria were grown here for county streets and left behind when the county stopped growing its own trees &mdash; they rooted through their pots where they stood. Everything else here was planted by volunteers since 1993.</div></div></div>' },
  { id: 'timeline', html:
    '<div class="copy"><div class="label">Tonight\'s band, in three dates</div><h2>From a senior center<br><em>to a garden stage.</em></h2><div class="rule"></div><div class="grv-timeline">'
    + '<div class="grv-step"><span class="yr">1975</span><span class="what">Seven or eight musicians, meeting at a Senior Friendship Center.</span></div>'
    + '<div class="grv-step"><span class="yr">Today</span><span class="what">A <b>65-piece orchestra</b> that sells out halls across the Suncoast, led by Dr. Robyn Bell since 2011.</span></div>'
    + '<div class="grv-step"><span class="yr">Tonight</span><span class="what">You get the small version &mdash; <b>the Pops Jazz Combo</b>, right here in the garden.</span></div>'
    + '</div></div>' },
  { id: 'pops', html:
    '<div class="copy"><div class="label">Tonight\'s band</div><h2>The Pops Orchestra<br><em>of Bradenton &amp; Sarasota</em></h2><div class="rule"></div><div class="body">Tonight\'s combo is sponsored by the Manatee Community Foundation. Groovin\' in the Gardens is the first of a new outdoor series for the orchestra &mdash; and this is the garden.</div></div><div class="photo-col"><div class="placeholder">[Photo of the Pops Jazz Combo &mdash; ask The Pops for one they\'re happy to have on a wall; thepopsorchestra.org]</div></div>' },
  { id: 'tonight', html:
    '<div class="copy"><div class="label">Tonight</div><div class="where"><div><b>The music</b><span>4 &ndash; 6 pm &middot; The Pops Orchestra Jazz Combo</span></div><div><b>VIP tables</b><span class="todo">[on the Galleria deck &mdash; confirm]</span></div><div><b>Bar</b><span class="todo">[wine, beer, seltzers, soda, water &mdash; where]</span></div><div><b>Food</b><span class="todo">[what\'s on offer, where]</span></div><div><b>Restrooms</b><span>Inside the Galleria, and the ramped building by the Pavilion</span></div><div><b>Valet</b><span class="todo">[if offered &mdash; where to collect the car]</span></div></div></div>' },
  { id: 'hear', html:
    '<div class="copy"><div class="label">Hear something you like?</div><h2>They play more<br><em>than one afternoon.</em></h2><div class="rule"></div><div class="body">Tonight\'s musicians are part of The Pops Orchestra of Bradenton &amp; Sarasota &mdash; a 65-piece orchestra with a full concert season most of the year.</div><div class="body"><span class="todo">[QR to thepopsorchestra.org / the concert season, if they want that here]</span></div></div>' },
  { id: 'two', html:
    '<div class="copy"><div class="label">Two non-profits, one evening</div><h2>Music you love.<br><em>A park that\'s free.</em></h2><div class="rule"></div><div class="body">Tonight\'s ticket supports The Pops Orchestra and Palma Sola Botanical Park together. The park charges no admission and takes no government money; members and donors keep it open 365 days a year.</div><div class="qr-row"><div class="qr-card"><img src="../../images/qr-membership.png" alt="QR code to join as a member"><div class="qr-label">Become a member</div></div></div></div>' },
  { id: 'lap', bg: '../../images/events/groovin-2026.jpg', html:
    '<div class="grv-hero"><div class="copy"><div class="paint">One more lap before you go?</div><h2 style="margin-top:2.4vmin">The music may be why you came.</h2><div class="rule"></div><div class="body">The garden doesn\'t close when the last note does.</div></div></div>' }
];
</script>
