<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flyover demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,600&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<!-- DEMO: a flyover slide in the style of screens/screen.html, on our own park map (the olive look, same geometry as images/park-map.svg).
     GENERATED: do not hand-edit. ?tv=1 hides the demo buttons (the TV menu uses it). -->
<style>
:root{
  --shade:8,18,9;
  --ground:#0c1a10; --ground-2:#122316;
  --gold:#eabc5a; --gold-deep:#c5922a; --paper:#fdfcf8;
  --ink-invert:rgba(253,252,248,.78); --ink-quiet:rgba(253,252,248,.52);
  --rule:rgba(234,188,90,.34);
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Source Sans 3',-apple-system,'Segoe UI',sans-serif;
  --frame:2.6vmin; --pad:4.4vmin;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ground)}
body{font-family:var(--sans);color:var(--paper);-webkit-font-smoothing:antialiased}

/* ── the deck's chrome, copied from screens/screen.html ───────────────── */
.frame{position:fixed;inset:var(--frame);border:1px solid var(--rule);pointer-events:none;z-index:40}
.wordmark,.clock{
  position:fixed;top:calc(var(--frame) - .95em);z-index:41;background:var(--ground);padding:0 1.8vmin;
  font-size:2.5vmin;white-space:nowrap;
}
.wordmark{left:calc(var(--frame) + var(--pad));font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.clock{right:calc(var(--frame) + var(--pad));font-weight:600;letter-spacing:.16em}
.clock .day{opacity:.6;text-transform:uppercase;letter-spacing:.2em;font-size:.86em}
.clock .sep{color:var(--gold);opacity:.55;margin:0 .7em}
.credit{
  position:fixed;right:calc(var(--frame) + var(--pad));bottom:calc(var(--frame) + 3.2vmin);
  z-index:41;text-align:right;opacity:0;transition:opacity .6s;text-shadow:0 1px 14px rgba(0,0,0,.6);
}
.credit.on{opacity:1}
.credit .lbl{display:block;font-size:1.25vmin;font-weight:700;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-bottom:.35vmin}
.credit .who{display:block;font-family:var(--serif);font-size:2.6vmin;font-weight:700;line-height:1.1}
.credit .terms{display:block;font-size:1.4vmin;font-weight:600;letter-spacing:.14em;color:var(--ink-quiet);margin-top:.5vmin}

/* ── the camera ──────────────────────────────────────────────────────────
   The map is one flat plane; the camera is a CSS transform on it, set every
   frame from the timeline below. Place names and photos stand up off the
   plane as signposts, counter-rotated so they always face the room. */
#cam{position:fixed;inset:0;overflow:hidden;perspective:1500px;background:var(--ground-2)}
#plane{position:absolute;left:0;top:0;width:1408px;height:1408px;transform-origin:0 0;transform-style:preserve-3d}
#map{position:absolute;left:0;top:0;display:block}
#map .pm-labels,#map .furn,#map .scale,#map .lbl-furn{display:none}   /* the signposts carry the names; no north arrow or scale bar on a moving map */
#over{position:absolute;left:0;top:0;overflow:visible}
#signs{position:absolute;left:0;top:0;transform-style:preserve-3d}
.route{fill:none;stroke:var(--gold);stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(234,188,90,.8))}
.route-under{fill:none;stroke:#1a3a1f;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.pin{fill:var(--gold);stroke:#1a3a1f}
.pin.lit{fill:#fff6dc}
.ring{fill:none;stroke:var(--gold)}
.comet{fill:#fff6dc;filter:drop-shadow(0 0 8px #eabc5a) drop-shadow(0 0 22px #eabc5a)}

.sign{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;transform-style:preserve-3d;
  opacity:0;transition:opacity .45s ease}
.sign.on{opacity:1}
.sign .in{
  position:absolute;left:0;bottom:0;transform:translateX(-50%) translateY(14px) scale(.6);
  transform-origin:50% 100%;transition:transform .55s cubic-bezier(.2,1.5,.4,1);
  display:flex;flex-direction:column;align-items:center;
}
.sign.on .in{transform:translateX(-50%) translateY(0) scale(1)}
.plate{
  background:rgba(12,26,16,.88);border:1px solid var(--rule);border-radius:.6vmin;
  padding:.5vmin 1.4vmin .6vmin;white-space:nowrap;
  font:600 2.5vmin/1.15 var(--sans);letter-spacing:.06em;color:var(--paper);
  box-shadow:0 .6vmin 2.4vmin rgba(0,0,0,.45);
}
.sign.water .plate{font:italic 600 2.6vmin/1.15 var(--serif);letter-spacing:.01em;color:#d5ecf6}
.sign.dest .plate{background:var(--gold);color:#1a2a12;border-color:var(--gold);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:2.7vmin}
.sign.here .plate{background:var(--paper);color:#1a2a12;border-color:var(--paper);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:2.9vmin;text-align:center}
.sign.here .bname{display:block;font:700 3.6vmin/1.1 var(--serif);letter-spacing:.01em;text-transform:none;margin-top:.3vmin}   /* the TV's building, under "You are here" */
.stalk{width:2px;height:3vmin;background:linear-gradient(var(--paper),rgba(253,252,248,.2))}
.sign.dest .stalk{background:linear-gradient(var(--gold),rgba(234,188,90,.2))}

/* the photo that rises out of a pin */
.sign.photo .in{transition:transform .8s cubic-bezier(.16,1.25,.3,1)}
.sign.photo .in{transform:translateX(-50%) translateY(6vmin) scale(.3)}
.sign.photo.on .in{transform:translateX(-50%) translateY(0) scale(1)}
.snap{
  width:42vmin;height:29vmin;border-radius:.8vmin;background:#203624 center/cover no-repeat;
  border:.5vmin solid var(--paper);box-shadow:0 1.6vmin 5vmin rgba(0,0,0,.6);
}
.sign.photo .stalk{height:7vmin;width:3px;background:linear-gradient(var(--paper),rgba(253,252,248,.15))}

/* shading: sky at the far edge when tilted, the deck's left-hand darkener for the words */
.shade{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:
    linear-gradient(to bottom,rgba(var(--shade),.96) 0%,rgba(var(--shade),.55) 14%,rgba(var(--shade),0) 34%),
    linear-gradient(to top,rgba(var(--shade),.92) 0%,rgba(var(--shade),.55) 22%,rgba(var(--shade),0) 48%),
    linear-gradient(to right,rgba(var(--shade),.86) 0%,rgba(var(--shade),.62) 24%,rgba(var(--shade),.12) 46%,rgba(var(--shade),0) 60%);
}

/* ── the words, bottom-left, in the deck's own type ─────────────────────── */
.copy{position:fixed;left:calc(var(--frame) + var(--pad));bottom:8.5vmin;z-index:10;max-width:46vw}
.copy > *{transition:opacity .5s ease,transform .5s ease}
.copy.out > *{opacity:0;transform:translateY(1.2vmin)}
.eyebrow{
  font-size:clamp(1.15rem,3.1vmin,2.6rem);font-weight:700;letter-spacing:.24em;text-transform:uppercase;
  color:var(--gold);margin-bottom:1.8vmin;display:flex;flex-wrap:wrap;gap:0 1.1em;
}
.eyebrow .where::before{content:'→';margin-right:.42em;opacity:.75}
.headline{font-family:var(--serif);font-weight:700;line-height:1.02;font-size:clamp(2.6rem,7.4vmin,7rem);
  letter-spacing:-.012em;text-shadow:0 2px 26px rgba(0,0,0,.45);text-wrap:balance}
.latin{font-family:var(--serif);font-style:italic;font-size:clamp(1.1rem,2.9vmin,2.4rem);color:var(--ink-invert);margin-top:.7vmin}
.subhead{font-family:var(--serif);font-size:clamp(1.05rem,2.85vmin,2.3rem);margin-top:1vmin;max-width:34ch;line-height:1.25}
.body{font-size:clamp(1rem,2.6vmin,2.05rem);line-height:1.45;font-weight:300;color:var(--ink-invert);margin-top:2.2vmin;max-width:40ch}
.copy .body{transition-delay:.25s}

/* ── demo-only: banner and controls (hidden with ?tv=1 or the H key) ───── */
.demo{position:fixed;left:50%;transform:translateX(-50%);z-index:60;font:600 15px/1.3 var(--sans);color:#1a2a12}
.banner{top:calc(var(--frame) + 1.6vmin);background:#ffe9a8;border-radius:999px;padding:6px 16px;letter-spacing:.04em;white-space:nowrap}
.controls{top:calc(var(--frame) + 1.6vmin + 34px);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;
  background:rgba(253,252,248,.94);border-radius:10px;padding:7px 12px;max-width:96vw;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.controls .grp{display:flex;gap:4px;align-items:center}
.controls .grp > span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#6b6556;margin-right:2px}
.controls button{font:600 14px var(--sans);border:1px solid #c9c4b8;background:#fff;color:#1a2a12;border-radius:6px;padding:4px 9px;cursor:pointer}
.controls button.on{background:#1a3a1f;color:#fff;border-color:#1a3a1f}
.controls .time{font-variant-numeric:tabular-nums;color:#6b6556;min-width:7ch;text-align:right}
body.tv .demo{display:none}
body.tv{cursor:none}
</style>
</head>

/* ── small helpers ───────────────────────────────────────────────────── */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function lerp(a, b, k){ return a + (b - a) * k; }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function ease(k){ k = clamp(k, 0, 1); return k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2; }   // in-out cubic
function easeOut(k){ k = clamp(k, 0, 1); return 1 - Math.pow(1 - k, 3); }
function angLerp(a, b, k){ var d = ((b - a + 540) % 360) - 180; return a + d * k; }
function bearing(a, b){ return Math.atan2(b[0] - a[0], -(b[1] - a[1])) * 180 / Math.PI; }

  return { cx: lerp(A.cx, B.cx, k), cy: lerp(A.cy, B.cy, k), w: Math.exp(lerp(Math.log(A.w), Math.log(B.w), k)),
           tilt: lerp(A.tilt, B.tilt, k), b: angLerp(A.b, B.b, k), fx: lerp(A.fx, B.fx, k), fy: lerp(A.fy, B.fy, k) };

/* a polyline you can walk along by fraction */
function walker(pts){
  var seg = [], L = 0;
  for (var i = 1; i < pts.length; i++){
    var d = Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);
    seg.push(d); L += d;
  }
  return { L: L, at: function(f){
    var want = clamp(f, 0, 1) * L;
    for (var i = 0; i < seg.length; i++){
      if (want <= seg[i] || i === seg.length - 1){
        var k = seg[i] ? want / seg[i] : 0;
        return [lerp(pts[i][0], pts[i+1][0], k), lerp(pts[i][1], pts[i+1][1], k)];
      }
      want -= seg[i];
    }
  }};
}

/* ── building one trip's timeline ────────────────────────────────────── */
var T = null;   // the current timeline

function build(){
  var trip = DATA.trips[opt.trip], origin = DATA.origins[opt.from];
  var pts = trip.routes[opt.from], W = walker(pts), P = opt.pace;
  // The camera rides a SMOOTHED copy of the walk. Following the drawn line exactly made every
  // little jog in the path data jolt the view. Sample evenly, then average over about 120 map px

      return [sx / (2*win + 1), sy / (2*win + 1)];

  }
  var WC = walker(cam);
  signsEl.innerHTML = ''; pinsEl.innerHTML = '';

  var d = 'M' + pts.map(function(p){ return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' L');
  routeEl.setAttribute('d', d); routeUnder.setAttribute('d', d);
  var RL = routeEl.getTotalLength();
  routeEl.style.strokeDasharray = RL + ' ' + RL; routeUnder.style.strokeDasharray = RL + ' ' + RL;

  // which way is "ahead": straight from where you stand to where you are going
  var B = opt.follow ? bearing(origin, trip.center) : 0;
  // on arrival, swing round to look back across the park, so the far side of the frame is park, not the fence
  var BL = opt.follow ? bearing(trip.center, [704, 760]) : 0;

  // bounding box of the walk, for the overview
  var xs = pts.map(function(p){ return p[0]; }).concat(trip.pins.map(function(p){ return p[0]; }));
  var ys = pts.map(function(p){ return p[1]; }).concat(trip.pins.map(function(p){ return p[1]; }));
  var bx = (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2, by = (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2;
  var span = Math.max(Math.max.apply(null, xs) - Math.min.apply(null, xs), Math.max.apply(null, ys) - Math.min.apply(null, ys));

  // the keyframes
  var HERE  = { cx: origin[0], cy: origin[1], w: 330, tilt: 0,  b: 0, fx: .64, fy: .52 };
  var HERE2 = { cx: origin[0], cy: origin[1], w: 250, tilt: 8,  b: 0, fx: .64, fy: .52 };
  // Rising: stay over the start of the walk and gain height. Drifting toward the middle of the trip

  var tHere = .9 * P, tRise = 1.3 * P, tRide = clamp(W.L / 320, 2.4, 3.8) * P, tLand = 1.5 * P, tSprout = .5 * P, tMeet = 4.2 * P, tMove = .8 * P;

  var here = makeSign(origin[0], origin[1], 'here', '<div class="plate">You are here<span class="bname">' + esc(opt.from) + '</span></div>');
  var dest = makeSign(trip.center[0], trip.center[1], 'dest', '<div class="plate">' + esc(trip.title) + '</div>');
  var passing = [];
  DATA.labels.forEach(function(l){
    if (l.name === trip.title || (trip.area === 'Cacti and Succulents' && /Cacti/.test(l.name))) return;
    if (Math.hypot(l.x - origin[0], l.y - origin[1]) < 40) return;

    // garden and area names step aside then, so they don't crowd the photos

    var c = document.createElementNS(NS, 'circle');

}

/* ── the words ───────────────────────────────────────────────────────── */
function setCopy(html, credit){
  if (copyEl._html === html) return;
  copyEl._html = html;
  copyEl.classList.add('out');
  clearTimeout(copyEl._t);
  copyEl._t = setTimeout(function(){
    copyEl.innerHTML = html;
    void copyEl.offsetWidth;
    copyEl.classList.remove('out');
  }, copyEl.innerHTML ? 380 : 0);
  if (credit){
    credEl.innerHTML = '<span class="lbl">Photograph</span><span class="who">' + esc(credit.by) + '</span>' +
      '<span class="terms">' + esc([credit.lic, credit.date].filter(Boolean).join(' · ')) + '</span>';
    credEl.classList.add('on');
  } else credEl.classList.remove('on');
}

/* ── one frame ───────────────────────────────────────────────────────── */
function render(t){
  var vw = innerWidth, vh = innerHeight, c = T.camAt(t), s = vw / c.w, A = T.A, trip = T.trip;
  var fx = c.fx * vw, fy = c.fy * vh;
  document.getElementById('cam').style.perspectiveOrigin = fx + 'px ' + fy + 'px';
  plane.style.transform = 'translate(' + fx + 'px,' + fy + 'px) rotateX(' + c.tilt + 'deg) rotateZ(' + (-c.b) + 'deg) scale3d(' + s + ',' + s + ',' + s + ') translate(' + (-c.cx) + 'px,' + (-c.cy) + 'px)';

  // signposts face the room and keep their size
  var counter = ') rotateZ(' + c.b + 'deg) rotateX(' + (-c.tilt) + 'deg) scale3d(' + (1/s) + ',' + (1/s) + ',' + (1/s) + ')';
  [].forEach.call(signsEl.children, function(el){
    el.style.transform = 'translate(' + el._x + 'px,' + el._y + 'px' + counter;
  });

  // the walk draws itself, with a bright head
  var f = T.rideFrac(t), px = 1 / s;
  routeEl.style.strokeDashoffset = T.RL * (1 - f); routeUnder.style.strokeDashoffset = T.RL * (1 - f);
  routeEl.style.strokeWidth = 11 * px; routeUnder.style.strokeWidth = 20 * px;
  var head = T.W.at(f);
  comet.setAttribute('cx', head[0]); comet.setAttribute('cy', head[1]);
  comet.setAttribute('r', (t > A.ride && t < A.land + .3) ? 16 * px : 0);

  // you are here: a pulse, then it stays put
  T.here.classList.toggle('on', t > .15);
  var pk = (t % 1.4) / 1.4;

  ring.setAttribute('r', t < A.ride ? (8 + 46 * pk) * px : 0);
  ring.style.strokeWidth = 3 * px; ring.style.opacity = 1 - pk;

  // pins sprout across the area as you land
  T.pinEls.forEach(function(el){
    var k = easeOut((t - A.land - el._d * (A.meet - A.land) * .8) / .35);

    var m = trip.meet[idx];
    setCopy('<div class="eyebrow"><span>Look for it</span><span class="where">' + esc(trip.title) + '</span></div>' +
      '<div class="headline">' + esc(m.name) + '</div><div class="latin">' + esc(m.sci) + '</div>' +
      '<div class="body">' + esc(m.line) + '</div>', m);
  } else if (t < A.end){
    setCopy('<div class="eyebrow"><span>' + esc((trip.exits && trip.exits[opt.from]) || ('From the ' + opt.from)) + '</span><span class="where">' + esc(trip.title) + '</span></div>' +
      '<div class="headline">' + esc(trip.title) + '</div><div class="subhead">' + esc(trip.sub) + '</div>', null);
  }

/* ── the clock (as on the deck) ──────────────────────────────────────── */
function tickClock(){
  var d = new Date();
  document.getElementById('clock').innerHTML = '<span class="day">' + d.toLocaleDateString('en-US', { weekday: 'long' }) +
    '</span><span class="sep">·</span>' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
tickClock(); setInterval(tickClock, 15000);

/* ── play ────────────────────────────────────────────────────────────── */
var t0 = 0, paused = false, pausedAt = 0, timeEl;
function start(){ build(); copyEl._html = null; copyEl.innerHTML = ''; t0 = performance.now(); paused = false; drawControls(); }
function now(){ return paused ? pausedAt : (performance.now() - t0) / 1000 * opt.speed; }
function loop(){
  var t = now();
  if (t > T.A.total + .6 && !paused){
    if (!Q.get('hold')){ opt.trip = (opt.trip + 1) % DATA.trips.length; start(); t = 0; }
  }
  render(Math.min(t, T.A.total));
  if (timeEl) timeEl.textContent = Math.min(t, T.A.total).toFixed(1) + ' / ' + T.A.total.toFixed(0) + 's';
  requestAnimationFrame(loop);
}

/* ── demo controls ───────────────────────────────────────────────────── */
function drawControls(){
  var c = document.getElementById('controls'), h = '';
  function btn(label, on, act){ return '<button class="' + (on ? 'on' : '') + '" data-act="' + act + '">' + label + '</button>'; }
  h += '<div class="grp"><span>Fly to</span>' + DATA.trips.map(function(tr, i){ return btn(esc(tr.title), i === opt.trip, 'trip:' + i); }).join('') + '</div>';
  h += '<div class="grp"><span>From</span>' + btn('Galleria TV', opt.from === 'Galleria', 'from:Galleria') + btn('Office TV', opt.from === 'Office', 'from:Office') + '</div>';
  h += '<div class="grp"><span>Camera</span>' + btn('Face the way you walk', opt.follow, 'follow:1') + btn('North up', !opt.follow, 'follow:0') + '</div>';
  h += '<div class="grp"><span>Pace</span>' + btn('Brisk', opt.pace === 1, 'pace:1') + btn('Relaxed', opt.pace !== 1, 'pace:1.35') + '</div>';
  h += '<div class="grp">' + btn('↺ Replay', false, 'replay') + btn(paused ? '▶ Play' : '❚❚ Pause', false, 'pause') + '<span class="time" id="time"></span></div>';
  c.innerHTML = h; timeEl = document.getElementById('time');
}
document.getElementById('controls').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  var a = b.dataset.act.split(':');
  if (a[0] === 'pause'){
    if (paused){ t0 = performance.now() - pausedAt / opt.speed * 1000; paused = false; } else { pausedAt = now(); paused = true; }
    drawControls(); return;
  }
  if (a[0] === 'trip') opt.trip = +a[1];
  if (a[0] === 'from') opt.from = a[1];
  if (a[0] === 'follow') opt.follow = a[1] === '1';
  if (a[0] === 'pace') opt.pace = +a[1];
  start();
});
addEventListener('keydown', function(e){
  if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('tv');
  if (e.key === ' '){ e.preventDefault(); document.querySelector('[data-act="pause"]').click(); }
});

var startAt = Q.get('trip');
if (startAt){ DATA.trips.forEach(function(tr, i){ if (tr.title.toLowerCase().indexOf(startAt.toLowerCase()) === 0) opt.trip = i; }); }
start();
if (Q.get('t')){ paused = true; pausedAt = +Q.get('t'); drawControls(); }
requestAnimationFrame(loop);
</script>
</body>
</html>
