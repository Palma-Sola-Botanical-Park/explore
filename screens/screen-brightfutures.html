<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bright Futures — Palma Sola Botanical Park</title>
<link rel="icon" type="image/png" href="../images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<!-- ?v= is a cache-buster. GitHub Pages and the kiosk browser cache CSS
     for 10 minutes; bump it whenever the stylesheet changes or the TV
     keeps showing the old look after a pull. -->
<link rel="stylesheet" href="events/event-deck.css?v=20260925o">
<link rel="stylesheet" href="events/event-brightfutures.css?v=20260925o">
<!-- Standalone deck for the Wednesday Bright Futures high-school session.
     Randy, 2026-09-25: "volunteers would refer to adults so the name of
     this html is wrong imo. We call this crew Bright Futures" — this is
     their crew's screen, not a generic "volunteer" one. Rebuilt the same
     day as its own self-contained page (not a mode inside screen.html) —
     Randy: "i thought each sort of screen was an html page," same as the
     event decks. Reuses event-deck.css for the shared frame/clock/logo
     chrome, own theme in event-brightfutures.css, own rotation logic below
     (unlike the event decks it needs live data and two wall-clock-
     scheduled slides, so it doesn't reuse event-deck.js). -->
</head>
<body>
<div class="frame"></div>
<!-- Randy, 2026-09-25: "Top left could be the logos of PSBP and Bright
     Futures... and some mention that this is the weekly Bright Futures
     volunteer program." The park mark moves up here from the bottom-right
     corner so it isn't on screen twice. -->
<div class="brand">
  <img class="brand-psbp" src="../images/white_PSBP_logo.png" alt="Palma Sola Botanical Park">
  <span class="brand-plate"><img src="../images/logos/bright-futures.png" alt="Florida Bright Futures Scholarship Program"></span>
  <span class="brand-text"><b>Bright Futures</b><span>Weekly volunteer program</span></span>
</div>
<div class="clock" id="clock"></div>
<div class="deck"></div>
<div class="credit-block" id="credit"></div>
<div id="bar"></div>
<script src="../js/photo-credits.js"></script>
<script>
(function(){
  var Q = new URLSearchParams(location.search);
  var SPEED = Math.max(0.1, parseFloat(Q.get('speed')) || 1);
  /* Randy, 2026-09-25: "let's speed the whole thing up by 10%... feels
     slow in normal speed." 16 → 14.5. Every slide is a multiple of this. */
  var SECONDS = (parseFloat(Q.get('seconds')) || 14.5) / SPEED;
  var deck = document.querySelector('.deck'), bar = document.getElementById('bar');
  var clockEl = document.getElementById('clock');
  function tick(){ var d=new Date(), h=d.getHours(), m=d.getMinutes();
    clockEl.textContent = ((h%12)||12)+':'+(m<10?'0':'')+m+(h<12?' am':' pm'); }
  tick(); setInterval(tick, 15000);

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  /* Ported from screen.html: quick_hits facts carry inline <b> for real
     emphasis (e.g. "causes chlorosis" in a way that matters). esc() was
     turning that into visible literal tags on screen — this whitelists
     b/strong/i/em and strips anything else instead of escaping it all. */
  function rich(s){ return String(s==null?'':s).replace(/<(?!\/?(b|strong|i|em)\b)[^>]*>/gi,''); }
  /* iNat's preferred_common_name is lowercase for genus-level IDs
     ("bottlebrushes"); the site's own records are already cased. */
  function cap(s){ s = String(s||''); return s.charAt(0).toUpperCase() + s.slice(1); }
  function grab(url){
    return fetch(url, { cache:'no-store' }).then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; });
  }

  /* ── live iNat pulse — one request, this-week only ────────────────────
     Same polygon rule as walkabout.html: the pin decides, not the iNat
     project's accuracy-circle rule. */
  var PULSE_POLYGON=[
    [-82.661275,27.512191],[-82.658079,27.512198],[-82.658107,27.514825],
    [-82.660644,27.514828],[-82.661133,27.514130],[-82.661132,27.513123]];
  function inPark(o){
    var g=(o.geojson&&o.geojson.coordinates)||(o.location&&o.location.split(',').map(Number).reverse());
    if(!g||g.length<2||!isFinite(g[0])) return false;
    var x=g[0], y=g[1], inside=false;
    for(var i=0,j=PULSE_POLYGON.length-1;i<PULSE_POLYGON.length;j=i++){
      var xi=PULSE_POLYGON[i][0], yi=PULSE_POLYGON[i][1];
      var xj=PULSE_POLYGON[j][0], yj=PULSE_POLYGON[j][1];
      if((yi>y)!==(yj>y) && x<(xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside;
    }
    return inside;
  }
  var PULSE = null;
  /* Randy, 2026-09-25, spotting a stranger's login in the credits:
     "nigrosh60 is not bright futures fyi" / "every photo should be by
     Bright Futures people." This screen is about THIS crew's week, not
     the whole park's — bfSet filters every observation out before any
     count or photo is built from it. */
  /* Randy, 2026-09-25: "'most photographed' needs to be past month. show
     top 5 in succession and who took them." A week was too thin a sample
     — one fetch covers 30 days, "this week"/"today" stats filter that
     same set down client-side rather than firing a second request. */
  function loadPulse(bfSet){
    var d1 = new Date(Date.now() - 30*864e5).toISOString().slice(0,10);
    var weekAgo = new Date(Date.now() - 7*864e5).toISOString().slice(0,10);
    var nelat=Math.max.apply(null,PULSE_POLYGON.map(function(p){return p[1];}));
    var nelng=Math.max.apply(null,PULSE_POLYGON.map(function(p){return p[0];}));
    var swlat=Math.min.apply(null,PULSE_POLYGON.map(function(p){return p[1];}));
    var swlng=Math.min.apply(null,PULSE_POLYGON.map(function(p){return p[0];}));
    /* v2 with an explicit field list, same trick species_manager.py uses:
       ~100 KB a page instead of ~13 MB of full v1 records for 200
       observations. v2 has no verifiable=any — leaving it off returns
       everything, which is what a planted collection needs. Up to three
       pages so a busy month isn't cut off at the 200 most recent. */
    var base = 'https://api.inaturalist.org/v2/observations?nelat='+nelat+'&nelng='+nelng
      + '&swlat='+swlat+'&swlng='+swlng+'&d1='+d1
      + '&order_by=observed_on&order=desc&per_page=200'
      + '&fields=id,observed_on,location,user.login,taxon.id,taxon.name,taxon.preferred_common_name,photos.url,photos.license_code';
    function page(n){ return fetch(base+'&page='+n, { cache:'no-store' }).then(function(r){ return r.ok ? r.json() : null; }); }
    return page(1).then(function(first){
        if(!first) return null;
        var n = Math.min(3, Math.ceil((first.total_results||0)/200)), more = [];
        for(var i=2;i<=n;i++) more.push(page(i));
        return Promise.all(more).then(function(rest){
          var results = first.results || [];
          rest.forEach(function(d){ if(d && d.results) results = results.concat(d.results); });
          return { results: results };
        });
      })
      .then(function(data){
        var monthRows = ((data && data.results) || []).filter(inPark)
          .filter(function(o){ return o.user && bfSet[o.user.login]; });
        var rows = monthRows.filter(function(o){ return o.observed_on >= weekAgo; });
        var today = new Date().toISOString().slice(0,10);
        function uniq(list, key){ var seen={}; list.forEach(function(o){
          var v = key(o); if(v) seen[v]=1; }); return Object.keys(seen).length; }

        /* Per-species tallies — this is the "achievements" data the first
           pass never built. Randy, 2026-09-25: "no achievements. no
           nothing so far." Real numbers weren't enough on their own;
           naming the actual species is what makes it feel alive.
           Sourced from monthRows (not the 7-day `rows`) so there's
           actually enough material for "top 5 in succession". */
        var bySpecies = {};
        monthRows.forEach(function(o){
          var t = o.taxon; if(!t || !t.id) return;
          var key = t.id;
          if(!bySpecies[key]) bySpecies[key] = {
            name: t.preferred_common_name || t.name, count:0, logins:{}, photos:[], obs:[]
          };
          bySpecies[key].count++;
          if(o.user && o.user.login) bySpecies[key].logins[o.user.login] = 1;
          var photo0 = o.photos && o.photos[0];
          var rec = {
            id: o.id || 0,
            url: photo0 && photo0.url ? photo0.url.replace(/square\.(jpg|jpeg|png)/i, 'medium.$1') : '',
            login: (o.user && o.user.login) || '',
            observed_on: o.observed_on || '',
            license: (photo0 && photo0.license_code) || ''
          };
          bySpecies[key].obs.push(rec);              /* every observation, photo or not — the built list counts to N */
          if(rec.url) bySpecies[key].photos.push(rec);
        });
        var speciesList = Object.keys(bySpecies).map(function(k){ return bySpecies[k]; })
          .sort(function(a,b){ return b.count - a.count; });

        /* Per-photographer tallies for the monthly slide's side panel:
           who shot the most this month, with their photos. Shown in
           random order, no counts per kid — recognition, not a
           leaderboard. */
        var byLogin = {}, monthPhotos = 0;
        monthRows.forEach(function(o){
          var login = o.user && o.user.login; if(!login) return;
          if(!byLogin[login]) byLogin[login] = { login:login, count:0, photos:[] };
          byLogin[login].count++;
          (o.photos || []).forEach(function(ph){
            monthPhotos++;
            if(ph.url) byLogin[login].photos.push({
              url: ph.url.replace(/square\.(jpg|jpeg|png)/i, 'medium.$1'), license: ph.license_code || '' });
          });
        });
        var photographers = Object.keys(byLogin).map(function(k){ return byLogin[k]; })
          .filter(function(t){ return t.photos.length; })
          .sort(function(a,b){ return b.count - a.count; });

        PULSE = {
          monthPhotos: monthPhotos,
          monthObs: monthRows.length,
          monthSpecies: uniq(monthRows, function(o){ return o.taxon && o.taxon.id; }),
          monthObservers: uniq(monthRows, function(o){ return o.user && o.user.login; }),
          photographers: photographers,
          todayObs: rows.filter(function(o){ return o.observed_on===today; }).length,
          todaySpecies: uniq(rows.filter(function(o){ return o.observed_on===today; }),
            function(o){ return o.taxon && o.taxon.id; }),
          todayObservers: uniq(rows.filter(function(o){ return o.observed_on===today; }),
            function(o){ return o.user && o.user.login; }),
          speciesList: speciesList
        };
      }).catch(function(){});
  }

  /* ── real Bright Futures photographs ─────────────────────────────────
     photo_credits.json rows whose photographer's note in
     photographer_names.json says "Bright Futures student" — same rule
     screen.html's cohort() uses. Threaded into every slide builder below
     so nearly every slide gets a real full-bleed photo behind it, not
     just the two that used to show pictures. Randy, 2026-09-25, watching
     it run: "how do we make this interesting? no photo?" — correct, the
     old render() never set a background image at all. */
  function bfLogins(names){
    var logins = {};
    for(var login in names){
      var n = ((names[login] && names[login].note) || '').toLowerCase();
      /* The note has to SAY student. A plain "bright futures" match let
         in "NOT a Bright Futures student" (Caitlin — staff; Randy,
         2026-09-25: "can't use her") and "Bright Futures alumnus" (Aiden,
         adult). The 31 real students all carry the exact phrase. */
      if(n.indexOf('bright futures student') > -1 && n.indexOf('not a bright futures') < 0) logins[login] = 1;
    }
    return logins;
  }
  function crewOf(photos, bfSet){
    return (photos||[]).filter(function(p){ return bfSet[p.photographer] && p.publish_ok; });
  }
  function randomPhoto(mine){
    if(!mine || !mine.length) return null;
    return mine[Math.floor(Math.random()*mine.length)];
  }

  /* Randy, 2026-09-25: "For who shot this slide, definitely minimal
     repeats. Use ANY photo in photo_credits.JSON that is from someone in
     Bright Futures." A shuffle bag over the whole crew set (every
     publishable photo by a Bright Futures login — all ~500, not just
     heroes or this month), remembered in localStorage so the 10-minute
     rebuild and a page reload don't restart the repeats. It only resets
     once every photo has had a turn. Shared by "Who shot this?" and
     "From the crew"; plain background photos still draw at random. */
  /* FOCUS-AWARE CROP — Randy, 2026-09-25, on a squirrel lost behind the
     words: "Can't see some of the ones where the focus is left of
     center... Can you analyze focus of image and crop/move it to the
     right where there is space?" A full-bleed portrait photo on a 16:9
     screen keeps under half its height, and the left of what's left is
     under the copy. So each photo is scored once on a 48-px-wide canvas
     (edge density plus saturation; the centre of the top quarter of
     cells is the focus point), then: the crop is zoomed a touch and
     positioned so the focus sits two-thirds across and mid-height; and
     if the focus is on the LEFT, the words move to the right instead
     (.slide.flip) — you can't drag a left-side subject rightwards
     without zooming it to mush. iNat's photo bucket allows cross-origin
     pixel reads; if a read ever fails the photo just stays centred.
     Scores cache in localStorage, so every photo is scored once ever. */
  var FOCUS_KEY = 'psbp-bf-focus', FOCUS_MEM = {};
  var BG_ZOOM = 1.12, BG_TX = 0.66, BG_TX_FLIP = 0.34, BG_TY = 0.5;
  function focusCache(){ try{ return JSON.parse(localStorage.getItem(FOCUS_KEY) || '{}'); }catch(e){ return {}; } }
  function analyzeFocus(img){
    var W = 48, H = Math.max(8, Math.round(W*img.naturalHeight/img.naturalWidth));
    var c = document.createElement('canvas'); c.width = W; c.height = H;
    var g = c.getContext('2d'); g.drawImage(img, 0, 0, W, H);
    var d = g.getImageData(0, 0, W, H).data, n = W*H;
    var lum = new Float32Array(n), sat = new Float32Array(n), w = new Float32Array(n), vals = [];
    for(var i=0;i<n;i++){
      var r=d[i*4], gg=d[i*4+1], b=d[i*4+2], mx=Math.max(r,gg,b), mn=Math.min(r,gg,b);
      lum[i] = .3*r + .59*gg + .11*b; sat[i] = mx ? (mx-mn)/mx : 0;
    }
    for(var y=1;y<H-1;y++) for(var x=1;x<W-1;x++){
      var k = y*W+x;
      w[k] = (Math.abs(lum[k+1]-lum[k-1]) + Math.abs(lum[k+W]-lum[k-W]))/255 + 0.6*sat[k];
      vals.push(w[k]);
    }
    vals.sort(function(a,b){ return a-b; });
    var thr = vals[Math.floor(vals.length*0.75)] || 0, sx=0, sy=0, sw=0;
    for(var y2=1;y2<H-1;y2++) for(var x2=1;x2<W-1;x2++){
      var k2 = y2*W+x2;
      if(w[k2] >= thr && w[k2] > 0){ sx += x2*w[k2]; sy += y2*w[k2]; sw += w[k2]; }
    }
    var ar = img.naturalWidth/img.naturalHeight;
    return sw ? { fx:(sx/sw+.5)/W, fy:(sy/sw+.5)/H, ar:ar } : { fx:.5, fy:.5, ar:ar };
  }
  function focusFor(url){
    var key = (url.match(/photos\/(\d+)\//) || [])[1] || url;
    if(FOCUS_MEM[key]) return FOCUS_MEM[key];
    var cached = focusCache()[key];
    if(cached) return (FOCUS_MEM[key] = Promise.resolve(cached));
    /* only the open-data bucket allows pixel reads; static.inaturalist.org
       refuses, so don't ask (the photo just stays centred) */
    if(url.indexOf('inaturalist-open-data') < 0) return (FOCUS_MEM[key] = Promise.resolve(null));
    FOCUS_MEM[key] = new Promise(function(res){
      var img = new Image(); img.crossOrigin = 'anonymous';
      img.onload = function(){
        var f = null; try{ f = analyzeFocus(img); }catch(e){}
        if(f){ try{ var all = focusCache(); all[key] = f; localStorage.setItem(FOCUS_KEY, JSON.stringify(all)); }catch(e2){} }
        res(f);
      };
      img.onerror = function(){ res(null); };
      /* the medium size is plenty for a 48-px score, and a distinct URL
         (plus ?f=1) never collides with the non-CORS cached full-size copy */
      img.src = url.replace(/\/(large|original)\.(jpe?g|png)/i, '/medium.$2') + (url.indexOf('?') > -1 ? '&' : '?') + 'f=1';
    });
    return FOCUS_MEM[key];
  }
  /* FULL-SIZE PHOTOS — Randy, 2026-09-25: "the hero images are likely
     too low RES to show well on a big screen. Can we build a method to
     go ahead and cache the FULL size images from iNat?" iNat keeps every
     photo's `original` (up to 2048 px on the long side, 1–3 MB) in the
     same public bucket as the `large` (1024 px, ~150 KB) we link. So a
     full-bleed background shows `large` at once, and the `original` is
     swapped in the moment it arrives — same crop geometry, so nothing
     jumps. warmPhotos() loads every photo in the deck in the background
     one at a time, so by the time a slide comes up its original is
     already in the browser cache (Chrome keeps them for weeks). Not the
     site's local hero copies: "those were mainly for quick web site
     delivery of the index page." */
  function bigUrl(url){ return url.replace(/\/(square|small|medium|large)\.(jpe?g|png)$/i, '/original.$2'); }
  function photoKey(url){ return (url.match(/photos\/(\d+)\//) || [])[1] || url; }
  var WARM_DONE = {}, warmQueue = [], warming = false;
  function warmPhotos(urls){
    urls.forEach(function(u){ if(u && !WARM_DONE[photoKey(u)]){ WARM_DONE[photoKey(u)] = 1; warmQueue.push(bigUrl(u)); } });
    if(warming) return;
    warming = true;
    (function step(){
      var u = warmQueue.shift();
      if(!u){ warming = false; return; }
      var im = new Image();
      im.onload = im.onerror = function(){
        document.documentElement.dataset.warmed = (+(document.documentElement.dataset.warmed || 0)) + 1;
        setTimeout(step, 250);   /* breathe, so the slide on screen loads first */
      };
      im.src = u;
    })();
  }
  /* set a .bg's photo (large now, original when it lands), then (once
     its focus is known) its crop */
  function placeBg(bgEl, url, tx){
    if(!bgEl || !url) return;
    var key = photoKey(url), big = bigUrl(url);
    bgEl.classList.add('photo');
    bgEl.dataset.photo = key;
    bgEl.style.backgroundImage = 'url('+url+')';
    bgEl.style.backgroundSize = ''; bgEl.style.backgroundPosition = '';
    if(big !== url){
      var im = new Image();
      im.onload = function(){ if(bgEl.isConnected && bgEl.dataset.photo === key) bgEl.style.backgroundImage = 'url('+big+')'; };
      im.src = big;
    }
    focusFor(url).then(function(f){
      if(!f || !bgEl.isConnected || bgEl.dataset.photo !== key) return;
      var Ws = innerWidth, Hs = innerHeight, Wd, Hd;
      if(f.ar > Ws/Hs){ Hd = Hs*BG_ZOOM; Wd = Hd*f.ar; } else { Wd = Ws*BG_ZOOM; Hd = Wd/f.ar; }
      var ox = Math.min(0, Math.max(Ws - Wd, tx*Ws - f.fx*Wd));
      var oy = Math.min(0, Math.max(Hs - Hd, BG_TY*Hs - f.fy*Hd));
      bgEl.style.backgroundSize = Wd.toFixed(0)+'px '+Hd.toFixed(0)+'px';
      bgEl.style.backgroundPosition = ox.toFixed(0)+'px '+oy.toFixed(0)+'px';
    });
  }

  var USED_KEY = 'psbp-bf-used';
  function usedSet(){ try{ return JSON.parse(localStorage.getItem(USED_KEY) || '{}'); }catch(e){ return {}; } }
  function freshPhoto(mine){
    if(!mine || !mine.length) return null;
    var used = usedSet();
    var pool = mine.filter(function(p){ return !used[p.photo_id]; });
    if(!pool.length){ used = {}; pool = mine; }
    var p = pool[Math.floor(Math.random()*pool.length)];
    used[p.photo_id] = 1;
    try{ localStorage.setItem(USED_KEY, JSON.stringify(used)); }catch(e){}
    return p;
  }

  /* Randy, 2026-09-25: "there is a standard credit block in html site.
     much better than what youve done." Reusing the real one — same
     function the species pages themselves call — instead of my own
     ad-hoc joined string. See js/photo-credits.js: PSBPPhotos.creditPlate
     emits .credit-plate/.credit-name/.cc-badge markup; event-brightfutures
     .css restyles it for this dark TV theme, MUCH bigger on .credit-name
     specifically — Randy, same thread, on the first pass: "we WANT their
     names big and bold on photos. i literally cannot read it." The
     site's own version is deliberately quiet (a byline under a species
     page's hero); this screen's whole point is the name, so it can't
     copy that sizing, only the structure. */
  function creditText(p){
    if(!p) return '';
    return window.PSBPPhotos.creditPlate({
      by: (p.photographer_name || 'community member').split(' – ')[0],
      date: p.observed_on,
      license: p.license
    });
  }

  /* Randy, 2026-09-25 (morning): "The names of the kids is RIDICULOUSLY
     cartoonishly large. Use the standard caption from the html site, and
     place it bottom left. maybe make it a bit bigger. Remove the name
     from the heart of the slides... Use the caption to answer the
     question." So: no slide puts a name in its headline any more; every
     photo slide runs the same creditPlate caption, and it always slides
     in a beat late — "Who shot this?" just waits longer, to the halfway
     point (see setCredit()/creditDelay in render()). */

  /* A real fact, not just a name — Randy: "too boring without good info."
     Same quick_hits array the species pages themselves use, keyed by the
     photo's own psbp_id. */
  function hitFor(hits, psbpId){
    var list = hits && hits[psbpId];
    if(!list || !list.length) return '';
    return list[Math.floor(Math.random()*list.length)];
  }

  /* ── slide builders ──────────────────────────────────────────────────── */
  /* Randy, 2026-09-25: "Instead of 'The Bright Futures Crew' and then
     weekly stats, let's do 'Here's how many iNat pics we've taken this
     month:' show good monthly stats. Then on the right give some sense
     that it is a lot, fade in a slide deck of some of the top students
     (maybe the top 5 that month) with small grids." The right-hand panel
     fades through the month's busiest photographers, four of their own
     photos each; the bottom-left caption names each one as it lands (no
     names in the panel itself, no rank numbers, random order). */
  /* Randy, 2026-09-25, on the first version (four numbers, a 2×2 grid,
     two-thirds of the screen empty): "needs to be way better somehow."
     Then on the tidy wall of squares that replaced it: "needs a crazy
     irregularly framed bunch of photos that changes with each
     photographer... take much of the screen and be built to fit around
     the text... interesting shapes with lots photos that interlock."
     And on a grid of rectangles: "square grids will not cut it."
     So: the photo count is one huge figure, and the rest of the screen
     is a COLLAGE — paper prints, circles and hexagons at three sizes,
     tilted, overlapping, scattered around the copy and bleeding to the
     frame line. A fresh scatter for each photographer, the caption
     naming whoever is up. Big ones are placed first, then medium, then
     small into the gaps (best-of-24 candidate sampling: each new tile
     goes where it is farthest from the ones already down, so the
     coverage is even but never regular). */
  var CW = 171, CH = 84;            /* the .quilt box in vmin at 16:9 — for spacing maths only */
  var HOLE_X = 0.55, HOLE_Y = 0.69; /* the copy's corner, as fractions of the box, with room for a tilted print's corner: no tile may cover the words */
  var CREDIT_X = 0.24, CREDIT_Y = 0.78; /* and the caption's corner, bottom-left — Randy: "give the screen credit some breathing space" */
  function collageFor(urls){
    var n = urls.length, boost = Math.min(1.5, Math.sqrt(16/Math.max(n,4)));
    var sizes = urls.map(function(_, i){          /* biggest first */
      var k = i/n; return (k < 0.15 ? 33 : k < 0.45 ? 23 : 15) * boost;
    });
    var placed = [], tiles = [];
    urls.forEach(function(u, i){
      var kinds = ['print','print','print','tilt','tilt','circle','hex'];
      var kind = i < 2 ? 'print' : kinds[Math.floor(Math.random()*kinds.length)];
      var aspect = (kind === 'circle' || kind === 'hex') ? 1 : [1.5,1.33,1,0.8][Math.floor(Math.random()*4)];
      var w = sizes[i]*Math.sqrt(aspect), h = sizes[i]/Math.sqrt(aspect);
      var hw = w/2/CW, hh = h/2/CH, best = null, bestD = -1;
      for(var c=0; c<24; c++){
        var cx = hw*0.5 + Math.random()*(1 - hw), cy = hh*0.5 + Math.random()*(1 - hh);
        if(cx - hw < HOLE_X && cy - hh < HOLE_Y) continue;          /* would sit on the words */
        if(cx - hw < CREDIT_X && cy + hh > CREDIT_Y) continue;      /* would sit on the caption */
        var d = 1e9;
        for(var p=0; p<placed.length; p++){
          var dx = (cx - placed[p][0])*CW, dy = (cy - placed[p][1])*CH;
          d = Math.min(d, dx*dx + dy*dy);
        }
        if(d > bestD){ bestD = d; best = [cx, cy]; }
      }
      if(!best) return;
      placed.push(best);
      var rot = kind === 'circle' ? 0 : kind === 'tilt' ? (Math.random()*22 - 11) : (Math.random()*10 - 5);
      tiles.push({ url:u, kind:kind, x:best[0]*100, y:best[1]*100, w:w, h:h, rot:rot.toFixed(1) });
    });
    return tiles;
  }
  /* Randy, 2026-09-25: "Can we not include just the top photo takers?
     Can we put two people at the bottom credits who add up enough to
     fill a screen. We have 18 to choose from this month. Let's try to
     get everyone represented somehow doing clever combines." So:
     anyone with ten or more photos gets a scatter to themselves; the
     rest are bundled two or three to a scatter until there's enough to
     fill the screen, photos interleaved, the caption naming all of
     them. The groups are shuffled once per rebuild and split across the
     three monthly showings in a cycle — everyone appears every cycle. */
  function monthGroups(){
    var groups = [], cur = null;
    PULSE.photographers.forEach(function(t){
      if(!t.photos.length) return;
      if(t.photos.length >= 10){ groups.push([t]); return; }
      cur = cur || [];
      cur.push(t);
      var n = cur.reduce(function(a, m){ return a + m.photos.length; }, 0);
      if(n >= 10 || cur.length >= 3){ groups.push(cur); cur = null; }
    });
    if(cur) groups.push(cur);
    return groups.sort(function(){ return Math.random()-0.5; });
  }
  function slideMonth(names, groups, part){
    if(!PULSE || !PULSE.monthObs || !groups || !groups.length) return null;
    var quilt = groups.map(function(members){
      var urls = [], at = members.map(function(){ return 0; }), more = true;
      while(urls.length < 16 && more){            /* interleave the members' photos */
        more = false;
        members.forEach(function(m, i){
          if(urls.length < 16 && at[i] < m.photos.length){ urls.push(m.photos[at[i]++].url); more = true; }
        });
      }
      var who = members.map(function(m){ return nameFor(names, m.login); });
      var by = who.length > 2 ? who.slice(0, -1).join(', ') + ' & ' + who[who.length-1] : who.join(' & ');
      return { items: collageFor(urls),
               credit: window.PSBPPhotos.creditPlate({ by: by, license: members[0].photos[0].license }) };
    });
    /* long enough that the last group always lands (render() holds each
       group at least 3.2 s), whatever the base dwell is set to */
    var secs = Math.max(SECONDS*(0.5 + 0.32*quilt.length), (1.4 + 3.4*quilt.length + 1)/SPEED);
    return { id:'month-'+part, seconds: secs, quilt: quilt, html:
        '<div class="copy"><div class="label">This month</div>'
      + '<h2>Here’s how many iNat pics we’ve taken this month:</h2>'
      + countHtml(PULSE.monthPhotos, 'photos', 'hero')
      + '<div class="stat-row">'
      +   countHtml(PULSE.monthObs, 'observations') + countHtml(PULSE.monthSpecies, 'species')
      +   countHtml(PULSE.monthObservers, 'photographers')
      + '</div></div>'
      + (quilt.length ? '<div class="quilt"></div>' : '') };
  }

  /* A real achievement, not just a count — Randy: "no achievements. no
     nothing." Names the actual top species. Randy, seeing this render as a
     bare name list: "this slide is begging for the pics to be cycled
     through with credits for each. show all 5 in succession" — so this
     builds a `frames` array (one per actual observation photo) instead of
     a static slide; render() below knows how to step through frames on
     its own timer while the slide stays up. */
  function nameFor(names, login){
    var n = names[login];
    return ((n && (n.credit_as || n.display_name)) || login).split(' – ')[0];
  }
  /* Randy, 2026-09-25: "It starts great, but bores quickly. Start with
     what you've got but put the word observations on the same line as
     '8'. Also start with 1. Name, date (oldest one of batch). Then 2.
     Name, date... Each time swap out the credit image at the bottom and
     switch to their photo. Build the 8. Time is such that the Nth (last)
     one ends when slide ends. It can go quicker than it is now. Movement
     is good... Cool to build the 8 you know are coming." So: the number
     lands first, then one row per beat, oldest first, the photo behind
     and the caption switching with every row; the last row lands one
     beat before the slide ends. Eight rows to a column. */
  /* Then: "we could do the 2nd and 3rd most popular plants too. Phase
     them in on the rotation that you would have done the Most popular
     again. There is time over 3 hours! Do the same repeating countdown
     for each." rank 0/1/2 → the three slots the top one used to fill. */
  var RANK_LABEL = ['Most photographed this month', 'Second most photographed this month', 'Third most photographed this month'];
  function slideMostPhotographed(names, rank){
    rank = rank || 0;
    if(!PULSE || !PULSE.speciesList || PULSE.speciesList.length <= rank) return null;
    var top = PULSE.speciesList[rank];
    if(top.count < 2 || !top.obs || top.obs.length < 2) return null;
    var obs = top.obs.slice().sort(function(a, b){
      return a.observed_on < b.observed_on ? -1 : a.observed_on > b.observed_on ? 1 : a.id - b.id;
    });
    var shown = obs.slice(0, 24), extra = obs.length - shown.length;
    var rowMs = shown.length <= 8 ? 3400 : shown.length <= 16 ? 2400 : 1800, intro = 2600;
    var rows = shown.map(function(o, i){
      var when = o.observed_on ? new Date(o.observed_on+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
      return { bg: o.url, html:
          '<div class="obs-row"><span class="n">'+(i+1)+'</span><span class="who">'+esc(nameFor(names, o.login))+'</span>'
        + '<span class="when">'+esc(when)+'</span></div>',
        credit: window.PSBPPhotos.creditPlate({ by: nameFor(names, o.login), date: o.observed_on, license: o.license }) };
    });
    if(extra > 0) rows.push({ html: '<div class="obs-row more">…and '+extra+' more</div>' });
    var firstBg = shown[0].url || (top.photos[0] && top.photos[0].url) || '';
    return { id:'mostphoto-'+(rank+1), seconds: (intro + rows.length*rowMs)/1000/SPEED,
             build: { rows: rows, intro: intro/SPEED, rowMs: rowMs/SPEED }, bg: firstBg, credit: '', html:
        '<div class="copy"><div class="label">'+RANK_LABEL[rank]+'</div>'
      + '<h2>'+esc(cap(top.name))+'</h2>'
      + countHtml(top.count, 'observations', 'inline')
      + '<div class="obs-list"></div></div>' };
  }

  /* Concrete species names, not an abstract number — makes "63 species"
     feel real instead of just a stat. */
  /* Randy, 2026-09-25: "'Seen this month' cannot be just a weird list of
     species. Doesn't work." Now a fast flip instead: one species at a
     time, its own crew photo full-screen, the name changing with it and
     the caption crediting whoever shot it. Same frame engine as "Most
     photographed", plus a per-frame title. */
  function slideSpeciesSeen(names){
    if(!PULSE || !PULSE.speciesList) return null;
    var withPhoto = PULSE.speciesList.filter(function(s){ return s.name && s.photos.length; });
    if(withPhoto.length < 3) return null;
    var pick = withPhoto.slice().sort(function(){ return Math.random()-0.5; }).slice(0,6);
    var frames = pick.map(function(s){
      var ph = s.photos[Math.floor(Math.random()*s.photos.length)];
      return { bg: ph.url, title: cap(s.name),
        credit: window.PSBPPhotos.creditPlate({ by: nameFor(names, ph.login), date: ph.observed_on, license: ph.license }) };
    });
    return { id:'speciesseen', seconds: SECONDS*0.6*frames.length, frames: frames, html:
        '<div class="copy"><div class="label">Seen this month</div>'
      + '<h2 class="frame-title">'+esc(frames[0].title)+'</h2>'
      + '<div class="body">'+PULSE.monthSpecies+' species so far. Not too shabby, guys. Here’s a quick scroll through a bunch.</div></div>' };
  }

  /* Randy, 2026-09-25: "let's make that about learning the weekly tasks.
     First thing to do when you arrive, pick one you can do that nobody
     has started and tell staff you're on it. On the right I'll have an
     image of the sheet. So it will be split paned." The sheet is a photo
     he drops in each week at the path brightfutures_today.json names in

  function slideTasks(tasksData, mine){

  /* Reviewer's note, 2026-09-25: "a very lightweight 'Can you beat this?'

  function slideChallenge(mine){

  /* The scattered "match-game" crew slide lived here until 2026-09-25.
     Randy: "The total page of 'The Bright Futures Crew' and all the
     numbers and the most boring list to the right ever has to be changed
     or tossed." Tossed; slideMonth() above is its replacement. */

  /* One real photo, full-bleed, minimal text — the "photo of the moment"
     beat. Rotates through the actual crew archive, not a fixed pair. */
  /* Randy, 2026-09-25: "you are highlighting species way more. no!!!!!
     they are first. always... we are all about big credits." The
     photographer's name leads as the slide's own headline now, not just
     the corner credit block — species drops to a smaller subtitle line.
     Same rule everywhere a specific photographer's photo is the point. */
  function slidePhotoSpotlight(mine, hits){
    /* Randy, 2026-09-25: Denise's Turk's Turban came up as her second

    var heroes = mine.filter(function(x){ return x.hero; });

    var fact = hitFor(hits, p.psbp_id);
    function htmlFor(nice){

        + '<h2>'+esc(p.common_name || '')+'</h2>'
        + (fact ? '<div class="body">'+rich(fact)+'</div>' : '')
        + (nice ? '<div class="body nice">'+esc(nice)+'</div>' : '') + '</div>';
    }
    return { id:'spotlight-'+p.photo_id, seconds: SECONDS*1.5, bg: p.photo_url, credit: creditText(p),
             login: p.photographer, first: ((p.photographer_name || '').split(' – ')[0].split(' ')[0] || ''),
             htmlFor: htmlFor, html: htmlFor('') };

  /* Randy, 2026-09-25: "some of the headings or text could say 'nice
     one, Molly' or whatever, but that cannot go on REPEAT that Molly
     always gets the callout. so if we stick in compliments, it has to be
     once or twice per deck and shuffled between the kids... you spread
     things out and try not to be an automaton on repeat." So: a budget
     of two per cycle, on the From-the-crew slides, and the deck keeps a
     ledger (localStorage) of when each kid last got one — the two go to
     whoever has waited longest. */
  var NICE_KEY = 'psbp-bf-nice', NICE_ARMED = false;
  var NICE = ['Nice one, {n}.', 'Good eye, {n}.', 'That’s the shot, {n}.', '{n}, that’s a keeper.'];
  function sprinkleNice(spots){
    var last = {}; try{ last = JSON.parse(localStorage.getItem(NICE_KEY) || '{}'); }catch(e){}
    var seenLogin = {};
    var ranked = spots.filter(function(s){ return s.login && s.first && !seenLogin[s.login] && (seenLogin[s.login] = 1); })
      .sort(function(a, b){ return (last[a.login] || 0) - (last[b.login] || 0); });
    var phraseOf = dealt(NICE);
    /* one per rebuild (every ten minutes) — "once or twice per deck" */
    ranked.slice(0, 1).forEach(function(s, i){
      var line = phraseOf(i).replace('{n}', s.first);
      s.html = s.htmlFor(line);
      last[s.login] = Date.now();
    });
    try{ localStorage.setItem(NICE_KEY, JSON.stringify(last)); }catch(e){}
  }

  /* The four-photo mosaic ("And there's not just one way to do it")
     retired 2026-09-25 — Randy: "not much meat here. Drop it?" The
     annotated hero shot, the example cards and the detail shot cover it. */

  /* Randy, 2026-09-25: "use some of this" — the September photo-awards
     deck on his Desktop. Its five judging questions, in his own words,
     replace my aphorisms as the coaching content. No point values on
     screen: "don't need to make it about winning." */
  var RUBRIC = [
    ['Unmistakably this species', 'Can you tell what it is from the frame? A great photo of Generic Green Shrub scores zero.'],
    ['Survives the crop', 'Heroes get cut to a wide band and shrunk to a thumbnail. Distant or cluttered subjects die.'],
    ['In the park', 'Show the path, the pond, the fence. This plant, not a book photo.'],
    ['Light and moment', 'Is it good to look at.'],
    ['Teaches something', 'A fruit, a behavior, a clue to scale. The photo has a fact in it.']

  /* Real crew photos with Randy's own notes from that deck, lightly

     complaining... toss it." A kid's photo never goes up with a note

  var EXAMPLES = [
    { id:'731638176', label:'Why this one works',
      note:'Look at the depth. One bract front and center, the whole bed behind it, then the pond and the far shore. Most people shoot the flower and forget the place. Alaina shot both.' },
    { id:'731644653', label:'Why this one works',
      note:'The swollen trunk is the species. Nothing else in the park looks like that. And Kevin kept the path and the plant label in the frame.' },
    { id:'735608579', label:'Why this one works',
      note:'That heavy green fruit couldn’t belong to any other plant here. The prop roots back it up, and the deck railing says this is here. Most visitors have no idea a Screw Pine fruits like that.' },
    { id:'731645331', label:'Why this one works',
      note:'You can count the five points on every flower. That’s exactly what the Pentas page is about.' }
  ];
  /* Randy, 2026-09-25: "needs context. Gotta mention HERO image
     somehow... at the end, a good comment." Then: "mix it up... stock
     phrases, repetition low as people catch on." A pool of closers,
     dealt without replacement each rebuild (see buildSlides), so no
     two cards in a cycle end the same way and the mix changes every
     ten minutes. */
  /* Two of Randy's lines and one short one; the blanks mean about a
     third of the cards get no closer — the note on the photo already is
     the compliment. */
  var HERO_CLOSERS = [
    'Now THAT is a solid hero image.',
    'Now THAT is a hero image that can go live in the park.',
    'That’s the shot.',
    '', ''
  ];
  function dealt(pool){ var bag = pool.slice().sort(function(){ return Math.random()-0.5; }); return function(i){ return bag[i % bag.length]; }; }
  function slideExample(mine, ex, closer){
    var p = null;
    for(var i=0;i<mine.length;i++) if(mine[i].photo_id === ex.id){ p = mine[i]; break; }

        '<div class="card-photo"><img alt="" src="'+p.photo_url+'"></div>'

      + '<h2>'+esc(p.common_name||'')+'</h2>'
      + '<div class="body">'+esc(ex.note)+'</div>'
      + (closer ? '<div class="body nice">'+esc(closer)+'</div>' : '') + '</div>' };
  }

  /* THE DETAIL SHOT — Randy, 2026-09-25: "Another slide: 'here are our
     thoughts on photos with good detail to allow the world to identify
     this species'. Then show examples of THEIRS and why they are good. I
     LOVE the idea of floating text with points, with ARROWS to the photo
     elements. Randomized placements of text in boxes and arrows that go
     to the spot on the photo... NOT a POWERPOINT boring bullet list."
     One chained slide: the intro, then each example with its callouts.
     Every arrow lands on a real spot — x,y are % of the photo, set by
     looking at each picture, not guessed. Voice: "one-on-one, real
     talk... plain language like I respect them but there's shit to get
     done." */
  var ID_EXAMPLES = [
    { id:'731645331', line:'Sharp on the one in front. The rest can blur.',
      callouts:[ { t:'Five points, every flower. That’s pentas.', x:52, y:26 },
                 { t:'The one in front is sharp. That’s the shot.', x:48, y:44 },
                 { t:'Leaves in the frame too: veins, shape. iNat looks at those.', x:14, y:27 } ] },
    { id:'735608579', line:'Three clues in one frame.',
      callouts:[ { t:'That fruit. Nothing else in the park makes one.', x:49, y:46 },
                 { t:'Prop roots. Second clue.', x:83, y:74 },
                 { t:'Strap leaves in a spiral. Third.', x:34, y:60 } ] },
    { id:'723780282', line:'Close enough that the berries are the whole picture.',
      callouts:[ { t:'Purple berries in tight balls, wrapped round the stem. That’s the tell.', x:33, y:47 },
                 { t:'Stem showing between clusters: how they sit.', x:54, y:51 },
                 { t:'Leaf edges: toothed and rough. Backup clue.', x:35, y:84 } ] },
    { id:'735615080', line:'Dead center, in focus, and the part that matters is right there.',
      callouts:[ { t:'That column out of the middle, anthers on it, stigma on top. Hibiscus, every time.', x:51, y:55 },
                 { t:'Red throat, orange petals. It’s the pattern, not just the color.', x:44, y:62 },
                 { t:'Get a leaf in. Glossy, toothed edge.', x:9, y:32 } ] }
  ];
  function slideIdDetail(mine){
    var byId = {}; mine.forEach(function(p){ byId[p.photo_id] = p; });
    var all = ID_EXAMPLES.filter(function(e){ return byId[e.id]; });
    if(all.length < 2) return null;
    var exs = all.slice().sort(function(){ return Math.random()-0.5; }).slice(0, 3);
    /* Randy, 2026-09-25: the intro ran over "a perfect hero image of
       bridal veil tree with bridge and galleria and pond. It was NOT a
       detail photo." So the intro's backdrop is the one detail example
       left out of this showing — a close-up under words about close-ups. */
    var left = all.filter(function(e){ return exs.indexOf(e) < 0; })[0] || exs[0];
    var opener = byId[left.id];
    var steps = [{ seconds: SECONDS*0.5, copy:
        '<div class="label">The detail shot</div>'
      + '<h2>Ok, here’s the other kind of shot.</h2>'
      + '<div class="body">The hero shows where it lives. The detail shot is what lets the world put a name on it: the part only this plant has, close and sharp.</div>'
      + '<div class="body">Some of yours that nail it, coming up.</div>' }];
    exs.forEach(function(e){
      var p = byId[e.id];
      steps.push({ seconds: SECONDS*0.85, photo: p.photo_url, credit: creditText(p), callouts: e.callouts, copy:
          '<div class="label">The detail shot</div>'
        + '<h2>'+esc(p.common_name||'')+'</h2>'
        + '<div class="body">'+esc(e.line)+'</div>' });
    });
    var total = steps.reduce(function(a, s){ return a + s.seconds; }, 0);
    return { id:'iddetail', cls:'split', noflip:true, seconds: total, steps: steps,
             bg: opener && opener.photo_url, credit: opener && creditText(opener),
             html: '<div class="copy"></div><div class="idstage"></div>' };
  }

  /* Lay one example's callouts out around the photo: measure each box,
     try the ten spots around the picture in random order, keep the first
     that covers no target and no other box (preferring one near its own
     target so arrows don't cross the whole frame), then draw the arrow
     from the box to the spot and drop a dot on it. Boxes pop in one at a
     time; each arrow draws itself a beat after its box. */
  function placeCallouts(stage, img, callouts, timers){
    if(!stage.isConnected) return;
    var S = stage.getBoundingClientRect(), R = img.getBoundingClientRect();
    var vmin = Math.min(innerWidth, innerHeight)/100;
    var ox = R.left - S.left, oy = R.top - S.top, W = R.width, H = R.height;
    var svg = stage.querySelector('svg.arrows');
    svg.setAttribute('viewBox', '0 0 '+S.width+' '+S.height);
    svg.innerHTML = '<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>';
    var targets = callouts.map(function(c){ return { x: ox + W*c.x/100, y: oy + H*c.y/100 }; });
    var cands = [
      { ax: ox - 1.5*vmin,     ay: oy + H*0.12, h:'right' }, { ax: ox - 1.5*vmin,     ay: oy + H*0.5, h:'right' }, { ax: ox - 1.5*vmin,     ay: oy + H*0.88, h:'right' },
      { ax: ox + W + 1.5*vmin, ay: oy + H*0.12, h:'left'  }, { ax: ox + W + 1.5*vmin, ay: oy + H*0.5, h:'left'  }, { ax: ox + W + 1.5*vmin, ay: oy + H*0.88, h:'left'  },
      { ax: ox + W*0.3, ay: oy - 1.5*vmin,     h:'center', v:'bottom' }, { ax: ox + W*0.7, ay: oy - 1.5*vmin,     h:'center', v:'bottom' },
      { ax: ox + W*0.3, ay: oy + H + 1.5*vmin, h:'center', v:'top' },    { ax: ox + W*0.7, ay: oy + H + 1.5*vmin, h:'center', v:'top' }
    ].sort(function(){ return Math.random()-0.5; });
    var boxes = [];
    function rectFor(c, bw, bh){
      var l = c.h === 'right' ? c.ax - bw : c.h === 'left' ? c.ax : c.ax - bw/2;
      var t = c.h === 'center' ? (c.v === 'bottom' ? c.ay - bh : c.ay) : c.ay - bh/2;
      l = Math.max(0, Math.min(S.width - bw, l)); t = Math.max(0, Math.min(S.height - bh, t));
      return { l:l, t:t, r:l+bw, b:t+bh };
    }
    function clear(b){
      var pad = 2.5*vmin;
      for(var i=0;i<targets.length;i++){ var g=targets[i]; if(g.x > b.l-pad && g.x < b.r+pad && g.y > b.t-pad && g.y < b.b+pad) return false; }
      for(var j=0;j<boxes.length;j++){ var o=boxes[j]; if(b.l < o.r+vmin && b.r > o.l-vmin && b.t < o.b+vmin && b.b > o.t-vmin) return false; }
      return true;
    }
    callouts.forEach(function(c, i){
      var box = document.createElement('div'); box.className = 'callout';
      box.innerHTML = (c.h ? '<b>'+esc(c.h)+'</b>' : '') + esc(c.t);
      stage.appendChild(box);
      var bw = box.offsetWidth, bh = box.offsetHeight, g = targets[i];
      var ok = [], any = [];
      cands.forEach(function(cd){
        var r = rectFor(cd, bw, bh); if(boxes.some(function(o){ return o.cand === cd; })) return;
        var d = Math.hypot((r.l+r.r)/2 - g.x, (r.t+r.b)/2 - g.y);
        var item = { r:r, cand:cd, d:d }; any.push(item); if(clear(r)) ok.push(item);
      });
      var near = ok.filter(function(it){ return it.d < 0.7*Math.max(W,H); });
      var pool = near.length ? near : ok.length ? ok : any;
      var pick = pool.length ? pool[Math.floor(Math.random()*pool.length)] : null;
      if(!pick){ box.remove(); return; }
      boxes.push({ l:pick.r.l, t:pick.r.t, r:pick.r.r, b:pick.r.b, cand:pick.cand });
      box.style.left = pick.r.l+'px'; box.style.top = pick.r.t+'px';
      var cx = (pick.r.l+pick.r.r)/2, cy = (pick.r.t+pick.r.b)/2;
      /* a callout can point at two things — Randy, on IN THE PARK:
         "there is a building and a railing to choose from" — so `also`
         draws a second arrow from the same box */
      var spots = [g].concat(c.also ? [{ x: ox + W*c.also[0]/100, y: oy + H*c.also[1]/100 }] : []);
      var lines = spots.map(function(p){
        var line = document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('class','arrow'); line.setAttribute('x1',cx); line.setAttribute('y1',cy); line.setAttribute('x2',p.x); line.setAttribute('y2',p.y);
        line.setAttribute('marker-end','url(#ah)');
        var L = Math.hypot(p.x-cx, p.y-cy); line.style.strokeDasharray = L; line.style.strokeDashoffset = L;
        var dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
        dot.setAttribute('class','dot'); dot.setAttribute('cx',p.x); dot.setAttribute('cy',p.y); dot.setAttribute('r', 0.75*vmin);
        svg.appendChild(line); svg.appendChild(dot);
        return { line: line, dot: dot };
      });
      timers.push(setTimeout(function(){ box.classList.add('in'); }, (900 + i*1500)/SPEED));
      lines.forEach(function(ld, k){
        timers.push(setTimeout(function(){ ld.line.style.strokeDashoffset = 0; ld.dot.classList.add('in'); }, (1250 + i*1500 + k*450)/SPEED));
      });
    });
  }

  /* THE HERO SHOT, annotated — the rubric slide (five numbered rows for
     35 s) was the last thing on the deck that read like a presentation.
     Same five headings, Randy's own from the awards deck, now pointed at
     the evidence in two of the crew's photos. Chained like the detail
     shot: intro, then each photo with its five callouts. Coordinates
     set by looking at each picture. */
  var HERO_SHOTS = [
    { id:'731638176', line:'Five things, one frame.',
      callouts:[ { h:RUBRIC[0][0], t:'The bract. Nothing else in the bed looks like that.', x:67, y:44 },
                 { h:RUBRIC[1][0], t:'One tall thing, centered. Cut it to a wide band and it still works.', x:63, y:62 },
                 { h:RUBRIC[2][0], t:'The bed, the road, the far trees. This is here.', x:30, y:41, also:[85,33] },
                 { h:RUBRIC[3][0], t:'Evening light, storm sky. Good to look at.', x:40, y:16 },
                 { h:RUBRIC[4][0], t:'The orange flowers poke out of the bract. That’s the fact.', x:52, y:53 } ] },
    { id:'735608579', line:'Same five. Different plant.',
      callouts:[ { h:RUBRIC[0][0], t:'That fruit.', x:49, y:46 },
                 { h:RUBRIC[1][0], t:'Fruit, roots, leaves, all in the middle band. Crops wide, crops tight.', x:45, y:56 },
                 { h:RUBRIC[2][0], t:'Deck railing, house. Here, not a book.', x:12, y:55, also:[76,42] },
                 { h:RUBRIC[3][0], t:'Overcast. Even light, no glare on the fruit.', x:70, y:15 },
                 { h:RUBRIC[4][0], t:'Prop roots. Most people have no idea.', x:83, y:74 } ] }
  ];
  function slideHeroShot(mine){
    var byId = {}; mine.forEach(function(p){ byId[p.photo_id] = p; });
    var exs = HERO_SHOTS.filter(function(e){ return byId[e.id]; });
    if(!exs.length) return null;
    var opener = randomPhoto(mine.filter(function(x){ return x.hero; })) || randomPhoto(mine);
    /* Randy, 2026-09-25: the intro "needs to say more about these are
       our best thoughts on how to document our species... and that a
       couple screens will follow." */
    var steps = [{ seconds: SECONDS*0.6, copy:
        '<div class="label">The hero shot</div>'
      + '<h2>Ok, so here’s our best thoughts on the hero shot.</h2>'
      + '<div class="body">The one photo that stands for the species, on the sign and on the page. Check out the next couple of slides.</div>'
      + '<div class="body">Let’s try for one of these every observation. Maybe you get selected.</div>' }];
    exs.forEach(function(e){
      var p = byId[e.id];
      steps.push({ seconds: SECONDS*1.15, photo: p.photo_url, credit: creditText(p), callouts: e.callouts, copy:
          '<div class="label">The hero shot</div>'
        + '<h2>'+esc(p.common_name||'')+'</h2>'
        + '<div class="body">'+esc(e.line)+'</div>' });
    });
    var total = steps.reduce(function(a, s){ return a + s.seconds; }, 0);
    return { id:'heroshot', cls:'split', noflip:true, seconds: total, steps: steps,
             bg: opener && opener.photo_url, credit: opener && creditText(opener),
             html: '<div class="copy"></div><div class="idstage"></div>' };
  }

  /* The website ask — the twin of slideSigns(). Randy, 2026-09-25:
     "we need better hero images for the website. images to represent
     the species. constantly updating — so get photos." Same shape as
     the signs slide so the two asks read as a pair. Replaced the old
     "pages that need a better photo" card, which named pages and said
     what was wrong with their photos. */
  function slideWebsite(mine){
    var p = randomPhoto(mine.filter(function(x){ return x.hero; })) || randomPhoto(mine);
    return { id:'website', seconds: SECONDS*1.9, shout:true, bg: p && p.photo_url, credit: p && creditText(p), html:
        '<div class="copy"><div class="label">The website</div>'
      + '<div class="shout-line">We need <em>hero</em> photos.</div>'
      + '<div class="body">The hero leads the species page and goes on the sign. The plant, unmistakable, sharp, with a bit of the park behind it.</div>'
      + '<div class="body">Or so darn gorgeous we can’t NOT use it.</div>'
      + '<div class="body">Shoot a better one. It goes up with your name under it.</div></div>' };
  }

  function slideWhyMultiple(mine){
    var p = randomPhoto(mine);
    return { id:'multiple', seconds: SECONDS*1.1, bg: p && p.photo_url, credit: p && creditText(p), html:
        '<div class="copy"><div class="label">Take more than one</div><h2>Take three.</h2>'
    + '<div class="body">Wide. Closer. Closer again. Toss two later if you want. You can’t go back for the one you skipped.</div></div>' };
  }

  function slideWhyAllYear(mine){

        '<div class="copy"><div class="label">Shoot it again</div><h2>Same plant, three different plants.</h2>'
    + '<div class="body">Bare in winter. Flowers in spring. Fruit in fall. So no, we don’t already have that one.</div></div>' };

  /* WHO SHOT THIS? — Randy, 2026-09-25: "yes ask who a lot. very good."
     The photo alone for a beat, then the name slams in. Attribution as
     the payoff of the slide, not a caption under it. Species after. */
  function slideWhoShot(mine){
    var p = freshPhoto(mine);

    /* question + species for the first half; the caption answers it at

    return { id:'who-'+p.photo_id, seconds: dur, bg: p.photo_url, credit: creditText(p), creditDelay: dur/2, html:
        '<div class="copy"><div class="reveal-q">Who shot this?</div>'
      + '<h2>'+esc(p.common_name||'')+'</h2></div>' };
  }

  /* THIS LIVES HERE. — the loud one. A crew wildlife photo, block caps,
     short dwell. Kept rare in buildSlides: "no overdo of course." */
  function slideLivesHere(mine){

    var p = randomPhoto(wild);
    if(!p) return null;
    return { id:'lives-'+p.photo_id, seconds: SECONDS*0.8, shout:true, bg: p.photo_url, credit: creditText(p), html:
        '<div class="copy"><div class="shout-line">This <em>lives</em> here.</div>'
      + '<div class="shout-sub"><b>'+esc(p.common_name||'')+'</b></div></div>' };

  /* FIRST ONE THIS MONTH — a species only one crew member has logged in
     the last 30 days. Real, personal, changes every week. */
  function slideFirstFind(names){
    if(!PULSE || !PULSE.speciesList) return null;
    var firsts = PULSE.speciesList.filter(function(s){ return s.count === 1 && s.photos.length && s.name; });
    if(!firsts.length) return null;
    var s = firsts[Math.floor(Math.random()*firsts.length)], ph = s.photos[0];
    var credit = window.PSBPPhotos.creditPlate({ by: nameFor(names, ph.login), date: ph.observed_on, license: ph.license });
    return { id:'first-'+s.name, seconds: SECONDS*0.9, shout:true, bg: ph.url, credit: credit, html:
        '<div class="copy"><div class="shout-line">First one <em>this month.</em></div>'
      + '<div class="shout-sub"><b>'+esc(cap(s.name))+'</b></div></div>' };
