  /* Randy, 2026-09-25, on the emoji chain that used to be here: "just
     horrible. the graphics must go. I suggested an idea but it was very
     very poorly done. Rethink total on that." Rethought around the park's
     own artifacts instead of icons: one of the crew's photos that
     actually became a species page's hero, and then the real page itself
     — live from this same repo, scaled down — fading in beside it with
     their credit line sitting at the top of it. Nothing drawn, nothing
     pretend. (No printable sign pages exist in the repo, so the sign is
     a plain sentence, not a graphic.) */
  /* Randy, 2026-09-25: "Maybe instead of saying 'Why this matters' we
     just have a sign: The park will update signage constantly to refresh
     photos, and improve what is written on them, as well as replace
     damaged and worn. We NEED THEM to get us good photos for those
     signs!!!!! They will be credited. Bonus if we can fit it on there
     that in a month, we will do a large batch of signs so get those pics
     now." The ask, plainly, over one of their own photos. The dated
     "big batch" line lives in brightfutures_today.json (signs_push) so it
     can be changed or dropped without touching code. */
  /* THE OPENER — Randy, 2026-09-25: "a new vibe to the whole thing. It
     is a message from me to them as young adults to say: come on in. get
     settled. DO STUFF! This is a place to just do things... I don't want
     to be explicit but that's the vibe." And: "the rest is suggestions.
     what to do. how to do it. why it's important." So this is the one
     slide that says it outright, three lines landing a beat apart; every
     other slide on the deck is a suggestion of one of those three kinds.
     Heavy while they're walking in (3:00–3:45), then out of the rotation. */
  function slideWelcome(mine){
    var p = randomPhoto(mine.filter(function(x){ return x.hero; })) || randomPhoto(mine);
    return { id:'welcome', seconds: SECONDS*1.6, shout:true, bg: p && p.photo_url, credit: p && creditText(p), creditDelay: 4.5, html:
        '<div class="copy slow">'
      + '<div class="shout-line">Come on in.</div>'
      + '<div class="shout-line">Put your stuff down.</div>'
      + '<div class="shout-line">Let’s do <em>stuff.</em></div>'
      + '<div class="body">The list. iNat. The office. The nursery. Pick one and go.</div></div>' };
  }

  function slideSigns(mine, tasksData){
    var p = randomPhoto(mine.filter(function(x){ return x.hero; })) || randomPhoto(mine);
    var push = tasksData && tasksData.signs_push;
    return { id:'signs', seconds: SECONDS*1.9, shout:true, bg: p && p.photo_url, credit: p && creditText(p), html:
        '<div class="copy"><div class="label">The signs</div>'
      + '<div class="shout-line">We need your <em>photos.</em></div>'
      + '<div class="body">New signs go up all the time. Wednesdays, right here.</div>'
      + '<div class="body">Your photo. Your name on it.</div>'
      + (push ? '<div class="body"><b>'+esc(push)+'</b></div>' : '') + '</div>' };
  }

  /* Photos OF the crew, not photos they took — images/brightfutures-
     local/photos.json. That whole folder is gitignored on purpose: these
     are photos of minors, and this repo is public. Randy, 2026-09-25:
     "ill keep on office computer" — so this only ever renders on a
     machine that actually has the local folder populated; every other
     machine (and GitHub Pages) just sees the empty-state teaser below,
     which is the correct, safe default rather than a broken image. */
  function slideCrewMontage(crewPhotos){
    var rows = (crewPhotos && crewPhotos.photos) || [];
    /* Out of rotation while empty — a "coming soon" slide is dead air to
       a kid. The slot lights up the moment photos.json has rows. */
    if(!rows.length) return null;
    var pics = rows.slice(0,8).map(function(r){ return '<img alt="" src="'+BASE+'images/brightfutures-local/'+r.file+'">'; }).join('');
    return { id:'montage', seconds: SECONDS*1.5, html:
        '<div class="copy"><div class="label">The crew</div>'
      + '<h2>Wednesdays at the park.</h2></div>'
      + '<div class="photo-grid">'+pics+'</div>' };
  }

  function slideCleanup(){
    return { id:'cleanup', seconds: SECONDS*1.1, warn:true, html:
        '<div class="copy"><div class="label">5:30</div><h2>WARNING — time to stop what you’re doing.</h2>'
      + '<div class="body"><b>Carts</b> put away and washed down. <b>Tools</b> put away. Wrap up what you’re holding.</div></div>' };
  }
  /* The wrap-up lists what got done, not just iNat — otherwise the
     screen says iNat is the work that counts, and somebody who hauled
     mulch for three hours sees nothing. `today_accomplishments` in
     brightfutures_today.json, typed in that afternoon; empty is fine. */
  function slideSummary(){
    var stats = (PULSE && PULSE.todayObs)
      ? '<div class="stat-row">'
        + countHtml(PULSE.todayObs, 'observations')
        + countHtml(PULSE.todaySpecies, 'species')
        + countHtml(PULSE.todayObservers, 'observers') + '</div>'
      : '<div class="body">Today’s iNat numbers are still coming in — check the app.</div>';
    var done = (TODAY && TODAY.today_accomplishments || []).filter(Boolean).slice(0,4);
    var doneHtml = done.length ? '<div class="body done">' + done.map(function(d){ return '<b>'+esc(d)+'</b>'; }).join(' · ') + '</div>' : '';
    return { id:'summary', seconds: SECONDS*1.6, html:
        '<div class="copy"><div class="label">5:45 · Look what happened today</div>'
      + stats + doneHtml + '<div class="body">That’s a Wednesday. See you next week.</div></div>' };
  }

  /* ── data load + rotation ───────────────────────────────────────────── */
  var BASE = '../';
  var slides = [], TODAY = null;   /* TODAY = brightfutures_today.json, once loaded */
  var lastForced = { cleanup:0, summary:0 };

  function forcedSlide(){
    var d=new Date(), mins=d.getHours()*60+d.getMinutes(), now=Date.now();
    if(mins>=17*60+30 && mins<17*60+45){
      if(now - lastForced.cleanup > 90000){ lastForced.cleanup=now; return slideCleanup(); }
    } else if(mins>=17*60+45 && mins<18*60+15){
      if(now - lastForced.summary > 150000){ lastForced.summary=now; return slideSummary(); }
    }
    return null;
  }

  var cur = null, last = null;
  var creditEl = document.getElementById('credit');
  /* Randy, 2026-09-25: "I am liking the idea of the photograph thing
     sliding in a little after the slide starts, to give it some guessing
     from the kids — to see whose pic it is each time. tad bit of
     suspense. even on the slides that do NOT ask who shot this."
     So every caption arrives late: CREDIT_LAG after a slide starts
     (the copy has landed by then), FRAME_LAG after each photo flip on a
     frames slide, the halfway mark on "Who shot this?". The wall's
     captions are the exception — its tiles ARE the reveal, so the name
     lands with them. `lagMs` is already speed-scaled by the caller. */
  var CREDIT_LAG = 2600, FRAME_LAG = 1500;
  var creditTimer = null;
  function setCredit(html, lagMs){
    if(creditTimer){ clearTimeout(creditTimer); creditTimer = null; }
    creditEl.classList.remove('on');
    if(!html) return;
    function show(){ creditEl.innerHTML = html; creditEl.classList.add('on'); }
    if(lagMs) creditTimer = setTimeout(show, lagMs); else show();
  }

  /* Numbers count up from 0 instead of just sitting there — a stat card
     is a dashboard; a number climbing is something you watch. Any
     .count[data-n] (see countHtml) gets it. Under reduced motion it just
     lands on the final number. */
  var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
  function countHtml(n, label, cls){
    return '<div class="count'+(cls ? ' '+cls : '')+'" data-n="'+n+'">'+(REDUCED ? n : 0)+'<small>'+label+'</small></div>';
  }
  function countUp(el){
    if(REDUCED) return;
    var nodes = el.querySelectorAll('.count[data-n]');
    for(var i=0;i<nodes.length;i++)(function(node){
      var target = parseInt(node.getAttribute('data-n'),10) || 0;
      var small = node.querySelector('small'), label = small ? small.outerHTML : '';
      /* same rAF caveat as the fade-in: a hidden tab would leave it at 0 */
      if(document.hidden){ node.innerHTML = target + label; return; }
      var t0 = null, ms = 1100/SPEED;
      function step(ts){
        if(!t0) t0 = ts;
        var k = Math.min(1, (ts - t0)/ms); k = 1 - Math.pow(1-k, 3);
        node.innerHTML = Math.round(target*k) + label;
        if(k < 1) requestAnimationFrame(step);
      }
      setTimeout(function(){ requestAnimationFrame(step); }, 1200/SPEED);   /* after the stat row has faded in */
    })(nodes[i]);
  }

  /* `s.frames` — a slide that steps through several real photos (with a
     credit each) while it stays on screen, instead of one static image.
     Randy, 2026-09-25: "this slide is begging for the pics to be cycled
     through with credits for each. show all 5 in succession." Every
     photo, framed or not, drives the one standardized credit block
     (bottom-left, see .credit-block) rather than its own one-off caption. */
  function render(s){
    var el = document.createElement('div');
    el.className = 'slide' + (s.warn ? ' warn' : '') + (s.shout ? ' shout' : '') + (s.cls ? ' '+s.cls : '');
    var frames = s.frames;
    var firstBg = frames ? frames[0].bg : s.bg;
    /* one of three slow camera moves, at random — see .kb1/.kb2/.kb3 */
    var kb = firstBg ? ' kb' + (1 + Math.floor(Math.random()*3)) : '';
    var bg = '<div class="bg'+(firstBg?' photo'+kb:'')+'"'+(firstBg?' style="background-image:url('+firstBg+')"':'')+'></div>';
    var scrim = firstBg ? '<div class="scrim"></div>' : '';
    el.innerHTML = bg + scrim + s.html;
    deck.appendChild(el);
    if(firstBg){
      /* single-photo slides whose busy part is on the left put the words on the right */
      var flip = !!(s.focus && s.focus.fx < 0.45 && !s.noflip && !frames && !s.build && !s.steps);
      if(flip) el.classList.add('flip');
      placeBg(el.querySelector('.bg'), firstBg, flip ? BG_TX_FLIP : BG_TX);
    }
    /* A timer, not requestAnimationFrame: rAF never fires in a hidden or
       throttled tab, which left slides built but stuck at opacity 0
       during proofing. 40 ms is enough for the browser to paint the
       opacity-0 state first so the fade actually runs. */
    setTimeout(function(){ el.classList.add('on'); }, 40);
    if(cur){
      if(cur._frameTimer) clearInterval(cur._frameTimer);
      if(cur._quiltTimer) clearTimeout(cur._quiltTimer);
      if(cur._stepTimers) cur._stepTimers.forEach(clearTimeout);
      var old=cur; old.classList.remove('on'); setTimeout(function(){ old.remove(); }, 1300/SPEED);
    }
    cur = el;
    var dur = s.seconds || SECONDS;
    countUp(el);

    if(frames && frames.length > 1){
      var bgEl = el.querySelector('.bg'), titleEl = el.querySelector('.frame-title');
      setCredit(frames[0].credit || '', CREDIT_LAG/SPEED);
      var fi = 0, frameMs = (dur*1000/frames.length);
      el._frameTimer = setInterval(function(){
        fi = (fi+1) % frames.length;
        bgEl.style.opacity = 0;
        setTimeout(function(){
          placeBg(bgEl, frames[fi].bg, BG_TX);
          if(titleEl && frames[fi].title) titleEl.textContent = frames[fi].title;
          setCredit(frames[fi].credit || '', FRAME_LAG/SPEED);   /* a beat to guess, every flip */
          bgEl.style.opacity = 1;
        }, 260/SPEED);
      }, frameMs);
    } else if(s.creditDelay){
      /* "Who shot this?" — hold the caption back until the halfway mark */
      setCredit(s.credit || '', s.creditDelay*1000);
    } else if(!s.steps){
      setCredit(s.credit || '', CREDIT_LAG/SPEED);
    }

    /* `s.build` — Most photographed: one list row per beat, the photo
       behind and the caption switching with each row. */
    if(s.build){
      var listEl = el.querySelector('.obs-list'), bgB = el.querySelector('.bg'), bi = 0;
      el._stepTimers = el._stepTimers || [];
      function addRow(){
        if(!el.isConnected) return;
        var r = s.build.rows[bi];
        var holder = document.createElement('div'); holder.innerHTML = r.html;
        listEl.appendChild(holder.firstChild);
        if(r.bg && bi > 0){
          bgB.style.opacity = 0;
          el._stepTimers.push(setTimeout(function(){
            placeBg(bgB, r.bg, BG_TX); bgB.style.opacity = 1;
          }, 260/SPEED));
        }
        if(r.credit !== undefined) setCredit(r.credit || '');
        bi++;
        if(bi < s.build.rows.length) el._stepTimers.push(setTimeout(addRow, s.build.rowMs));
      }
      el._stepTimers.push(setTimeout(addRow, s.build.intro));
    }

    /* `s.steps` — the detail-shot slide: the copy changes step by step;
       steps with a photo hide the full-bleed background and show the
       photo in the stage on the right with its callouts and arrows. */
    if(s.steps && s.steps.length){
      var copyEl = el.querySelector('.copy'), stage = el.querySelector('.idstage');
      var bgEl2 = el.querySelector('.bg'), scrimEl = el.querySelector('.scrim'), si = 0;
      el._stepTimers = [];
      function showStep(){
        if(!el.isConnected) return;
        var st = s.steps[si];
        copyEl.innerHTML = st.copy;
        if(st.photo){
          bgEl2.style.opacity = 0; if(scrimEl) scrimEl.style.opacity = 0;
          stage.innerHTML = '<img alt="" src="'+st.photo+'"><svg class="arrows"></svg>';
          stage.classList.add('in');
          var img = stage.querySelector('img');
          img.onload = function(){ placeCallouts(stage, img, st.callouts || [], el._stepTimers); };
          if(img.complete && img.naturalWidth) img.onload();
          setCredit(st.credit || '', CREDIT_LAG/SPEED);
        } else {
          stage.classList.remove('in'); stage.innerHTML = '';
          setCredit(s.credit || '', CREDIT_LAG/SPEED);
        }
        si++;
        if(si < s.steps.length) el._stepTimers.push(setTimeout(showStep, st.seconds*1000));
      }
      showStep();
    }

    /* `s.quilt` — the monthly slide's patchwork: one photographer's
       tiles pop in around the text, hold, shrink away, and the next
       photographer's arrangement takes the space; the bottom-left
       caption names whoever is up. The tiles are the reveal, so the
       caption lands with them, no lag. */
    if(s.quilt && s.quilt.length){
      var quiltEl = el.querySelector('.quilt'), gi = 0;
      var groupMs = Math.max(3200/SPEED, (dur*1000 - 1400/SPEED) / s.quilt.length);
      function showGroup(g){
        var olds = quiltEl.querySelectorAll('.tile');
        for(var i=0;i<olds.length;i++) olds[i].classList.add('out');
        setTimeout(function(){
          if(!quiltEl.isConnected) return;
          setCredit(g.credit || '');
          quiltEl.innerHTML = '';
          g.items.forEach(function(it, k){
            var t = document.createElement('div'); t.className = 'tile '+it.kind;
            t.style.cssText = 'left:'+it.x.toFixed(1)+'%;top:'+it.y.toFixed(1)+'%;width:'+it.w.toFixed(1)+'vmin;height:'+it.h.toFixed(1)+'vmin;'
              + '--rot:'+it.rot+'deg;z-index:'+(k+1)+';animation-delay:'+(k*0.07/SPEED).toFixed(2)+'s';
            t.innerHTML = '<img alt="" src="'+it.url+'">';
            quiltEl.appendChild(t);
          });
        }, olds.length ? 260/SPEED : 0);
      }
      el._quiltTimer = setTimeout(function tickQuilt(){
        showGroup(s.quilt[gi]); gi++;
        if(gi < s.quilt.length) el._quiltTimer = setTimeout(tickQuilt, groupMs);
      }, 1400/SPEED);
    }

    bar.style.transition='none'; bar.style.width='0';
    requestAnimationFrame(function(){ bar.style.transition='width '+dur+'s linear'; bar.style.width='100%'; });
    return dur;
  }

  /* Randy, 2026-09-25: "too many screens repeat with only one other screen
     between them." Only excluding the ONE previous slide let a 10-13-item
     pool repeat itself constantly (A, B, A, C, A…). A shuffle bag — every
     slide shown once before ANY repeats — fixes that properly, same
     device screen.html's own slideSpotlight() uses for the same reason. */
  /* Randy, 2026-09-25 (again): "slides repeat too frequently." The reset
     above had a seam — the instant `seen` emptied, the pool was every
     slide again, INCLUDING the one that had just played, so a reset could
     repeat the last slide back-to-back. `lastId` is tracked outside
     `seen` and excluded no matter what state the bag is in. */
  /* ?only=who  (or rubric, ex-, lives-, first-, crew, pulse…) restricts
     the rotation to slides whose id starts with that — for proofing one
     format without waiting on the shuffle. */
  var ONLY = (Q.get('only') || '').trim();
  var seen = [], lastId = null;
  function pick(){
    var forced = forcedSlide();
    if(forced) return forced;
    /* the two clock slides aren't in the bag, so ?only= reaches them by name */
    if(ONLY === 'summary') return slideSummary();
    if(ONLY === 'cleanup') return slideCleanup();
    /* THE OPENER is scheduled, not shuffled — Randy, 2026-09-25: "first
       slide should always be about welcoming them in... If any were to
       repeat at the first hour most often, that would be it. Then it
       fades in prominence as the hours go by... From 2:30–3:30, it is
       every 4th slide or so. Then disappears by 4:30." */
    /* …and the task sheet runs the same way, staggered off the opener —
       "every 6th? and staggered from each other? then lower how often
       because they are all settled and doing stuff after that." */
    if(!ONLY){
      var due = null, wE = welcomeEvery(), tE = tasksEvery();
      if(WELCOME && (picks === 0 || (wE && sinceWelcome >= wE))){ due = WELCOME; sinceWelcome = -1; }
      else if(TASKS && tE && sinceTasks >= tE){ due = TASKS; sinceTasks = -1; }
      picks++; sinceWelcome++; sinceTasks++;
      if(due){ lastId = due.id; return due; }
    }
    var all = ONLY ? slides.filter(function(s){ return s.id.indexOf(ONLY) === 0; }) : slides;
    /* ?only= for a live-data slide (month, mostphoto…) matches nothing
       until the iNat pulse lands — hold on "Loading…" for a couple of
       seconds rather than falling back to the whole deck, which put the
       proof on the wrong slide for a full dwell. */
    if(!all.length) return { id:'empty', seconds: ONLY ? 2 : SECONDS, html:'<div class="copy"><h2>Loading…</h2></div>' };
    if(seen.length >= all.length - 1) seen = [];
    /* Randy, 2026-09-25: "iNat monthly has repeated too many times or
       too frequently... was only a couple slides ago and then again.
       Maybe set min it can repeat somehow to 5 slide types?" The three
       weighted copies have different ids, so "not twice in a row" never
       saw them as the same slide. Now every slide has a FAMILY (the
       weighted copies, all the Who-shot-this, all three Most-photographed
       ranks…) and a family can't come back within MIN_GAP slides — relaxed
       only when nothing else is left in the bag. */
    var fresh = all.filter(function(s){ return seen.indexOf(s.id) < 0 && s.id !== lastId; });
    if(!fresh.length) fresh = all.filter(function(s){ return s.id !== lastId; });
    var pool = [], gap = MIN_GAP;
    while(!pool.length && gap >= 0){
      var recentFam = gap ? recent.slice(-gap) : [];   /* slice(-0) is the whole list, not none */
      pool = fresh.filter(function(s){ return recentFam.indexOf(familyOf(s.id)) < 0; });
      gap--;
    }
    var s = pool.length ? pool[Math.floor(Math.random()*pool.length)] : all[0];
    seen.push(s.id);
    lastId = s.id;
    recent.push(familyOf(s.id)); if(recent.length > MIN_GAP) recent.shift();
    return s;
  }
  var MIN_GAP = 5, recent = [];
  var WELCOME = null, TASKS = null, picks = 0, sinceWelcome = 0, sinceTasks = 3;   /* tasks starts half a beat along, so the two never land together */
  function welcomeEvery(){
    var m = new Date().getHours()*60 + new Date().getMinutes();
    if(m < 14*60+30) return 6;     /* setting up — still say hi */
    if(m < 15*60+30) return 4;     /* they're walking in */
    if(m < 16*60)    return 7;
    if(m < 16*60+30) return 12;
    return 0;                      /* gone by 4:30 */
  }
  function tasksEvery(){
    var m = new Date().getHours()*60 + new Date().getMinutes();
    if(m < 14*60+30) return 8;
    if(m < 15*60+30) return 6;     /* pick a job */
    if(m < 16*60)    return 9;
    if(m < 17*60+30) return 14;    /* settled and doing stuff; still there for whoever finishes one */
    return 0;                      /* cleanup time */
  }
  function familyOf(id){
    return id.replace(/-w\d+$/, '').replace(/^(who|spotlight|lives|first|ex|mostphoto|month)-.*$/, '$1');
  }

  function next(){
    var s = pick();
    /* know the photo's focus BEFORE the slide starts, so the words land
       on the right side first time (cached: instant; new photo: the
       previous slide holds up to 0.7 s longer) */
    var ready = (s.bg && !s.frames && !s.build)
      ? Promise.race([focusFor(s.bg), new Promise(function(r){ setTimeout(r, 700); })])
      : Promise.resolve(null);
    ready.then(function(f){
      if(f) s.focus = f;
      var dur;
      /* an unattended TV must never stop on one bad slide */
      try{ dur = render(s); }catch(e){ dur = 1; }
      setTimeout(next, (dur || 1)*1000);
    });
  }

  /* quick_hits — the same fun-fact array the public species pages use,
     keyed by id (== photo_credits.json's psbp_id). Randy: "too boring
     without good info." */
  function indexHits(blob){
    var hits = {}, rows = (blob && blob.species) || blob || [];
    rows.forEach(function(r){ if(r && r.id && r.quick_hits && r.quick_hits.length) hits[r.id] = r.quick_hits; });
    return hits;
  }

  /* Randy, 2026-09-25: "slides repeat too frequently." More
     slidePhotoSpotlight() draws (each pulls a real, different photo — a
     bigger pool means the shuffle bag takes longer to cycle back to
     anything). De-duped by photo id below in case two draws collide. */
  /* Reviewer's note, 2026-09-25: weight the rotation — "three content
     types: live crew status, recognition, coaching... roughly half the
     screen time live/recognition, a quarter to a third coaching." The
     shuffle bag in pick() guarantees every slide shown once before ANY
     repeats, so weight means duplicate pool slots (distinct ids, same
     content) rather than a probability — a slide with 3 slots shows 3x
     per full pass through the bag, still with the bag's no-immediate-
     repeat guarantee. */
  /* the monthly collage as three showings, each with a third of this
     month's photographer groups (see monthGroups) */
  function monthSlides(names){
    if(!PULSE || !PULSE.monthObs) return [];
    var groups = monthGroups(), per = Math.ceil(groups.length/3), out = [];
    for(var i=0; i<3; i++){
      var chunk = groups.slice(i*per, (i+1)*per);
      if(chunk.length) out.push(slideMonth(names, chunk, i));
    }
    return out;
  }
  function weighted(slideObj, n){
    if(!slideObj) return [];
    var out = [];
    for(var i=0; i<n; i++){
      var copy = {}; for(var k in slideObj) copy[k] = slideObj[k];
      copy.id = slideObj.id + '-w' + i;
      out.push(copy);
    }
    return out;
  }
  function pickN(list, n){
    return list.slice().sort(function(){ return Math.random()-0.5; }).slice(0,n);
  }
  function buildSlides(tasksData, events, photos, names, mine, hits, crewPhotos){
    var spotlights = [], seenIds = {};
    for(var i=0; i<5; i++){
      var sp = slidePhotoSpotlight(mine, hits);
      if(sp && !seenIds[sp.id]){ seenIds[sp.id] = 1; spotlights.push(sp); }
    }
    /* only the build that actually stays on screen spends the budget —
       the first build of a load is replaced seconds later by the pulse one */
    if(NICE_ARMED){ sprinkleNice(spotlights); NICE_ARMED = false; }

    /* Reviewer: "Today at the park should probably be very prominent from
       3:00-4:00... then reduce it later." */
    /* the task sheet is scheduled by pick() too — see tasksEvery() */
    var tasksSlide = TASKS = slideTasks(tasksData, mine);
    /* the opener is scheduled by pick(), not shuffled — see welcomeEvery();
       in ?only= proofing it goes in the bag like anything else */
    WELCOME = slideWelcome(mine);
    var welcomeN = ONLY ? 1 : 0;

    /* Reviewer: "four photography-instruction slides is a lot. I'd
       rotate only one or two of those in any given session." Two of the
       general ones, plus one or two of Randy's example cards. */
    var coachingAll = [slideWhyMultiple(mine), slideWhyAllYear(mine)].filter(Boolean);
    var closerOf = dealt(HERO_CLOSERS);
    var examplesAll = EXAMPLES.map(function(ex, i){ return slideExample(mine, ex, closerOf(i)); }).filter(Boolean);
    /* ?only= proofing wants every format reachable, so skip the sampling then */
    var coaching = ONLY ? coachingAll : pickN(coachingAll, 2);
    var examples = ONLY ? examplesAll : pickN(examplesAll, 2);

    /* "ask who a lot" — four different photos per cycle. Shout slides
       stay rare: "no overdo of course." */
    var whos = [], seenW = {};
    for(var w=0; w<4; w++){ var q = slideWhoShot(mine); if(q && !seenW[q.id]){ seenW[q.id]=1; whos.push(q); } }

    var built = []
      .concat(weighted(slideWelcome(mine), welcomeN))
      .concat(monthSlides(names))
      .concat([slideMostPhotographed(names, 0), slideMostPhotographed(names, 1), slideMostPhotographed(names, 2)])
      .concat(weighted(slideSigns(mine, tasksData), 2))
      .concat(weighted(slideWebsite(mine), 2))
      .concat(weighted(slideChallenge(mine), 2))
      .concat(weighted(tasksSlide, ONLY ? 1 : 0))
      .concat(spotlights)
      .concat(whos)
      .concat([slideLivesHere(mine), slideFirstFind(names)])
      .concat([slideSpeciesSeen(names), slideEvents(events, mine), slideCrewMontage(crewPhotos)])
      .concat(coaching)
      .concat(examples)
      .concat([slideHeroShot(mine), slideIdDetail(mine)]);
    slides = built.filter(Boolean);
    /* the bag remembers ids; drop the ones that no longer exist (each
       rebuild draws new photos, so stale ids would pad the count and
       reset the bag early — repeats sooner than they should) */
    var live = {}; slides.forEach(function(s){ live[s.id] = 1; });
    seen = seen.filter(function(id){ return live[id]; });
    /* warm every full-bleed photo this deck can show, in the background */
    var urls = [];
    slides.forEach(function(s){
      if(s.bg) urls.push(s.bg);
      (s.frames || []).forEach(function(f){ if(f.bg) urls.push(f.bg); });
      ((s.build && s.build.rows) || []).forEach(function(r){ if(r.bg) urls.push(r.bg); });
    });
    warmPhotos(urls);
  }

  /* names has to load BEFORE loadPulse — the pulse filters every
     observation to Bright Futures logins as it fetches, it can't be
     filtered after the fact. brightfutures-local/photos.json 404s on
     every machine that doesn't have it (GitHub Pages, any clone without
     the local folder) — that's fine, grab() already resolves those to
     null and slideCrewMontage() shows the teaser instead. */
  function loadEverything(){
    return grab(BASE+'data/sources/photographer_names.json').then(function(names){
      names = names || {};
      var bfSet = bfLogins(names);
      /* iNat is the slow one — a few seconds, sometimes more. Don't hold
         the first slide for it: build the deck from the local JSON the
         moment it lands, then rebuild once the pulse arrives so the live
         slides join the rotation. Startup was a ~6 s blank screen. */
      var pulse = loadPulse(bfSet);
      return Promise.all([
        grab(BASE+'data/published/brightfutures_today.json'),
        grab(BASE+'data/published/events.json'),
        grab(BASE+'data/sources/photo_credits.json'),
        grab(BASE+'data/sources/plant_signage.json'),
        grab(BASE+'data/sources/wildlife_signage.json'),
        grab(BASE+'images/brightfutures-local/photos.json')
      ]).then(function(r){
        var photos = (r[2] && r[2].photos) || r[2] || [];
        var mine = crewOf(photos, bfSet);
        var hits = indexHits(r[3]); Object.assign(hits, indexHits(r[4]));
        /* the week's task-sheet photo: test-load it before the first
           build (local image, well under a second; a 404 fails fast) so
           the tasks slide is the split-pane version from the first pick */
        var today = TODAY = r[0], sheetReady = Promise.resolve();
        if(today && today.sheet){
          /* a new photo at the same path shows within ten minutes — the
             kiosk and GitHub Pages both cache the old one otherwise */
          today.sheetUrl = BASE + today.sheet + '?t=' + Math.floor(Date.now()/600000);
          sheetReady = new Promise(function(res){
            var im = new Image(), done = false;
            function fin(ok){ if(done) return; done = true; today.sheetOk = ok; res(); }
            im.onload = function(){ fin(true); };
            im.onerror = function(){ fin(false); };
            setTimeout(function(){ fin(false); }, 4000);
            im.src = today.sheetUrl;
          });
        }
        function build(){ buildSlides(today, r[1], photos, names, mine, hits, r[5]); }
        function finalBuild(){ NICE_ARMED = true; build(); }
        return sheetReady.then(function(){ build(); pulse.then(finalBuild, finalBuild); });
      });
    });
  }

  loadEverything().then(next).catch(function(){ slides = [slideWhyMultiple([]), slideWhyAllYear([])]; next(); });

  /* Refresh data + iNat pulse every 10 minutes, same cadence as the rest
     of the kiosk fleet. */
  setInterval(function(){ loadEverything().catch(function(){}); }, (10*60*1000) / SPEED);
})();
</script>
</body>
</html>
