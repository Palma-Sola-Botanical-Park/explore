<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bright Futures — Palma Sola Botanical Park</title>
<link rel="icon" type="image/png" href="../images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<!-- ?v= is a cache-buster. GitHub Pages and the kiosk browser cache CSS
     for 10 minutes; bump it whenever the stylesheet changes or the TV
     keeps showing the old look after a pull. -->
<link rel="stylesheet" href="events/event-deck.css?v=20260925d">
<link rel="stylesheet" href="events/event-brightfutures.css?v=20260925d">
<!-- Standalone deck for the Wednesday Bright Futures high-school session.
     Randy, 2026-09-25: "volunteers would refer to adults so the name of
     this html is wrong imo. We call this crew Bright Futures" — this is
     their crew's screen, not a generic "volunteer" one. Rebuilt the same
     day as its own self-contained page (not a mode inside screen.html) —
     Randy: "i thought each sort of screen was an html page," same as the
     event decks. Reuses event-deck.css for the shared frame/clock/logo
     chrome, own theme in event-brightfutures.css, own rotation logic below
     (unlike the event decks it needs live data and two wall-clock-
     scheduled slides, so it doesn't reuse event-deck.js). -->
</head>
<body>
<div class="frame"></div>
<!-- Randy, 2026-09-25: "Top left could be the logos of PSBP and Bright
     Futures... and some mention that this is the weekly Bright Futures
     volunteer program." The park mark moves up here from the bottom-right
     corner so it isn't on screen twice. -->
<div class="brand">
  <img class="brand-psbp" src="../images/white_PSBP_logo.png" alt="Palma Sola Botanical Park">
  <span class="brand-plate"><img src="../images/logos/bright-futures.png" alt="Florida Bright Futures Scholarship Program"></span>
  <span class="brand-text"><b>Bright Futures</b><span>Weekly volunteer program</span></span>
</div>
<div class="clock" id="clock"></div>
<div class="deck"></div>
<div class="credit-block" id="credit"></div>
<div id="bar"></div>
<script src="../js/photo-credits.js"></script>
<script>
(function(){
  var Q = new URLSearchParams(location.search);
  var SPEED = Math.max(0.1, parseFloat(Q.get('speed')) || 1);
  var SECONDS = (parseFloat(Q.get('seconds')) || 16) / SPEED;
  var deck = document.querySelector('.deck'), bar = document.getElementById('bar');
  var clockEl = document.getElementById('clock');
  function tick(){ var d=new Date(), h=d.getHours(), m=d.getMinutes();
    clockEl.textContent = ((h%12)||12)+':'+(m<10?'0':'')+m+(h<12?' am':' pm'); }
  tick(); setInterval(tick, 15000);

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  /* Ported from screen.html: quick_hits facts carry inline <b> for real
     emphasis (e.g. "causes chlorosis" in a way that matters). esc() was
     turning that into visible literal tags on screen — this whitelists
     b/strong/i/em and strips anything else instead of escaping it all. */
  function rich(s){ return String(s==null?'':s).replace(/<(?!\/?(b|strong|i|em)\b)[^>]*>/gi,''); }
  function grab(url){
    return fetch(url, { cache:'no-store' }).then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; });
  }

  /* ── live iNat pulse — one request, this-week only ────────────────────
     Same polygon rule as walkabout.html: the pin decides, not the iNat
     project's accuracy-circle rule. */
  var PULSE_POLYGON=[
    [-82.661275,27.512191],[-82.658079,27.512198],[-82.658107,27.514825],
    [-82.660644,27.514828],[-82.661133,27.514130],[-82.661132,27.513123]];
  function inPark(o){
    var g=(o.geojson&&o.geojson.coordinates)||(o.location&&o.location.split(',').map(Number).reverse());
    if(!g||g.length<2||!isFinite(g[0])) return false;
    var x=g[0], y=g[1], inside=false;
    for(var i=0,j=PULSE_POLYGON.length-1;i<PULSE_POLYGON.length;j=i++){
      var xi=PULSE_POLYGON[i][0], yi=PULSE_POLYGON[i][1];
      var xj=PULSE_POLYGON[j][0], yj=PULSE_POLYGON[j][1];
      if((yi>y)!==(yj>y) && x<(xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside;
    }
    return inside;
  }
  var PULSE = null;
  /* Randy, 2026-09-25, spotting a stranger's login in the credits:
     "nigrosh60 is not bright futures fyi" / "every photo should be by
     Bright Futures people." This screen is about THIS crew's week, not
     the whole park's — bfSet filters every observation out before any
     count or photo is built from it. */
  /* Randy, 2026-09-25: "'most photographed' needs to be past month. show
     top 5 in succession and who took them." A week was too thin a sample
     — one fetch covers 30 days, "this week"/"today" stats filter that
     same set down client-side rather than firing a second request. */
  function loadPulse(bfSet){
    var d1 = new Date(Date.now() - 30*864e5).toISOString().slice(0,10);
    var weekAgo = new Date(Date.now() - 7*864e5).toISOString().slice(0,10);
    var nelat=Math.max.apply(null,PULSE_POLYGON.map(function(p){return p[1];}));
    var nelng=Math.max.apply(null,PULSE_POLYGON.map(function(p){return p[0];}));
    var swlat=Math.min.apply(null,PULSE_POLYGON.map(function(p){return p[1];}));
    var swlng=Math.min.apply(null,PULSE_POLYGON.map(function(p){return p[0];}));
    /* v2 with an explicit field list, same trick species_manager.py uses:
       ~100 KB a page instead of ~13 MB of full v1 records for 200
       observations. v2 has no verifiable=any — leaving it off returns
       everything, which is what a planted collection needs. Up to three
       pages so a busy month isn't cut off at the 200 most recent. */
    var base = 'https://api.inaturalist.org/v2/observations?nelat='+nelat+'&nelng='+nelng
      + '&swlat='+swlat+'&swlng='+swlng+'&d1='+d1
      + '&order_by=observed_on&order=desc&per_page=200'
      + '&fields=id,observed_on,location,user.login,taxon.id,taxon.name,taxon.preferred_common_name,photos.url,photos.license_code';
    function page(n){ return fetch(base+'&page='+n, { cache:'no-store' }).then(function(r){ return r.ok ? r.json() : null; }); }
    return page(1).then(function(first){
        if(!first) return null;
        var n = Math.min(3, Math.ceil((first.total_results||0)/200)), more = [];
        for(var i=2;i<=n;i++) more.push(page(i));
        return Promise.all(more).then(function(rest){
          var results = first.results || [];
          rest.forEach(function(d){ if(d && d.results) results = results.concat(d.results); });
          return { results: results };
        });
      })
      .then(function(data){
        var monthRows = ((data && data.results) || []).filter(inPark)
          .filter(function(o){ return o.user && bfSet[o.user.login]; });
        var rows = monthRows.filter(function(o){ return o.observed_on >= weekAgo; });
        var today = new Date().toISOString().slice(0,10);
        function uniq(list, key){ var seen={}; list.forEach(function(o){
          var v = key(o); if(v) seen[v]=1; }); return Object.keys(seen).length; }

        /* Per-species tallies — this is the "achievements" data the first
           pass never built. Randy, 2026-09-25: "no achievements. no
           nothing so far." Real numbers weren't enough on their own;
           naming the actual species is what makes it feel alive.
           Sourced from monthRows (not the 7-day `rows`) so there's
           actually enough material for "top 5 in succession". */
        var bySpecies = {};
        monthRows.forEach(function(o){
          var t = o.taxon; if(!t || !t.id) return;
          var key = t.id;
          if(!bySpecies[key]) bySpecies[key] = {
            name: t.preferred_common_name || t.name, count:0, logins:{}, photos:[]
          };
          bySpecies[key].count++;
          if(o.user && o.user.login) bySpecies[key].logins[o.user.login] = 1;
          var photo0 = o.photos && o.photos[0];
          if(photo0 && photo0.url) bySpecies[key].photos.push({
            url: photo0.url.replace(/square\.(jpg|jpeg|png)/i, 'medium.$1'),
            login: (o.user && o.user.login) || '',
            observed_on: o.observed_on || '',
            license: photo0.license_code || ''
          });
        });
        var speciesList = Object.keys(bySpecies).map(function(k){ return bySpecies[k]; })
          .sort(function(a,b){ return b.count - a.count; });

        /* Per-photographer tallies for the monthly slide's side panel:
           who shot the most this month, with their photos. Shown in
           random order, no counts per kid — recognition, not a
           leaderboard. */
        var byLogin = {}, monthPhotos = 0;
        monthRows.forEach(function(o){
          var login = o.user && o.user.login; if(!login) return;
          if(!byLogin[login]) byLogin[login] = { login:login, count:0, photos:[] };
          byLogin[login].count++;
          (o.photos || []).forEach(function(ph){
            monthPhotos++;
            if(ph.url) byLogin[login].photos.push({
              url: ph.url.replace(/square\.(jpg|jpeg|png)/i, 'medium.$1'), license: ph.license_code || '' });
          });
        });
        var topLogins = Object.keys(byLogin).map(function(k){ return byLogin[k]; })
          .filter(function(t){ return t.photos.length >= 2; })
          .sort(function(a,b){ return b.count - a.count; }).slice(0,5)
          .sort(function(){ return Math.random()-0.5; });

        PULSE = {
          monthPhotos: monthPhotos,
          monthObs: monthRows.length,
          monthSpecies: uniq(monthRows, function(o){ return o.taxon && o.taxon.id; }),
          monthObservers: uniq(monthRows, function(o){ return o.user && o.user.login; }),
          topLogins: topLogins,
          todayObs: rows.filter(function(o){ return o.observed_on===today; }).length,
          todaySpecies: uniq(rows.filter(function(o){ return o.observed_on===today; }),
            function(o){ return o.taxon && o.taxon.id; }),
          todayObservers: uniq(rows.filter(function(o){ return o.observed_on===today; }),
            function(o){ return o.user && o.user.login; }),
          speciesList: speciesList
        };
      }).catch(function(){});
  }

  /* ── real Bright Futures photographs ─────────────────────────────────
     photo_credits.json rows whose photographer's note in
     photographer_names.json says "Bright Futures student" — same rule
     screen.html's cohort() uses. Threaded into every slide builder below
     so nearly every slide gets a real full-bleed photo behind it, not
     just the two that used to show pictures. Randy, 2026-09-25, watching
     it run: "how do we make this interesting? no photo?" — correct, the
     old render() never set a background image at all. */
  function bfLogins(names){
    var logins = {};
    for(var login in names){
      var n = (names[login] && names[login].note) || '';
      if(n.toLowerCase().indexOf('bright futures') > -1) logins[login] = 1;
    }
    return logins;
  }
  function crewOf(photos, bfSet){
    return (photos||[]).filter(function(p){ return bfSet[p.photographer] && p.publish_ok; });
  }
  function randomPhoto(mine){
    if(!mine || !mine.length) return null;
    return mine[Math.floor(Math.random()*mine.length)];
  }

  /* Randy, 2026-09-25: "For who shot this slide, definitely minimal
     repeats. Use ANY photo in photo_credits.JSON that is from someone in
     Bright Futures." A shuffle bag over the whole crew set (every
     publishable photo by a Bright Futures login — all ~500, not just
     heroes or this month), remembered in localStorage so the 10-minute
     rebuild and a page reload don't restart the repeats. It only resets
     once every photo has had a turn. Shared by "Who shot this?" and
     "From the crew"; plain background photos still draw at random. */
  var USED_KEY = 'psbp-bf-used';
  function usedSet(){ try{ return JSON.parse(localStorage.getItem(USED_KEY) || '{}'); }catch(e){ return {}; } }
  function freshPhoto(mine){
    if(!mine || !mine.length) return null;
    var used = usedSet();
    var pool = mine.filter(function(p){ return !used[p.photo_id]; });
    if(!pool.length){ used = {}; pool = mine; }
    var p = pool[Math.floor(Math.random()*pool.length)];
    used[p.photo_id] = 1;
    try{ localStorage.setItem(USED_KEY, JSON.stringify(used)); }catch(e){}
    return p;
  }

  /* Randy, 2026-09-25: "there is a standard credit block in html site.
     much better than what youve done." Reusing the real one — same
     function the species pages themselves call — instead of my own
     ad-hoc joined string. See js/photo-credits.js: PSBPPhotos.creditPlate
     emits .credit-plate/.credit-name/.cc-badge markup; event-brightfutures
     .css restyles it for this dark TV theme, MUCH bigger on .credit-name
     specifically — Randy, same thread, on the first pass: "we WANT their
     names big and bold on photos. i literally cannot read it." The
     site's own version is deliberately quiet (a byline under a species
     page's hero); this screen's whole point is the name, so it can't
     copy that sizing, only the structure. */
  function creditText(p){
    if(!p) return '';
    return window.PSBPPhotos.creditPlate({
      by: (p.photographer_name || 'community member').split(' – ')[0],
      date: p.observed_on,
      license: p.license
    });
  }

  /* Randy, 2026-09-25 (morning): "The names of the kids is RIDICULOUSLY
     cartoonishly large. Use the standard caption from the html site, and
     place it bottom left. maybe make it a bit bigger. Remove the name
     from the heart of the slides... Use the caption to answer the
     question." So: no slide puts a name in its headline any more; every
     photo slide runs the same creditPlate caption, and "Who shot this?"
     just delays it to the halfway point (see creditDelay in render()). */

  /* A real fact, not just a name — Randy: "too boring without good info."
     Same quick_hits array the species pages themselves use, keyed by the
     photo's own psbp_id. */
  function hitFor(hits, psbpId){
    var list = hits && hits[psbpId];
    if(!list || !list.length) return '';
    return list[Math.floor(Math.random()*list.length)];
  }

  /* ── slide builders ──────────────────────────────────────────────────── */
  /* Randy, 2026-09-25: "Instead of 'The Bright Futures Crew' and then
     weekly stats, let's do 'Here's how many iNat pics we've taken this
     month:' show good monthly stats. Then on the right give some sense
     that it is a lot, fade in a slide deck of some of the top students
     (maybe the top 5 that month) with small grids." The right-hand panel
     fades through the month's busiest photographers, four of their own
     photos each; the bottom-left caption names each one as it lands (no
     names in the panel itself, no rank numbers, random order). */
  function slideMonth(names){
    if(!PULSE || !PULSE.monthObs) return null;
    var roll = PULSE.topLogins.map(function(t){
      var pics = t.photos.slice(0,4).map(function(p){ return '<img alt="" src="'+p.url+'">'; }).join('');
      return { html: '<div class="roll-grid">'+pics+'</div>',
               credit: window.PSBPPhotos.creditPlate({ by: nameFor(names, t.login), license: t.photos[0].license }) };
    });
    return { id:'month', seconds: SECONDS*(1.2 + 0.45*roll.length), roll: roll, html:
        '<div class="copy"><div class="label">This month</div>'
      + '<h2>Here’s how many iNat pics we’ve taken this month:</h2>'
      + '<div class="stat-row">'
      +   countHtml(PULSE.monthPhotos, 'photos') + countHtml(PULSE.monthObs, 'observations')
      +   countHtml(PULSE.monthSpecies, 'species') + countHtml(PULSE.monthObservers, 'photographers')
      + '</div></div>'
      + (roll.length ? '<div class="roll"><div class="roll-hint">A few of this month’s photographers</div><div class="roll-stage"></div></div>' : '') };
  }

  /* A real achievement, not just a count — Randy: "no achievements. no
     nothing." Names the actual top species. Randy, seeing this render as a
     bare name list: "this slide is begging for the pics to be cycled
     through with credits for each. show all 5 in succession" — so this
     builds a `frames` array (one per actual observation photo) instead of
     a static slide; render() below knows how to step through frames on
     its own timer while the slide stays up. */
  function nameFor(names, login){
    var n = names[login];
    return ((n && (n.credit_as || n.display_name)) || login).split(' – ')[0];
  }
  function slideMostPhotographed(names){
    if(!PULSE || !PULSE.speciesList || !PULSE.speciesList.length) return null;
    var top = PULSE.speciesList[0];
    if(top.count < 2 || !top.photos || top.photos.length < 2) return null;
    var frames = top.photos.slice(0,5).map(function(p){
      return { bg: p.url, credit: window.PSBPPhotos.creditPlate({
        by: nameFor(names, p.login), date: p.observed_on, license: p.license
      }) };
    });
    /* Randy: "fast is good" — 0.75x instead of 1.3x per photo, a quick
       flip through the top 5 rather than a slow dwell on each. */
    return { id:'mostphoto', seconds: SECONDS*0.75*frames.length, frames: frames, html:
        '<div class="copy"><div class="label">Most photographed this month</div>'
      + '<h2>'+esc(top.name)+'</h2>'
      + '<div class="stat-row">'+countHtml(top.count, 'observations')+'</div>'
      + '</div>' };
  }

  /* Concrete species names, not an abstract number — makes "63 species"
     feel real instead of just a stat. */
  function slideSpeciesSeen(mine){
    if(!PULSE || !PULSE.speciesList || PULSE.speciesList.length < 3) return null;
    /* Trimmed from 8 to 6 — a reviewer's note, 2026-09-25: past a
       certain count this reads as a word cloud, not a list. */
    var names = PULSE.speciesList.slice(0,6).map(function(s){ return s.name; }).filter(Boolean);
    if(names.length < 3) return null;
    var p = randomPhoto(mine);
    return { id:'speciesseen', seconds: SECONDS*1.4, bg: p && p.photo_url, credit: p && creditText(p), html:
        '<div class="copy"><div class="label">Seen this month</div>'
      + '<h2>'+esc(names.join(' · '))+'</h2></div>' };
  }

  function slideTasks(tasksData, mine){
    if(!tasksData || !tasksData.tasks || !tasksData.tasks.length) return null;
    var rows = tasksData.tasks.map(function(t){
      return '<div class="task"><span class="team">'+esc(t.team||'')+'</span>'
           + '<span class="job">'+esc(t.job||'')+'</span></div>';
    }).join('');
    var p = randomPhoto(mine);
    return { id:'tasks', seconds: SECONDS*1.3, bg: p && p.photo_url, credit: p && creditText(p), html:
        '<div class="copy"><div class="label">Today at the park</div>'
      + '<h2>'+esc(tasksData.note || 'Wednesday jobs')+'</h2>'
      + '<div class="task-list">'+rows+'</div></div>' };
  }

  /* Reviewer's note, 2026-09-25: "a very lightweight 'Can you beat this?'
     slide... only if the numbers are framed as a group challenge, not
     individual ranking. That gives the screen some game energy without
     turning volunteering into competition." Whole crew vs. a number, no
     names attached. */
  function slideChallenge(mine){
    if(!PULSE || PULSE.todaySpecies < 3) return null;
    var target = PULSE.todaySpecies + 2;
    var p = randomPhoto(mine);
    return { id:'challenge', seconds: SECONDS*1.3, bg: p && p.photo_url, credit: p && creditText(p), html:
        '<div class="copy"><div class="label">Can we beat this?</div>'
      + '<div class="stat-row">'+countHtml(PULSE.todaySpecies, 'species today')+'</div>'
      + '<div class="body">Can the crew hit <b>'+target+'</b> before cleanup?</div></div>' };
  }

  function slideEvents(events, mine){
    var big = (events||[]).filter(function(e){ return e.category === 'Community'; });
    if(!big.length) return null;
    var rows = big.slice(0,4).map(function(e){
      var when = e.date ? new Date(e.date+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
      return '<div class="task"><span class="team">'+esc(when)+'</span>'
           + '<span class="job">'+esc(e.title||'')+'</span></div>';
    }).join('');
    var p = randomPhoto(mine);
    return { id:'events', seconds: SECONDS*1.4, bg: p && p.photo_url, credit: p && creditText(p), html:
        '<div class="copy"><div class="label">Coming up</div>'
      + '<div class="task-list">'+rows+'</div>'
      + '<div class="body">Need hours? Events pay out a bunch at once. Ask Randy.</div></div>' };
  }

  /* The scattered "match-game" crew slide lived here until 2026-09-25.
     Randy: "The total page of 'The Bright Futures Crew' and all the
     numbers and the most boring list to the right ever has to be changed
     or tossed." Tossed; slideMonth() above is its replacement. */

  /* One real photo, full-bleed, minimal text — the "photo of the moment"
     beat. Rotates through the actual crew archive, not a fixed pair. */
  /* Randy, 2026-09-25: "you are highlighting species way more. no!!!!!
     they are first. always... we are all about big credits." The
     photographer's name leads as the slide's own headline now, not just
     the corner credit block — species drops to a smaller subtitle line.
     Same rule everywhere a specific photographer's photo is the point. */
  function slidePhotoSpotlight(mine, hits){
    var p = freshPhoto(mine);
    if(!p) return null;
    var fact = hitFor(hits, p.psbp_id);
    return { id:'spotlight-'+p.photo_id, seconds: SECONDS*1.5, bg: p.photo_url, credit: creditText(p), html:
        '<div class="copy"><div class="label">From the crew</div>'
      + '<h2>'+esc(p.common_name || '')+'</h2>'
      + (fact ? '<div class="body">'+rich(fact)+'</div>' : '') + '</div>' };
  }

  /* Randy, 2026-09-25, on the old two-photo version: "oddly composed...
     hideously boring." / "use screen on right side with irregular size
     blocks and show more than 2." Four real photos in a mosaic (one big,
     three smaller — see .mosaic), each from a DIFFERENT student so it
     reads as "the crew," not one kid's highlight reel. */
  function diversePhotos(pool, n){
    var byPhotog = {};
    pool.forEach(function(p){ (byPhotog[p.photographer] = byPhotog[p.photographer] || []).push(p); });
    var keys = Object.keys(byPhotog).sort(function(){ return Math.random()-0.5; });
    var out = [];
    for(var i=0; i<keys.length && out.length<n; i++){
      var mine2 = byPhotog[keys[i]];
      out.push(mine2[Math.floor(Math.random()*mine2.length)]);
    }
    return out;
  }
  function slideHero(mine){
    var pool = mine.filter(function(p){ return p.hero; });
    var pics = diversePhotos(pool.length >= 4 ? pool : mine, 4);
    if(pics.length < 3) return null;
    var tiles = pics.map(function(p,i){
      return '<figure class="m'+i+'"><img src="'+p.photo_url+'" alt="">'
        + '<figcaption>'+esc((p.photographer_name||'').split(' ')[0]||'')+'</figcaption></figure>';
    }).join('');
    return { id:'hero', seconds: SECONDS*2, html:
        '<div class="copy"><div class="label">What a hero photo is</div>'
      + '<div class="body">One thing in the frame. Nothing in the way. Get close so it fills the shot, or step back so you get the whole shape. Both work.</div></div>'
      + '<div class="mosaic">'+tiles+'</div>' };
  }

  /* Randy, 2026-09-25: "use some of this" — the September photo-awards
     deck on his Desktop. Its five judging questions, in his own words,
     replace my aphorisms as the coaching content. No point values on
     screen: "don't need to make it about winning." */
  var RUBRIC = [
    ['Unmistakably this species', 'Can you tell what it is from the frame? A great photo of Generic Green Shrub scores zero.'],
    ['Survives the crop', 'Heroes get cut to a wide band and shrunk to a thumbnail. Distant or cluttered subjects die.'],
    ['In the park', 'Show the path, the pond, the fence. This plant, not a book photo.'],
    ['Light and moment', 'Is it good to look at.'],
    ['Teaches something', 'A fruit, a behavior, a clue to scale. The photo has a fact in it.']
  ];
  function slideRubric(){
    var rows = RUBRIC.map(function(r, i){
      return '<div class="rub"><b>'+(i+1)+'</b><div><strong>'+esc(r[0])+'</strong>'+esc(r[1])+'</div></div>';
    }).join('');
    return { id:'rubric', seconds: SECONDS*2, html:
        '<div class="copy"><div class="label">What a hero photo is</div>'
      + '<h2>Recognition first. Pretty second.</h2>'
      + '<div class="rubric">'+rows+'</div></div>' };
  }

  /* Real crew photos with Randy's own notes from that deck, lightly
     trimmed for a TV. "Almost" ones are framed as half a step, not a
     miss — "pick different kids to represent various images." */
  var EXAMPLES = [
    { id:'731638176', label:'Why this one works',
      note:'Look at the depth. One bract front and center, the whole bed behind it, then the pond and the far shore. Most people shoot the flower and forget the place. Alaina shot both.' },
    { id:'731644653', label:'Why this one works',
      note:'The swollen trunk is the species. Nothing else in the park looks like that. And Kevin kept the path and the plant label in the frame.' },
    { id:'735608579', label:'Why this one works',
      note:'That heavy green fruit couldn’t belong to any other plant here. The prop roots back it up, and the deck railing says this is here. Most visitors have no idea a Screw Pine fruits like that.' },
    { id:'731645331', label:'Why this one works',
      note:'You can count the five points on every flower. That’s exactly what the Pentas page is about.' },
    { id:'735615080', label:'Almost',
      note:'Perfect light, perfectly sharp, dead center. One thing missing: a flower against a green blur could be anywhere on earth. Step back half a pace and it’s a hero.' },
    { id:'723780282', label:'Almost',
      note:'That purple is unbeatable and the berries fill the frame. No path, no sky, no ground. Nothing that says Palma Sola. Half a step back.' }
  ];
  function slideExample(mine, ex){
    var p = null;
    for(var i=0;i<mine.length;i++) if(mine[i].photo_id === ex.id){ p = mine[i]; break; }
    if(!p) return null;
    return { id:'ex-'+ex.id, seconds: SECONDS*1.7, credit: creditText(p), html:
        '<div class="card-photo"><img alt="" src="'+p.photo_url+'"></div>'
      + '<div class="copy"><div class="label">'+esc(ex.label)+'</div>'
      + '<h2>'+esc(p.common_name||'')+'</h2>'
      + '<div class="body">'+esc(ex.note)+'</div></div>' };
  }

  /* From the same deck's last slide — the real ask. */
  function slideNeedsPhoto(mine){
    var p = randomPhoto(mine);
    return { id:'needsphoto', seconds: SECONDS*1.5, bg: p && p.photo_url, credit: p && creditText(p), html:
        '<div class="copy"><div class="label">Pages that need a better photo</div>'
      + '<h2>Yours goes live with your name under it.</h2>'
      + '<div class="body">Nine species pages are led by a photo where you can’t tell what the plant is. Sweet Viburnum is mostly a deck. Amazon Lily has no flower in it. Mottled Spurge is a gray wall. Take a better one.</div></div>' };
  }

  function slideWhyMultiple(mine){
    var p = randomPhoto(mine);
    return { id:'multiple', seconds: SECONDS*1.1, bg: p && p.photo_url, credit: p && creditText(p), html:
        '<div class="copy"><div class="label">Take more than one</div><h2>Take three.</h2>'
    + '<div class="body">Wide. Closer. Closer again. Toss two later if you want. You can’t go back for the one you skipped.</div></div>' };
  }

  function slideWhyAllYear(mine){
    var p = randomPhoto(mine);
    return { id:'allyear', seconds: SECONDS*1.2, bg: p && p.photo_url, credit: p && creditText(p), html:
        '<div class="copy"><div class="label">Why we keep going</div><h2>Same plant, three different plants.</h2>'
    + '<div class="body">Bare in winter. Flowers in spring. Fruit in fall. So no, we don’t already have that one.</div></div>' };
  }

  /* WHO SHOT THIS? — Randy, 2026-09-25: "yes ask who a lot. very good."
     The photo alone for a beat, then the name slams in. Attribution as
     the payoff of the slide, not a caption under it. Species after. */
  function slideWhoShot(mine){
    var p = freshPhoto(mine);
    if(!p || !p.photographer_name) return null;
    var dur = SECONDS*1.3;
    /* question + species for the first half; the caption answers it at
       the halfway mark — Randy: "I think a good delay would help" */
    return { id:'who-'+p.photo_id, seconds: dur, bg: p.photo_url, credit: creditText(p), creditDelay: dur/2, html:
        '<div class="copy"><div class="reveal-q">Who shot this?</div>'
      + '<h2>'+esc(p.common_name||'')+'</h2></div>' };
  }

  /* THIS LIVES HERE. — the loud one. A crew wildlife photo, block caps,
     short dwell. Kept rare in buildSlides: "no overdo of course." */
  function slideLivesHere(mine){
    var wild = mine.filter(function(p){ return p.type === 'Wildlife'; });
    var p = randomPhoto(wild);
    if(!p) return null;
    return { id:'lives-'+p.photo_id, seconds: SECONDS*0.8, shout:true, bg: p.photo_url, credit: creditText(p), html:
        '<div class="copy"><div class="shout-line">This <em>lives</em> here.</div>'
      + '<div class="shout-sub"><b>'+esc(p.common_name||'')+'</b></div></div>' };
  }

  /* FIRST ONE THIS MONTH — a species only one crew member has logged in
     the last 30 days. Real, personal, changes every week. */
  function slideFirstFind(names){
    if(!PULSE || !PULSE.speciesList) return null;
    var firsts = PULSE.speciesList.filter(function(s){ return s.count === 1 && s.photos.length && s.name; });
    if(!firsts.length) return null;
    var s = firsts[Math.floor(Math.random()*firsts.length)], ph = s.photos[0];
    var credit = window.PSBPPhotos.creditPlate({ by: nameFor(names, ph.login), date: ph.observed_on, license: ph.license });
    return { id:'first-'+s.name, seconds: SECONDS*0.9, shout:true, bg: ph.url, credit: credit, html:
        '<div class="copy"><div class="shout-line">First one <em>this month.</em></div>'
      + '<div class="shout-sub"><b>'+esc(s.name)+'</b></div></div>' };
  }

  /* Randy, 2026-09-25, on the emoji chain that used to be here: "just
     horrible. the graphics must go. I suggested an idea but it was very
     very poorly done. Rethink total on that." Rethought around the park's
     own artifacts instead of icons: one of the crew's photos that
     actually became a species page's hero, and then the real page itself
     — live from this same repo, scaled down — fading in beside it with
     their credit line sitting at the top of it. Nothing drawn, nothing
     pretend. (No printable sign pages exist in the repo, so the sign is
     a plain sentence, not a graphic.) */
  /* Randy, 2026-09-25: "Maybe instead of saying 'Why this matters' we
     just have a sign: The park will update signage constantly to refresh
     photos, and improve what is written on them, as well as replace
     damaged and worn. We NEED THEM to get us good photos for those
     signs!!!!! They will be credited. Bonus if we can fit it on there
     that in a month, we will do a large batch of signs so get those pics
     now." The ask, plainly, over one of their own photos. The dated
     "big batch" line lives in brightfutures_today.json (signs_push) so it
     can be changed or dropped without touching code. */
  function slideSigns(mine, tasksData){
    var p = randomPhoto(mine.filter(function(x){ return x.hero; })) || randomPhoto(mine);
    var push = tasksData && tasksData.signs_push;
    return { id:'signs', seconds: SECONDS*1.9, shout:true, bg: p && p.photo_url, credit: p && creditText(p), html:
        '<div class="copy"><div class="label">The signs</div>'
      + '<div class="shout-line">We need your <em>photos.</em></div>'
      + '<div class="body">The park redoes signs all the time: fresher photos, better words, worn ones swapped out.</div>'
      + '<div class="body">The photo on a sign comes from one of you. Your name goes on it.</div>'
      + (push ? '<div class="body"><b>'+esc(push)+'</b></div>' : '') + '</div>' };
  }

  /* Photos OF the crew, not photos they took — images/brightfutures-
     local/photos.json. That whole folder is gitignored on purpose: these
     are photos of minors, and this repo is public. Randy, 2026-09-25:
     "ill keep on office computer" — so this only ever renders on a
     machine that actually has the local folder populated; every other
     machine (and GitHub Pages) just sees the empty-state teaser below,
     which is the correct, safe default rather than a broken image. */
  function slideCrewMontage(crewPhotos){
    var rows = (crewPhotos && crewPhotos.photos) || [];
    /* Out of rotation while empty — a "coming soon" slide is dead air to
       a kid. The slot lights up the moment photos.json has rows. */
    if(!rows.length) return null;
    var pics = rows.slice(0,8).map(function(r){ return '<img alt="" src="'+BASE+'images/brightfutures-local/'+r.file+'">'; }).join('');
    return { id:'montage', seconds: SECONDS*1.5, html:
        '<div class="copy"><div class="label">The crew</div>'
      + '<h2>Wednesdays at the park.</h2></div>'
      + '<div class="photo-grid">'+pics+'</div>' };
  }

  function slideCleanup(){
    return { id:'cleanup', seconds: SECONDS*1.1, warn:true, html:
        '<div class="copy"><div class="label">5:30</div><h2>WARNING — time to stop what you’re doing.</h2>'
      + '<div class="body"><b>Carts</b> put away and washed down. <b>Tools</b> put away. Wrap up what you’re holding.</div></div>' };
  }
  function slideSummary(){
    var stats = (PULSE && PULSE.todayObs)
      ? '<div class="stat-row">'
        + countHtml(PULSE.todayObs, 'observations')
        + countHtml(PULSE.todaySpecies, 'species')
        + countHtml(PULSE.todayObservers, 'observers') + '</div>'
      : '<div class="body">Today’s iNat numbers are still coming in — check the app.</div>';
    return { id:'summary', seconds: SECONDS*1.6, html:
        '<div class="copy"><div class="label">5:45 · Look what happened today</div>'
      + stats + '<div class="body">Nice work. See you next Wednesday.</div></div>' };
  }

  /* ── data load + rotation ───────────────────────────────────────────── */
  var BASE = '../';
  var slides = [];
  var lastForced = { cleanup:0, summary:0 };

  function forcedSlide(){
    var d=new Date(), mins=d.getHours()*60+d.getMinutes(), now=Date.now();
    if(mins>=17*60+30 && mins<17*60+45){
      if(now - lastForced.cleanup > 90000){ lastForced.cleanup=now; return slideCleanup(); }
    } else if(mins>=17*60+45 && mins<18*60+15){
      if(now - lastForced.summary > 150000){ lastForced.summary=now; return slideSummary(); }
    }
    return null;
  }

  var cur = null, last = null;
  var creditEl = document.getElementById('credit');
  function setCredit(html){
    if(!html){ creditEl.classList.remove('on'); return; }
    creditEl.innerHTML = html;
    creditEl.classList.add('on');
  }

  /* Numbers count up from 0 instead of just sitting there — a stat card
     is a dashboard; a number climbing is something you watch. Any
     .count[data-n] (see countHtml) gets it. Under reduced motion it just
     lands on the final number. */
  var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
  function countHtml(n, label){
    return '<div class="count" data-n="'+n+'">'+(REDUCED ? n : 0)+'<small>'+label+'</small></div>';
  }
  function countUp(el){
    if(REDUCED) return;
    var nodes = el.querySelectorAll('.count[data-n]');
    for(var i=0;i<nodes.length;i++)(function(node){
      var target = parseInt(node.getAttribute('data-n'),10) || 0;
      var small = node.querySelector('small'), label = small ? small.outerHTML : '';
      /* same rAF caveat as the fade-in: a hidden tab would leave it at 0 */
      if(document.hidden){ node.innerHTML = target + label; return; }
      var t0 = null, ms = 1100/SPEED;
      function step(ts){
        if(!t0) t0 = ts;
        var k = Math.min(1, (ts - t0)/ms); k = 1 - Math.pow(1-k, 3);
        node.innerHTML = Math.round(target*k) + label;
        if(k < 1) requestAnimationFrame(step);
      }
      setTimeout(function(){ requestAnimationFrame(step); }, 1200/SPEED);   /* after the stat row has faded in */
    })(nodes[i]);
  }

  /* `s.frames` — a slide that steps through several real photos (with a
     credit each) while it stays on screen, instead of one static image.
     Randy, 2026-09-25: "this slide is begging for the pics to be cycled
     through with credits for each. show all 5 in succession." Every
     photo, framed or not, drives the one standardized credit block
     (bottom-left, see .credit-block) rather than its own one-off caption. */
  function render(s){
    var el = document.createElement('div');
    el.className = 'slide' + (s.warn ? ' warn' : '') + (s.shout ? ' shout' : '');
    var frames = s.frames;
    var firstBg = frames ? frames[0].bg : s.bg;
    /* one of three slow camera moves, at random — see .kb1/.kb2/.kb3 */
    var kb = firstBg ? ' kb' + (1 + Math.floor(Math.random()*3)) : '';
    var bg = '<div class="bg'+(firstBg?' photo'+kb:'')+'"'+(firstBg?' style="background-image:url('+firstBg+')"':'')+'></div>';
    var scrim = firstBg ? '<div class="scrim"></div>' : '';
    el.innerHTML = bg + scrim + s.html;
    deck.appendChild(el);
    /* A timer, not requestAnimationFrame: rAF never fires in a hidden or
       throttled tab, which left slides built but stuck at opacity 0
       during proofing. 40 ms is enough for the browser to paint the
       opacity-0 state first so the fade actually runs. */
    setTimeout(function(){ el.classList.add('on'); }, 40);
    if(cur){
      if(cur._frameTimer) clearInterval(cur._frameTimer);
      if(cur._rollTimer) clearInterval(cur._rollTimer);
      if(cur._creditTimer) clearTimeout(cur._creditTimer);
      var old=cur; old.classList.remove('on'); setTimeout(function(){ old.remove(); }, 1300/SPEED);
    }
    cur = el;
    var dur = s.seconds || SECONDS;
    countUp(el);

    if(frames && frames.length > 1){
      var bgEl = el.querySelector('.bg');
      setCredit(frames[0].credit || '');
      var fi = 0, frameMs = (dur*1000/frames.length);
      el._frameTimer = setInterval(function(){
        fi = (fi+1) % frames.length;
        bgEl.style.opacity = 0;
        setTimeout(function(){
          bgEl.classList.add('photo');
          bgEl.style.backgroundImage = 'url('+frames[fi].bg+')';
          setCredit(frames[fi].credit || '');
          bgEl.style.opacity = 1;
        }, 260/SPEED);
      }, frameMs);
    } else if(s.creditDelay){
      /* "Who shot this?" — hold the caption back until the halfway mark */
      setCredit('');
      el._creditTimer = setTimeout(function(){ setCredit(s.credit || ''); }, s.creditDelay*1000);
    } else {
      setCredit(s.credit || '');
    }

    /* `s.roll` — the monthly slide's right-hand panel: fades through one
       photographer's small grid after another while the numbers stay put,
       and the bottom-left caption names whoever is up. */
    if(s.roll && s.roll.length){
      var stage = el.querySelector('.roll-stage'), ri = 0;
      function showRoll(i){
        var f = document.createElement('div'); f.className = 'roll-frame'; f.innerHTML = s.roll[i].html;
        stage.innerHTML = ''; stage.appendChild(f);
        setTimeout(function(){ f.classList.add('in'); }, 40);
        setCredit(s.roll[i].credit || '');
      }
      setTimeout(function(){ showRoll(0); }, 1500/SPEED);   /* after the numbers have landed */
      var rollMs = Math.max(3000/SPEED, (dur*1000 - 2000/SPEED) / s.roll.length);
      el._rollTimer = setInterval(function(){ ri = (ri+1) % s.roll.length; showRoll(ri); }, rollMs);
    }

    bar.style.transition='none'; bar.style.width='0';
    requestAnimationFrame(function(){ bar.style.transition='width '+dur+'s linear'; bar.style.width='100%'; });
    return dur;
  }

  /* Randy, 2026-09-25: "too many screens repeat with only one other screen
     between them." Only excluding the ONE previous slide let a 10-13-item
     pool repeat itself constantly (A, B, A, C, A…). A shuffle bag — every
     slide shown once before ANY repeats — fixes that properly, same
     device screen.html's own slideSpotlight() uses for the same reason. */
  /* Randy, 2026-09-25 (again): "slides repeat too frequently." The reset
     above had a seam — the instant `seen` emptied, the pool was every
     slide again, INCLUDING the one that had just played, so a reset could
     repeat the last slide back-to-back. `lastId` is tracked outside
     `seen` and excluded no matter what state the bag is in. */
  /* ?only=who  (or rubric, ex-, lives-, first-, crew, pulse…) restricts
     the rotation to slides whose id starts with that — for proofing one
     format without waiting on the shuffle. */
  var ONLY = (Q.get('only') || '').trim();
  var seen = [], lastId = null;
  function pick(){
    var forced = forcedSlide();
    if(forced) return forced;
    var all = ONLY ? slides.filter(function(s){ return s.id.indexOf(ONLY) === 0; }) : slides;
    if(!all.length) all = slides;
    if(!all.length) return { id:'empty', seconds:SECONDS, html:'<div class="copy"><h2>Loading…</h2></div>' };
    if(seen.length >= all.length - 1) seen = [];
    var pool = all.filter(function(s){ return seen.indexOf(s.id) < 0 && s.id !== lastId; });
    if(!pool.length) pool = all.filter(function(s){ return s.id !== lastId; });
    var s = pool.length ? pool[Math.floor(Math.random()*pool.length)] : all[0];
    seen.push(s.id);
    lastId = s.id;
    return s;
  }

  function next(){
    var dur = render(pick());
    setTimeout(next, dur*1000);
  }

  /* quick_hits — the same fun-fact array the public species pages use,
     keyed by id (== photo_credits.json's psbp_id). Randy: "too boring
     without good info." */
  function indexHits(blob){
    var hits = {}, rows = (blob && blob.species) || blob || [];
    rows.forEach(function(r){ if(r && r.id && r.quick_hits && r.quick_hits.length) hits[r.id] = r.quick_hits; });
    return hits;
  }

  /* Randy, 2026-09-25: "slides repeat too frequently." More
     slidePhotoSpotlight() draws (each pulls a real, different photo — a
     bigger pool means the shuffle bag takes longer to cycle back to
     anything). De-duped by photo id below in case two draws collide. */
  /* Reviewer's note, 2026-09-25: weight the rotation — "three content
     types: live crew status, recognition, coaching... roughly half the
     screen time live/recognition, a quarter to a third coaching." The
     shuffle bag in pick() guarantees every slide shown once before ANY
     repeats, so weight means duplicate pool slots (distinct ids, same
     content) rather than a probability — a slide with 3 slots shows 3x
     per full pass through the bag, still with the bag's no-immediate-
     repeat guarantee. */
  function weighted(slideObj, n){
    if(!slideObj) return [];
    var out = [];
    for(var i=0; i<n; i++){
      var copy = {}; for(var k in slideObj) copy[k] = slideObj[k];
      copy.id = slideObj.id + '-w' + i;
      out.push(copy);
    }
    return out;
  }
  function pickN(list, n){
    return list.slice().sort(function(){ return Math.random()-0.5; }).slice(0,n);
  }
  function buildSlides(tasksData, events, photos, names, mine, hits, crewPhotos){
    var spotlights = [], seenIds = {};
    for(var i=0; i<5; i++){
      var sp = slidePhotoSpotlight(mine, hits);
      if(sp && !seenIds[sp.id]){ seenIds[sp.id] = 1; spotlights.push(sp); }
    }

    /* Reviewer: "Today at the park should probably be very prominent from
       3:00-4:00... then reduce it later." */
    var mins = new Date().getHours()*60 + new Date().getMinutes();
    var duringTaskWindow = mins >= 15*60 && mins < 16*60;
    var tasksSlide = slideTasks(tasksData, mine);

    /* Reviewer: "four photography-instruction slides is a lot. I'd
       rotate only one or two of those in any given session." Two of the
       general ones, plus one or two of Randy's example cards. */
    var coachingAll = [slideRubric(), slideHero(mine), slideNeedsPhoto(mine),
      slideWhyMultiple(mine), slideWhyAllYear(mine)].filter(Boolean);
    var examplesAll = EXAMPLES.map(function(ex){ return slideExample(mine, ex); }).filter(Boolean);
    /* ?only= proofing wants every format reachable, so skip the sampling then */
    var coaching = ONLY ? coachingAll : pickN(coachingAll, 2);
    var examples = ONLY ? examplesAll : pickN(examplesAll, 2);

    /* "ask who a lot" — four different photos per cycle. Shout slides
       stay rare: "no overdo of course." */
    var whos = [], seenW = {};
    for(var w=0; w<4; w++){ var q = slideWhoShot(mine); if(q && !seenW[q.id]){ seenW[q.id]=1; whos.push(q); } }

    var built = []
      .concat(weighted(slideMonth(names), 3))
      .concat(weighted(slideMostPhotographed(names), 3))
      .concat(weighted(slideSigns(mine, tasksData), 2))
      .concat(weighted(slideChallenge(mine), 2))
      .concat(weighted(tasksSlide, duringTaskWindow ? 4 : 2))
      .concat(spotlights)
      .concat(whos)
      .concat([slideLivesHere(mine), slideFirstFind(names)])
      .concat([slideSpeciesSeen(mine), slideEvents(events, mine), slideCrewMontage(crewPhotos)])
      .concat(coaching)
      .concat(examples);
    slides = built.filter(Boolean);
  }

  /* names has to load BEFORE loadPulse — the pulse filters every
     observation to Bright Futures logins as it fetches, it can't be
     filtered after the fact. brightfutures-local/photos.json 404s on
     every machine that doesn't have it (GitHub Pages, any clone without
     the local folder) — that's fine, grab() already resolves those to
     null and slideCrewMontage() shows the teaser instead. */
  function loadEverything(){
    return grab(BASE+'data/sources/photographer_names.json').then(function(names){
      names = names || {};
      var bfSet = bfLogins(names);
      /* iNat is the slow one — a few seconds, sometimes more. Don't hold
         the first slide for it: build the deck from the local JSON the
         moment it lands, then rebuild once the pulse arrives so the live
         slides join the rotation. Startup was a ~6 s blank screen. */
      var pulse = loadPulse(bfSet);
      return Promise.all([
        grab(BASE+'data/published/brightfutures_today.json'),
        grab(BASE+'data/published/events.json'),
        grab(BASE+'data/sources/photo_credits.json'),
        grab(BASE+'data/sources/plant_signage.json'),
        grab(BASE+'data/sources/wildlife_signage.json'),
        grab(BASE+'images/brightfutures-local/photos.json')
      ]).then(function(r){
        var photos = (r[2] && r[2].photos) || r[2] || [];
        var mine = crewOf(photos, bfSet);
        var hits = indexHits(r[3]); Object.assign(hits, indexHits(r[4]));
        function build(){ buildSlides(r[0], r[1], photos, names, mine, hits, r[5]); }
        build();
        pulse.then(build);
      });
    });
  }

  loadEverything().then(next).catch(function(){ slides = [slideRubric(), slideWhyMultiple([])]; next(); });

  /* Refresh data + iNat pulse every 10 minutes, same cadence as the rest
     of the kiosk fleet. */
  setInterval(function(){ loadEverything().catch(function(){}); }, (10*60*1000) / SPEED);
})();
</script>
</body>
</html>
