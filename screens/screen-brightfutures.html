<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bright Futures — Palma Sola Botanical Park</title>
<link rel="icon" type="image/png" href="../images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="events/event-deck.css">
<link rel="stylesheet" href="events/event-brightfutures.css">
<!-- Standalone deck for the Wednesday Bright Futures high-school session.
     Randy, 2026-09-25: "volunteers would refer to adults so the name of
     this html is wrong imo. We call this crew Bright Futures" — this is
     their crew's screen, not a generic "volunteer" one. Rebuilt the same
     day as its own self-contained page (not a mode inside screen.html) —
     Randy: "i thought each sort of screen was an html page," same as the
     event decks. Reuses event-deck.css for the shared frame/clock/logo
     chrome, own theme in event-brightfutures.css, own rotation logic below
     (unlike the event decks it needs live data and two wall-clock-
     scheduled slides, so it doesn't reuse event-deck.js). -->
</head>
<body>
<div class="frame"></div>
<div class="eyebrow-fixed">Palma Sola Botanical Park</div>
<div class="clock" id="clock"></div>
<img class="logo-mark" src="../images/white_PSBP_logo.png" alt="Palma Sola Botanical Park">
<div class="deck"></div>
<div id="bar"></div>
<script>
(function(){
  var Q = new URLSearchParams(location.search);
  var SPEED = Math.max(0.1, parseFloat(Q.get('speed')) || 1);
  var SECONDS = (parseFloat(Q.get('seconds')) || 16) / SPEED;
  var deck = document.querySelector('.deck'), bar = document.getElementById('bar');
  var clockEl = document.getElementById('clock');
  function tick(){ var d=new Date(), h=d.getHours(), m=d.getMinutes();
    clockEl.textContent = ((h%12)||12)+':'+(m<10?'0':'')+m+(h<12?' am':' pm'); }
  tick(); setInterval(tick, 15000);

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function grab(url){
    return fetch(url, { cache:'no-store' }).then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; });
  }

  /* ── live iNat pulse — one request, this-week only ────────────────────
     Same polygon rule as walkabout.html: the pin decides, not the iNat
     project's accuracy-circle rule. */
  var PULSE_POLYGON=[
    [-82.661275,27.512191],[-82.658079,27.512198],[-82.658107,27.514825],
    [-82.660644,27.514828],[-82.661133,27.514130],[-82.661132,27.513123]];
  function inPark(o){
    var g=(o.geojson&&o.geojson.coordinates)||(o.location&&o.location.split(',').map(Number).reverse());
    if(!g||g.length<2||!isFinite(g[0])) return false;
    var x=g[0], y=g[1], inside=false;
    for(var i=0,j=PULSE_POLYGON.length-1;i<PULSE_POLYGON.length;j=i++){
      var xi=PULSE_POLYGON[i][0], yi=PULSE_POLYGON[i][1];
      var xj=PULSE_POLYGON[j][0], yj=PULSE_POLYGON[j][1];
      if((yi>y)!==(yj>y) && x<(xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside;
    }
    return inside;
  }
  var PULSE = null;
  function loadPulse(){
    var d1 = new Date(Date.now() - 7*864e5).toISOString().slice(0,10);
    var nelat=Math.max.apply(null,PULSE_POLYGON.map(function(p){return p[1];}));
    var nelng=Math.max.apply(null,PULSE_POLYGON.map(function(p){return p[0];}));
    var swlat=Math.min.apply(null,PULSE_POLYGON.map(function(p){return p[1];}));
    var swlng=Math.min.apply(null,PULSE_POLYGON.map(function(p){return p[0];}));
    var url = 'https://api.inaturalist.org/v1/observations?nelat='+nelat+'&nelng='+nelng
      + '&swlat='+swlat+'&swlng='+swlng+'&verifiable=any&d1='+d1
      + '&order_by=observed_on&order=desc&per_page=200';
    return fetch(url, { cache:'no-store' }).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(data){
        var rows = ((data && data.results) || []).filter(inPark);
        var today = new Date().toISOString().slice(0,10);
        function uniq(list, key){ var seen={}; list.forEach(function(o){
          var v = key(o); if(v) seen[v]=1; }); return Object.keys(seen).length; }

        /* Per-species tallies — this is the "achievements" data the first
           pass never built. Randy, 2026-09-25: "no achievements. no
           nothing so far." Real numbers weren't enough on their own;
           naming the actual species is what makes it feel alive. */
        var bySpecies = {};
        rows.forEach(function(o){
          var t = o.taxon; if(!t || !t.id) return;
          var key = t.id;
          if(!bySpecies[key]) bySpecies[key] = {
            name: t.preferred_common_name || t.name, count:0, logins:{}
          };
          bySpecies[key].count++;
          if(o.user && o.user.login) bySpecies[key].logins[o.user.login] = 1;
        });
        var speciesList = Object.keys(bySpecies).map(function(k){ return bySpecies[k]; })
          .sort(function(a,b){ return b.count - a.count; });

        PULSE = {
          weekObs: rows.length,
          weekSpecies: uniq(rows, function(o){ return o.taxon && o.taxon.id; }),
          weekObservers: uniq(rows, function(o){ return o.user && o.user.login; }),
          todayObs: rows.filter(function(o){ return o.observed_on===today; }).length,
          todaySpecies: uniq(rows.filter(function(o){ return o.observed_on===today; }),
            function(o){ return o.taxon && o.taxon.id; }),
          todayObservers: uniq(rows.filter(function(o){ return o.observed_on===today; }),
            function(o){ return o.user && o.user.login; }),
          speciesList: speciesList
        };
      }).catch(function(){});
  }

  /* ── real Bright Futures photographs ─────────────────────────────────
     photo_credits.json rows whose photographer's note in
     photographer_names.json says "Bright Futures student" — same rule
     screen.html's cohort() uses. Threaded into every slide builder below
     so nearly every slide gets a real full-bleed photo behind it, not
     just the two that used to show pictures. Randy, 2026-09-25, watching
     it run: "how do we make this interesting? no photo?" — correct, the
     old render() never set a background image at all. */
  function crewOf(photos, names){
    var logins = [];
    for(var login in names){
      var n = (names[login] && names[login].note) || '';
      if(n.toLowerCase().indexOf('bright futures') > -1) logins.push(login);
    }
    return (photos||[]).filter(function(p){ return logins.indexOf(p.photographer) > -1 && p.publish_ok; });
  }
  function randomPhoto(mine){
    if(!mine || !mine.length) return null;
    return mine[Math.floor(Math.random()*mine.length)];
  }

  /* ── slide builders ──────────────────────────────────────────────────── */
  function slidePulse(mine){
    if(!PULSE || PULSE.weekObs < 1) return null;
    var p = randomPhoto(mine);
    return { id:'pulse', seconds: SECONDS*1.2, bg: p && p.photo_url, html:
        '<div class="copy"><div class="label">Palma Sola this week</div>'
      + '<div class="stat-row">'
      +   '<div class="count">'+PULSE.weekObs+'<small>observations</small></div>'
      +   '<div class="count">'+PULSE.weekSpecies+'<small>species</small></div>'
      +   '<div class="count">'+PULSE.weekObservers+'<small>observers</small></div>'
      + '</div>'
      + '<div class="body">Every one of those came from somebody’s phone, right here in the park.</div></div>' };
  }

  /* A real achievement, not just a count — Randy: "no achievements. no
     nothing." Names the actual top species and who photographed it. */
  function slideMostPhotographed(names){
    if(!PULSE || !PULSE.speciesList || !PULSE.speciesList.length) return null;
    var top = PULSE.speciesList[0];
    if(top.count < 2) return null;
    var who = Object.keys(top.logins).map(function(login){
      var n = names[login];
      return (n && (n.credit_as || n.display_name)) || login;
    }).map(function(n){ return n.split(' – ')[0]; }).slice(0,4);
    return { id:'mostphoto', seconds: SECONDS*1.3, html:
        '<div class="copy"><div class="label">Most photographed this week</div>'
      + '<h2>'+esc(top.name)+'</h2>'
      + '<div class="stat-row"><div class="count">'+top.count+'<small>observations</small></div></div>'
      + '<div class="body">Spotted by '+esc(who.join(', '))+'.</div></div>' };
  }

  /* Concrete species names, not an abstract number — makes "63 species"
     feel real instead of just a stat. */
  function slideSpeciesSeen(mine){
    if(!PULSE || !PULSE.speciesList || PULSE.speciesList.length < 3) return null;
    var names = PULSE.speciesList.slice(0,8).map(function(s){ return s.name; }).filter(Boolean);
    if(names.length < 3) return null;
    var p = randomPhoto(mine);
    return { id:'speciesseen', seconds: SECONDS*1.4, bg: p && p.photo_url, html:
        '<div class="copy"><div class="label">Seen this week</div>'
      + '<h2>'+esc(names.join(' · '))+'</h2></div>' };
  }

  function slideTasks(tasksData, mine){
    if(!tasksData || !tasksData.tasks || !tasksData.tasks.length) return null;
    var rows = tasksData.tasks.map(function(t){
      return '<div class="task"><span class="team">'+esc(t.team||'')+'</span>'
           + '<span class="job">'+esc(t.job||'')+'</span></div>';
    }).join('');
    var p = randomPhoto(mine);
    return { id:'tasks', seconds: SECONDS*1.3, bg: p && p.photo_url, html:
        '<div class="copy"><div class="label">Today at the park</div>'
      + '<h2>'+esc(tasksData.note || 'Wednesday jobs')+'</h2>'
      + '<div class="task-list">'+rows+'</div></div>' };
  }

  function slideEvents(events, mine){
    var big = (events||[]).filter(function(e){ return e.category === 'Community'; });
    if(!big.length) return null;
    var rows = big.slice(0,4).map(function(e){
      var when = e.date ? new Date(e.date+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
      return '<div class="task"><span class="team">'+esc(when)+'</span>'
           + '<span class="job">'+esc(e.title||'')+'</span></div>';
    }).join('');
    var p = randomPhoto(mine);
    return { id:'events', seconds: SECONDS*1.2, bg: p && p.photo_url, html:
        '<div class="copy"><div class="label">Coming up</div>'
      + '<div class="task-list">'+rows+'</div></div>' };
  }

  function slideCrew(mine){
    if(mine.length < 5) return null;
    var species = {}; mine.forEach(function(p){ species[p.psbp_id]=1; });
    var pick = mine.slice().sort(function(){ return Math.random()-0.5; }).slice(0,8);
    var grid = pick.map(function(p){ return '<img alt="" src="'+p.photo_url+'">'; }).join('');
    return { id:'crew', seconds: SECONDS*1.4, html:
        '<div class="copy"><div class="label">The Bright Futures crew</div>'
      + '<h2>'+mine.length+' photographs, '+Object.keys(species).length+' species documented</h2>'
      + '<div class="photo-grid">'+grid+'</div></div>' };
  }

  /* One real photo, full-bleed, minimal text — the "photo of the moment"
     beat. Rotates through the actual crew archive, not a fixed pair. */
  function slidePhotoSpotlight(mine){
    var p = randomPhoto(mine);
    if(!p) return null;
    return { id:'spotlight-'+p.photo_id, seconds: SECONDS*1.3, bg: p.photo_url, html:
        '<div class="copy"><div class="label">From the crew</div>'
      + '<h2>'+esc(p.common_name || '')+'</h2>'
      + '<div class="body">'+esc(p.photographer_name || '')+'</div></div>' };
  }

  function slideHero(mine){
    var pool = mine.filter(function(p){ return p.hero; });
    var a = randomPhoto(pool.length >= 2 ? pool : mine);
    var b = randomPhoto(pool.length >= 2 ? pool : mine);
    if(!a || !b) return null;
    return { id:'hero', seconds: SECONDS*1.8, html:
        '<div class="copy"><div class="label">What makes a hero photo</div>'
      + '<div class="two-up">'
      +   '<figure><img src="'+a.photo_url+'" alt=""><figcaption>'+esc(a.common_name||'')+' · '+esc((a.photographer_name||'').split(' ')[0]||'')+'</figcaption></figure>'
      +   '<figure><img src="'+b.photo_url+'" alt=""><figcaption>'+esc(b.common_name||'')+' · '+esc((b.photographer_name||'').split(' ')[0]||'')+'</figcaption></figure>'
      + '</div>'
      + '<div class="body">One clean subject, nothing competing for the eye. A tight shot fills the frame; a wider one shows the whole plant’s shape. Both are right — they’re answering different questions.</div></div>' };
  }

  function slideOtherKinds(mine){
    var p = randomPhoto(mine);
    return { id:'kinds', seconds: SECONDS*1.5, bg: p && p.photo_url, html:
        '<div class="copy"><div class="label">Beyond the hero shot</div><h2>One photo rarely tells the whole story.</h2>'
    + '<div class="body">The close-up detail that settles an ID. The whole-plant habit shot that shows how it actually grows here. Bark, fruit, seed pods, the ID sign itself — the boring ones are often the ones we need most.</div></div>' };
  }

  function slideWhyMultiple(mine){
    var p = randomPhoto(mine);
    return { id:'multiple', seconds: SECONDS*1.2, bg: p && p.photo_url, html:
        '<div class="copy"><div class="label">Take more than one</div><h2>If it’s worth stopping for, it’s worth three photos.</h2>'
    + '<div class="body">Wide, then closer, then closer still. You can always throw two away later — you can’t go back and take the one you skipped.</div></div>' };
  }

  function slideWhyAllYear(mine){
    var p = randomPhoto(mine);
    return { id:'allyear', seconds: SECONDS*1.3, bg: p && p.photo_url, html:
        '<div class="copy"><div class="label">Why we never stop</div><h2>One photo is one moment. The park isn’t.</h2>'
    + '<div class="body">Bare in winter, blooming in spring, fruiting in fall — the same plant looks like three different plants across a year. "We already have a photo of that one" is never really true.</div></div>' };
  }

  var THANK_YOU = { id:'thanks', seconds: SECONDS*1.4, html:
      '<div class="copy"><div class="label">Why this matters</div>'
    + '<h2>Your phone → an observation → an ID → the catalog → a sign → a visitor reads it.</h2>'
    + '<div class="body">That whole chain starts with somebody deciding a plant was worth stopping for. Thank you for being that somebody, week after week.</div>'
    + '<img class="bf-logo" src="../images/logos/bright-futures.png" alt="Florida Bright Futures Scholarship Program"></div>' };

  function slideCleanup(){
    return { id:'cleanup', seconds: SECONDS*1.1, warn:true, html:
        '<div class="copy"><div class="label">5:30</div><h2>WARNING — time to stop what you’re doing.</h2>'
      + '<div class="body"><b>Carts</b> put away and washed down. <b>Tools</b> put away. Wrap up what you’re holding.</div></div>' };
  }
  function slideSummary(){
    var stats = (PULSE && PULSE.todayObs)
      ? '<div class="stat-row">'
        + '<div class="count">'+PULSE.todayObs+'<small>observations</small></div>'
        + '<div class="count">'+PULSE.todaySpecies+'<small>species</small></div>'
        + '<div class="count">'+PULSE.todayObservers+'<small>observers</small></div></div>'
      : '<div class="body">Today’s iNat numbers are still coming in — check the app.</div>';
    return { id:'summary', seconds: SECONDS*1.6, html:
        '<div class="copy"><div class="label">5:45 · Look what happened today</div>'
      + stats + '<div class="body">Nice work. See you next Wednesday.</div></div>' };
  }

  /* ── data load + rotation ───────────────────────────────────────────── */
  var BASE = '../';
  var slides = [];
  var lastForced = { cleanup:0, summary:0 };

  function forcedSlide(){
    var d=new Date(), mins=d.getHours()*60+d.getMinutes(), now=Date.now();
    if(mins>=17*60+30 && mins<17*60+45){
      if(now - lastForced.cleanup > 90000){ lastForced.cleanup=now; return slideCleanup(); }
    } else if(mins>=17*60+45 && mins<18*60+15){
      if(now - lastForced.summary > 150000){ lastForced.summary=now; return slideSummary(); }
    }
    return null;
  }

  var cur = null, last = null;
  function render(s){
    var el = document.createElement('div');
    el.className = 'slide' + (s.warn ? ' warn' : '');
    var bg = '<div class="bg'+(s.bg?' photo':'')+'"'+(s.bg?' style="background-image:url('+s.bg+')"':'')+'></div>';
    el.innerHTML = bg + s.html;
    deck.appendChild(el);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('on'); }); });
    if(cur){ var old=cur; old.classList.remove('on'); setTimeout(function(){ old.remove(); }, 1300/SPEED); }
    cur = el;
    var dur = s.seconds || SECONDS;
    bar.style.transition='none'; bar.style.width='0';
    requestAnimationFrame(function(){ bar.style.transition='width '+dur+'s linear'; bar.style.width='100%'; });
    return dur;
  }

  function pick(){
    var forced = forcedSlide();
    if(forced) return forced;
    if(!slides.length) return { id:'empty', seconds:SECONDS, html:'<div class="copy"><h2>Loading…</h2></div>' };
    var pool = slides.filter(function(s){ return s.id !== last; });
    var s = pool.length ? pool[Math.floor(Math.random()*pool.length)] : slides[0];
    last = s.id;
    return s;
  }

  function next(){
    var dur = render(pick());
    setTimeout(next, dur*1000);
  }

  function buildSlides(tasksData, events, photos, names){
    var mine = crewOf(photos, names);
    var built = [
      slidePulse(mine), slideMostPhotographed(names), slideSpeciesSeen(mine),
      slideTasks(tasksData, mine), slideEvents(events, mine), slideCrew(mine),
      slidePhotoSpotlight(mine), slidePhotoSpotlight(mine),
      slideHero(mine), slideOtherKinds(mine), slideWhyMultiple(mine), slideWhyAllYear(mine),
      THANK_YOU
    ];
    slides = built.filter(Boolean);
  }

  Promise.all([
    grab(BASE+'data/published/brightfutures_today.json'),
    grab(BASE+'data/published/events.json'),
    grab(BASE+'data/sources/photo_credits.json'),
    grab(BASE+'data/sources/photographer_names.json'),
    loadPulse()
  ]).then(function(r){
    var photos = (r[2] && r[2].photos) || r[2] || [];
    buildSlides(r[0], r[1], photos, r[3] || {});
    next();
  }).catch(function(){ slides = [HERO_LESSON, OTHER_KINDS, THANK_YOU]; next(); });

  /* Refresh data + iNat pulse every 10 minutes, same cadence as the rest
     of the kiosk fleet. */
  setInterval(function(){
    Promise.all([
      grab(BASE+'data/published/brightfutures_today.json'),
      grab(BASE+'data/published/events.json'),
      grab(BASE+'data/sources/photo_credits.json'),
      grab(BASE+'data/sources/photographer_names.json'),
      loadPulse()
    ]).then(function(r){
      var photos = (r[2] && r[2].photos) || r[2] || [];
      buildSlides(r[0], r[1], photos, r[3] || {});
    }).catch(function(){});
  }, (10*60*1000) / SPEED);
})();
</script>
</body>
</html>
