our Galleria.","show_from":"","show_until":"","link_text":"","link_url":"","screen_qr":"","screen_image":"","screen_logo":"images/logos/selby.png"},{"display":"screen","director_note":"no","emoji":"🪵","title":"Thank you, Bishop Parker Foundation","body":"Thank you to the Bishop Parker Foundation for making our new Galleria deck possible—a welcoming space for classes, celebrations, and community gatherings.","show_from":"","show_until":"","link_text":"","link_url":"","screen_qr":"","screen_image":"docs/news/bishop-parker-deck.jpg","screen_logo":"images/logos/bishop-parker.webp"}],"right_now":[{"display":"web","common_name":"Heliconia","scientific_name":"Heliconia psittacorum","kind":"blooming","note":"Great shot of these blooming by Alaina, one of our high school volunteers! The mass planting outside the office is at times unruly, so we enjoy them now while we can.","area":"Near Office","psbp_id":"PSBP-00056","peak_start":"","peak_end":"","has_page":true,"quick_hits":["Look between the red bracts: the slim orange tubes with dark tips are the actual flowers, and on this heliconia they are half the show.","Each flower opens just before dawn and has stopped making nectar by early afternoon.","In Brazil a skipper butterfly pollinates it before sunrise, alongside hummingbirds and an orchid bee."]},{"display":"both","common_name":"Red Cornsnake","scientific_name":"Pantherophis guttatus","kind":"sighting","note":"A cornsnake surprised us at the Team Workday by jumping out from our pond plants into the water! Harmless, handsome, and colorful! Susan was unphased, and Randy re-thought going into the waters to plant native cannas.","area":"Big Pond","psbp_id":"PSBP-90048","peak_start":"","peak_end":"","quick_hits":["Orange, red or brown blotches edged in black run along its orange-brown body. Adults commonly reach about two and a half to four feet.","It climbs well and hunts mainly at night."]},{"display":"both","common_name":"Tersa Sphinx","scientific_name":"Xylophanes tersa","kind":"sighting","note":"Patty spotted this sphinx moth- first recorded at the park! A fast flyer that hovers at flowers like a hummingbird, so look at dusk.","area":"Near Office","psbp_id":"PSBP-90029","peak_start":"","peak_end":"","quick_hits":["A slim, sharply pointed moth that flies at dusk, hovering at flowers to drink nectar through a long tongue, much like a hummingbird.","Its caterpillars feed on pentas and firebush, both of which grow here.","The caterpillar carries a row of eyespots along its sides. Alarmed, it pulls its head in and puffs up its front end so the spots stare back."]},{"display":"both","common_name":"Rainbow Eucalyptus","scientific_name":"Eucalyptus deglupta","kind":"Planted","note":"Franky and her team planted this tree in September to replace a sadly fallen baobab from the storms of past years. We also lost a rainbow eucalyptus near the cactus garden, so this is a welcome back of sorts!","area":"Front Pond","psbp_id":"PSBP-00301","peak_start":"","peak_end":"","has_page":true,"quick_hits":["The bark peels away in strips. The fresh bark underneath is bright green, and it darkens through blues, purples and oranges as it ages.","Unlike most eucalyptus, it comes from rainforest, not dry Australian bush.","On Maui, a roadside grove of these trees is one of the famous stops on the Road to Hana."]},{"display":"both","common_name":"Northern Cardinal","scientific_name":"Cardinalis cardinalis","kind":"sighting","note":"Unexpected Helping Hand. Photographer Helen Lewis spotted something remarkable: a Northern Cardinal feeding a young Northern Mockingbird chick. A wonderful little moment of unexpected care, caught right here at the park.","area":"Rare Fruit","psbp_id":"PSBP-99978","peak_start":"","peak_end":"","has_page":true,"quick_hits":["Males are bright red with a pointed crest and black face mask; females are warm buff-brown with red tinges. Both carry the same stout orange-red bill.","Both sexes sing. In many North American songbirds only the male does.","That heavy conical bill is a seed-cracker, opening tough seeds many birds cannot manage."]},{"display":"web","common_name":"Beautyberry","scientific_name":"Callicarpa americana","kind":"blooming","note":"This is the best time of year to see Beautyberry in its full purple. Like a Dr Seuss plant!","area":"Near Office and around Cypress Pond","psbp_id":"PSBP-00059","peak_start":"","peak_end":"","has_page":true,"quick_hits":["Around the beginning of September, tight clusters of vivid purple fruit appear directly around the stems. At Palma Sola, that is when Beautyberry suddenly seems to be everywhere.","American Beautyberry is a Florida native. Ours grow around Cypress Pond and the office, and some appear to have seeded themselves into new spots.","The fruit is edible, though fresh Beautyberries are tart and not especially flavorful; they are more often made into jelly, with a lot of sugar."]}],"plants":[{"id":"PSBP-00003","common":"Buccaneer Palm","sci":"Pseudophoenix sargentii","family":"Arecaceae","photo":"photos/PSBP-00003/697821835.jpg","quick_hits":["One of the rarest palms still growing wild in the United States. Florida's remaining wild population is on Elliott Key.","An earlier Florida population on Long Key was dug up and sold as ornamentals in the early twentieth century. It is gone.","It grows extraordinarily slowly — only a few new fronds a year, and many years to reach reproductive maturity.","Blue-gray fronds flash silver underneath, and bright red fruit can appear below the crown."],"teaser":"Fewer than fifty survive in the wild in Florida, all on Elliott Key. Every one growing in cultivation is a conservation choice somebody made.","credit_name":"Randall Carter","credit":"randall_carter","credit_license":"CC-BY-NC"},{"id":"PSBP-00017","common":"Paurotis Palm","sci":"Acoelorrhaphe wrightii","family":"Arecaceae","photo":"photos/PSBP-00017/672130175.jpg","quick_hits":["This fan palm is a Florida native that grows wild only at the southern tip, and the state protects it. Around the Caribbean and Central America it is far more widespread.","A Paurotis is a clump of slender stems. As the older ones lean outward they sag under their own weight, then turn upward again, and each sag leaves a twist in the stem.","A big clump crowds itself with new shoots and dead fronds, so keeping it tidy is real work. Here, a volunteer thins the shoots and old growth near the ground, then cuts dead fronds high overhead with a pole pruner. A mature clump can take a day or two."],"teaser":"A rare Florida native whose slender stems sag, then climb again, leaving twists. A volunteer keeps the clump here tidy.","credit_name":"Randall Carter","credit":"randall_carter","credit_license":"CC-BY-NC"},{"id":"PSBP-00019","common":"Bottle Palm","sci":"Hyophorbe lagenicaulis","family":"Arecaceae","photo":"photos/PSBP-00019/731644653.jpg","quick_hits":["The bottle is a young palm's shape: the trunk swells hardest early on and stretches out as the palm grows taller.","In the wild it grows only on Round Island, off Mauritius. By 1988 rabbits and goats had left just eight mature trees; once the rabbits were gone, seedlings came up by the hundreds.","It carries only four to eight leaves at a time, so the crown always looks a little sparse.","Our Spindle Palms are its sisters. The Bottle swells near the ground; the Spindle is fattest around the middle."],"teaser":"Garden palms are everywhere, yet the wild comeback traced to the island's last few trees, which turned out to hold more genetic variety than the garden stock.","credit_name":"Kevin W. – High School Volunteer","credit":"kevin_wang5","credit_license":"CC-BY-NC"},{"id":"PSBP-00020","common":"Canary Island Date Palm","sci":"Phoenix canariensis","family":"Arecaceae","photo":"photos/PSBP-00020/698457772.jpg","quick_hits":["The Canary Islands may be named for dogs: Pliny wrote that the island of Canaria swarmed with huge ones. The canary bird and this palm are both named for the islands.","On La Gomera, tappers draw about three gallons of sap a day from the crown and boil it down into a dark palm honey.","Ours is a female: in July 2026 its crown was hung with orange stalks of small green dates.","Its yellowing old leaves are a potassium store. Cutting them off for neatness speeds the palm's decline."],"teaser":"On La Gomera its sap is boiled down into palm honey. At home in the Canary Islands it is the official natural symbol, alongside the canary bird.","credit_name":"Ruby M. – High School Volunteer","credit":"ruby_meador","credit_license":"CC-BY-NC"},{"id":"PSBP-00035","common":"Royal Palm","sci":"Roystonea regia","family":"Arecaceae","photo":"photos/PSBP-00035/739551989.jpg","quick_hits":["Our Royal Palms were county nursery stock, left behind when Manatee County stopped growing its own street trees. They rooted through their pots where they stood.","The smooth green column below the leaves isn't trunk. It's a sleeve of wrapped leaf bases called the crownshaft.","It drops its own old leaves, base and all, one about every month, which is why the trunk stays so clean.","The genus is named for an American army engineer, General Roy Stone."],"teaser":"That smooth green column below the fronds is not trunk. It is a sleeve of wrapped leaf bases, and each one peels away with its old leaf.","credit_name":"Molly E. – High School Volunteer","credit":"mollyevans","credit_license":"CC-BY-NC"},{"id":"PSBP-00056","common":"Heliconia","sci":"Heliconia psittacorum","family":"Heliconiaceae","photo":"photos/PSBP-00056/731638176.jpg","quick_hits":["Look between the red bracts: the slim orange tubes with dark tips are the actual flowers, and on this heliconia they are half the show.","Each flower opens just before dawn and has stopped making nectar by early afternoon.","In Brazil a skipper butterfly pollinates it before sunrise, alongside hummingbirds and an orchid bee.","High school volunteers dig its wandering rhizomes out of the cannas next door and send stray cannas back the other way."],"teaser":"Heliconia or canna? Stiff bracts in a flat, angular spike mean heliconia; soft, loose petals in clusters mean canna. Visitors sometimes need a moment to tell.","credit_name":"Alaina C. – High School Volunteer","credit":"alaina37345","credit_license":"CC-BY-NC"},{"id":"PSBP-00082","common":"Burmese Fishtail Palm","sci":"Caryota mitis","family":"Arecaceae","photo":"photos/PSBP-00082/626740347.jpg","quick_hits":["Fishtail palms are the only palms whose leaves divide twice. Every small leaflet ends in a ragged, fishtail edge.","Each stem flowers just once, starting at the top and working down, and then it dies.","In Singapore, civets eat so much of the fruit that their droppings fill up with fishtail seeds.","It has gone wild in Manatee County. In 2015 botanists found it growing in the hammock at Emerson Point."],"teaser":"Does the clump outlive its stems? References say suckers replace them; Florida palm specialists say every stem dies after flowering. Ours has yet to flower.","credit_name":"jsea","credit":"jsea","credit_license":"CC-BY-NC"},{"id":"PSBP-00084","common":"Reclining Date Palm","sci":"Phoenix reclinata","family":"Arecaceae","photo":"photos/PSBP-00084/698404664.jpg","quick_hits":["A wild cousin of the palm that gives us supermarket dates. Its own dates are small and thin-fleshed, but edible.","The lowest leaflets on every frond are stiff, needle-sharp spines.","The big clump between the restrooms and the Rare Fruit garden shades the walk over from the Butterfly Garden."],"teaser":"Its trunks lean outward from the base instead of standing straight, growing in clumps along African rivers — the reclining habit that named it.","credit_name":"Ruby M. – High School Volunteer","credit":"ruby_meador","credit_license":"CC-BY-NC"},{"id":"PSBP-00085","common":"Little Lady Palm","sci":"Rhapis excelsa","family":"Arecaceae","photo":"photos/PSBP-00085/667853763.jpg","quick_hits":["For about 200 years in Japan, only the upper classes grew this palm. By one account, a lord gave one to the shogun, who passed offshoots on to other lords as marks of honor.","Some lady palms have striped leaves; most are plain green. Nobody has found a way to make a plant grow stripes on purpose, even with X-rays or chemicals, and in 1973 the rarest striped plants in Japan were priced at $20,000 to $80,000 each.","In the wild, lady palm stems can reach about 13 feet, yet Japanese collectors keep their finest plants in pots only 8 to 20 inches high. Its scientific name, Rhapis excelsa, even means 'tall'."],"teaser":"Fiber-wrapped stems topped with glossy fans that end in ragged, squared-off tips. In Japan, collectors have prized the striped-leaf forms for generations.","credit_name":"Randall Carter","credit":"randall_carter","credit_license":"CC-BY-NC"},{"id":"PSBP-00301","common":"Rainbow Eucalyptus","sci":"Eucalyptus deglupta","family":"Myrtaceae","photo":"photos/PSBP-00301/727623040.jpg","quick_hits":["The bark peels away in strips. The fresh bark underneath is bright green, and it darkens through blues, purples and oranges as it ages.","Unlike most eucalyptus, it comes from rainforest, not dry Australian bush.","On Maui, a roadside grove of these trees is one of the famous stops on the Road to Hana.","Ours is young, planted at the Front Pond where a Baobab came down in a storm."],"teaser":"Patches of bark peel at different times, so the trunk is never one color. Ours is young and mostly green so far; come back over the years and watch it build.","credit_name":"Franky McArthur","credit":"frankymca","credit_license":"CC-BY-NC"}],"wildlife":[{"id":"PSBP-99940","common":"Western Cattle-Egret","sci":"Ardea ibis","family":"Ardeidae","photo":"photos/PSBP-99940/681678688.jpg","quick_hits":["Cattle Egrets reached the Americas without human help. The species spread from Africa to South America in the late 1800s and had reached Florida by the middle of the twentieth century.","A compact white egret standing on dry grass rather than at the water's edge is usually a Cattle Egret.","It feeds by following something larger. Cattle, a mower or a tractor pushes insects out of the grass ahead of it, and the egret walks behind picking them off.","Breeding adults develop orange-buff patches on the crown, back and breast, and the bill and legs brighten."],"teaser":"The one egret you are more likely to see on a mown lawn than at the water's edge. It follows whatever is flushing insects out of the grass.","credit_name":"Rob Carr","credit":"robcarr52","credit_license":"CC-BY-NC"},{"id":"PSBP-99941","common":"Snowy Egret","sci":"Egretta thula","family":"Ardeidae","photo":"photos/PSBP-99941/733846120.jpg","quick_hits":["A medium white egret with a black bill, black legs and bright yellow feet — as if it were wearing golden slippers.","The yellow feet are a hunting tool: it shuffles them through the shallows to stir prey into moving.","Smaller and far more active than a Great Egret, dashing through the shallows rather than standing still."],"teaser":"It stirs the bottom with one bright yellow foot to panic small fish into moving, then strikes at whatever breaks cover.","credit_name":"Helen Lewis","credit":"helen_lewis","credit_license":"CC-BY-NC"},{"id":"PSBP-99942","common":"Little Blue Heron","sci":"Egretta caerulea","family":"Ardeidae","photo":"photos/PSBP-99942/734158238.jpg","quick_hits":["Adult Little Blue Herons are dark slate-blue with a purplish head and neck, and they usually hunt with slow, deliberate movements in shallow water.","Young Little Blue Herons are white. As they acquire adult plumage, blue feathers replace the white in patches, creating a distinctive blue-and-white 'calico' stage.","White juveniles are more readily tolerated among feeding Snowy Egrets than dark adults are, and young Little Blues can feed more successfully while accompanying those flocks.","Little Blue Herons are State-designated Threatened in Florida. Loss and degradation of wetland feeding and nesting habitat remain concerns."],"teaser":"A young Little Blue Heron is white. During its first year, blue feathers gradually replace the white until it looks like an entirely different bird.","credit_name":"Helen Lewis","credit":"helen_lewis","credit_license":"CC-BY-NC"},{"id":"PSBP-99962","common":"Green Anole","sci":"Anolis carolinensis","family":"Anolidae","photo":"photos/PSBP-99962/680896933.jpg","quick_hits":["The Green Anole is Florida's only native anole. It can change from bright green to brown, and adult males display a pink throat fan called a dewlap.","Color change is influenced by temperature, light and the lizard's physiological state. It is not the rapid background-matching trick associated with chameleons.","Where introduced Brown Anoles become abundant, Green Anoles often shift toward higher perches in shrubs and trees, reducing overlap between the two species.","Its expanded toe pads are covered with microscopic structures that help it cling to leaves, stems and smooth surfaces while climbing."],"teaser":"A Green Anole can change from bright green to brown, but it is not trying to match whatever it is sitting on.","credit_name":"Jenny Gunter","credit":"jengunter","credit_license":"CC-BY-NC"},{"id":"PSBP-99967","common":"Black-crowned Night Heron","sci":"Nycticorax nycticorax","family":"Ardeidae","photo":"photos/PSBP-99967/318200562.jpg","quick_hits":["A stocky, hunch-shouldered heron with a black cap and back, pale gray wings and red eyes is a Black-crowned Night Heron.","It feeds mostly from late afternoon through the night, when most other herons have stopped.","It hunts by ambush, standing motionless at the water's edge and waiting rather than walking prey down.","Young birds are brown and heavily spotted, and are difficult to separate from young Yellow-crowned Night Herons."],"teaser":"It works the shift the other herons do not. Most feeding happens from dusk into the night, when the shallows are largely empty.","credit_name":"Pammy63","credit":"pammy63","credit_license":"CC-BY-NC"},{"id":"PSBP-99972","common":"Green Heron","sci":"Butorides virescens","family":"Ardeidae","photo":"photos/PSBP-99972/737895811.jpg","quick_hits":["The Green Heron is a small, stocky heron with a dark green-gray back, chestnut neck and dark cap.","It sometimes uses bait, dropping insects, feathers or other small objects onto the water to bring fish within striking range.","It often hunts from a bank or low branch, crouched almost horizontally over the water and partly hidden by vegetation.","At rest the neck looks very short. During a strike it extends suddenly, revealing how much neck was folded into that compact body."],"teaser":"Green Herons sometimes place an insect, feather or other small object on the water and wait for a fish to approach it.","credit_name":"Helen Lewis","credit":"helen_lewis","credit_license":"CC-BY-NC"},{"id":"PSBP-99977","common":"Yellow-crowned Night Heron","sci":"Nyctanassa violacea","family":"Ardeidae","photo":"photos/PSBP-99977/702999501.jpg","quick_hits":["Adults are gray with a black head, a broad white cheek patch and a pale yellow crown.","Crabs and crayfish dominate the diet, which is why the bill is so unusually heavy.","Young birds are brown and spotted, and can be very hard to tell from young Black-crowned Night Herons."],"teaser":"The heavy bill tells you what it eats: Yellow-crowned Night Herons specialize on crabs and crayfish.","credit_name":"Rhonda Olschefskie","credit":"rhonda_olschefskie","credit_license":"CC-BY-NC"},{"id":"PSBP-99978","common":"Northern Cardinal","sci":"Cardinalis cardinalis","family":"Cardinalidae","photo":"photos/PSBP-99978/733901077.jpg","quick_hits":["Males are bright red with a pointed crest and black face mask; females are warm buff-brown with red tinges. Both carry the same stout orange-red bill.","Both sexes sing. In many North American songbirds only the male does.","That heavy conical bill is a seed-cracker, opening tough seeds many birds cannot manage.","Cardinals hold the same territory all year rather than migrating, so a pair may be the same birds you saw last season."],"teaser":"Both sexes sing, which is unusual among North American songbirds — and a female often sings from the nest.","credit_name":"Helen Lewis","credit":"helen_lewis","credit_license":"CC-BY-NC"},{"id":"PSBP-99982","common":"Osprey","sci":"Pandion haliaetus","family":"Pandionidae","photo":"photos/PSBP-99982/733796515.jpg","quick_hits":["A large fish-eating hawk, white below and on the head, with a bold dark stripe through the eye.","It hunts by diving feet-first, sometimes going completely under the surface.","In flight the long, narrow wings bend sharply partway along, like a gull's.","The pesticide DDT thinned osprey eggshells and numbers fell. After it was banned in 1972 they climbed back, helped by other changes too."],"teaser":"Fish bones used to land in the mulch under the Kapok by Cypress Pond. An Osprey ate its tilapia on a high branch overhead.","credit_name":"Helen Lewis","credit":"helen_lewis","credit_license":"CC-BY-NC"},{"id":"PSBP-99985","common":"Tricolored Heron","sci":"Egretta tricolor","family":"Ardeidae","photo":"photos/PSBP-99985/681680090.jpg","quick_hits":["Blue-gray and purple above but bright white below — the only dark Florida heron with a clean white belly.","It hunts on the move, running, turning and lunging through shallow water after small fish.","Listed as Threatened in Florida, though the species is not considered at risk globally."],"teaser":"Most dark herons are dark underneath too. The Tricolored Heron's bright white belly is the field mark that separates it.","credit_name":"Rob Carr","credit":"robcarr52","credit_license":"CC-BY-NC"}],"credits":[{"psbp_id":"PSBP-99985","photo_id":"681680090","photo_url":"https://inaturalist-open-data.s3.amazonaws.com/photos/681680090/large.jpg","source_url":"https://www.inaturalist.org/observations/373034459","common_name":"Tricolored Heron","scientific_name":"Egretta tricolor","photographer":"robcarr52","photographer_name":"Rob Carr","license":"CC-BY-NC","observed_on":"2025-03-03","hero":true,"publish_ok":true,"w":2029,"h":1152},{"psbp_id":"PSBP-99967","photo_id":"318200562","photo_url":"https://inaturalist-open-data.s3.amazonaws.com/photos/318200562/large.jpg","source_url":"https://www.inaturalist.org/observations/182494203","common_name":"Black-crowned Night Heron","scientific_name":"Nycticorax nycticorax","photographer":"pammy63","photographer_name":"Pammy63","license":"CC-BY-NC","observed_on":"2023-09-09","hero":true,"publish_ok":true,"w":1536,"h":2048},{"psbp_id":"PSBP-99962","photo_id":"680896933","photo_url":"https://inaturalist-open-data.s3.amazonaws.com/photos/680896933/large.jpg","source_url":"https://www.inaturalist.org/observations/372610677","common_name":"Green Anole","scientific_name":"Anolis carolinensis","photographer":"jengunter","photographer_name":"Jenny Gunter","license":"CC-BY-NC","observed_on":"2026-06-17","hero":true,"publish_ok":true,"w":2048,"h":2048},{"psbp_id":"PSBP-99940","photo_id":"681678688","photo_url":"https://inaturalist-open-data.s3.amazonaws.com/photos/681678688/large.jpg","source_url":"https://www.inaturalist.org/observations/373034306","common_name":"Western Cattle-Egret","scientific_name":"Ardea ibis","photographer":"robcarr52","photographer_name":"Rob Carr","license":"CC-BY-NC","observed_on":"2025-11-14","hero":true,"publish_ok":true,"w":1878,"h":1257},{"psbp_id":"PSBP-00017","photo_id":"672130175","photo_url":"https://inaturalist-open-data.s3.amazonaws.com/photos/672130175/large.jpg","source_url":"https://www.inaturalist.org/observations/368016429","common_name":"Paurotis Palm","scientific_name":"Acoelorrhaphe wrightii","photographer":"randall_carter","photographer_name":"Randall Carter","license":"CC-BY-NC","observed_on":"2026-06-03","hero":true,"publish_ok":true,"w":1152,"h":2048},{"psbp_id":"PSBP-00082","photo_id":"626740347","photo_url":"https://inaturalist-open-data.s3.amazonaws.com/photos/626740347/large.jpg","sour
