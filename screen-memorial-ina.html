<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In Loving Memory · Mary Ina Baden</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   MEMORIAL SLIDE — Mary Ina Baden ("Niny"), 1940–2026
   ----------------------------------------------------------------------------
   NOT the regular screen.html. A separate, standalone file — deliberately
   simple, no feed machinery, no rotation logic, just five hardcoded slides on
   a timer. Built as a DEMO for Randy to review before anything goes live;
   nothing here has been pushed to the office/galleria kiosks yet.

   Same visual language as screen.html (--ground, --gold, --paper, Playfair +
   Source Sans) so it still reads as "this park," just hushed: long dwells,
   slow fades, no eyebrows/badges/gold "NEW" flourishes — every device that
   normally signals "look, something's happening!" is deliberately absent.

   Swap-in plan (not done yet): save the current screen.html as
   screen-normal.html, then this file's content replaces screen.html so the
   kiosk (just a browser pointed at that URL) picks it up on its own with no
   need to touch the machine. Reverting later is restoring the backup.

   No photo of her exists in photo_credits.json / photographer_names.json —
   she was never a photo contributor, so PHOTO_URL below is empty by design.
   Drop a real photo path in and slide 1 uses it automatically; until then it
   runs as a clean type-only slide, which is a fine, dignified default on its
   own.
============================================================================ */
:root{
  --ground:#0c1a10; --ground-2:#122316;
  --gold:#eabc5a; --gold-deep:#c5922a; --paper:#fdfcf8;
  --ink-invert:rgba(253,252,248,.82); --ink-quiet:rgba(253,252,248,.58);
  --rule:rgba(234,188,90,.34);
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Source Sans 3',-apple-system,'Segoe UI',sans-serif;
  --fade:1.8s;      /* slower than the regular screen — this one shouldn't rush */
  --frame:2.6vmin;
  --pad:5vmin;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ground)}
body{font-family:var(--sans);color:var(--paper);cursor:none;-webkit-font-smoothing:antialiased}

.frame{position:fixed;inset:var(--frame);border:1px solid var(--rule);pointer-events:none;z-index:40}
.logo-mark{position:fixed;bottom:calc(var(--frame) + 1.6vmin);right:calc(var(--frame) + 1.8vmin);height:5.2vmin;width:auto;opacity:.78;z-index:41;pointer-events:none}

.deck{position:fixed;inset:0}
.slide{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:0 8vmin;
  opacity:0;transition:opacity var(--fade) ease;
}
.slide.on{opacity:1;z-index:1}
.slide .bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-1}
.slide .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,18,9,.35),rgba(8,18,9,.72));z-index:-1}
/* Anecdote slides: a park photo as a barely-there texture, not a real
   photograph competing with the words — the ground color still does almost
   all the work. Randy: "very faint backgrounds." */
.slide.anec .bg{opacity:.09;filter:saturate(.6)}
.slide.anec .veil{background:var(--ground)}

.name{font-family:var(--serif);font-weight:700;font-size:clamp(2.4rem,7vmin,6rem);line-height:1.08;color:var(--paper)}
/* Welcome slide runs bigger than anecdotes — it's the one people should be
   able to read from across the room. Randy: "make it bigger." */
.slide.welcome .label{font-size:2.1vmin}
.slide.welcome .name{font-size:clamp(3.4rem,10vmin,8.5rem)}
.slide.welcome .dates{font-size:clamp(1.5rem,3.6vmin,2.9rem);margin-top:2.4vmin}
.slide.welcome .who{font-size:clamp(1.3rem,2.9vmin,2rem);margin-top:2vmin}
.slide.welcome .veil{background:linear-gradient(180deg,rgba(8,18,9,.55),rgba(8,18,9,.84))}
.name em{font-style:italic;color:var(--gold);font-weight:400}
.dates{margin-top:1.6vmin;font-family:var(--serif);font-style:italic;font-size:clamp(1.1rem,2.6vmin,2.1rem);color:var(--gold)}
.rule{width:5vmin;height:1px;background:var(--gold-deep);margin:3vmin auto}
.label{font-size:1.6vmin;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:1.6vmin}
.body{max-width:64vmin;font-size:clamp(1.05rem,2.5vmin,1.8rem);line-height:1.65;color:var(--ink-invert);font-weight:300}
.body + .body{margin-top:2vmin}
.who{margin-top:1.5vmin;font-family:var(--serif);font-style:italic;color:var(--ink-quiet);font-size:clamp(.95rem,2.1vmin,1.4rem)}

.service{margin-top:3.5vmin;display:flex;flex-direction:column;gap:.6vmin;color:var(--gold)}
.service .big{font-family:var(--serif);font-weight:700;font-size:clamp(1.3rem,3.2vmin,2.4rem)}
.service .small{font-size:clamp(.85rem,1.9vmin,1.2rem);color:var(--ink-quiet);font-weight:300}

@media (max-width:900px){ .body{max-width:88vmin} }
</style>
</head>
<body>

<div class="frame"></div>
<img class="logo-mark" src="images/white_PSBP_logo.png" alt="Palma Sola Botanical Park">
<div class="deck" id="deck"></div>

<script>
/* PHOTO_URL: leave blank for the clean type-only version of the welcome
   slide. To add a photo later, set this to a path (e.g.
   'images/ina-baden.jpg') and the welcome slide uses it as a full-bleed
   background automatically. */
var PHOTO_URL = 'photos/PSBP-00002/602872039.jpg'; // Weeping Bottlebrush — everyone recognizes it as Palma Sola. Swap for a real photo of Ina if one turns up

/* WELCOME is the "home base" slide — office monitor, meant to spark
   conversation among people milling around before/during the service.
   Randy: "The most in rotation just say welcome... Come back to that one a
   lot but intersperse some tasteful anecdotes." So the rotation isn't a
   flat loop — it alternates WELCOME, anecdote, WELCOME, anecdote... built
   below, not hardcoded as one long sequence. */
var WELCOME = {
  bg: PHOTO_URL || null,
  html:
      '<div class="label">Welcome to the Celebration of Life for</div>'
    + '<div class="name">Mary <em>Ina</em> Baden</div>'
    + '<div class="dates">September 21, 1940 &ndash; September 8, 2026</div>'
    + '<div class="who">&ldquo;Niny&rdquo;</div>'
};

/* VIGNETTES — every one sourced directly from the family obituary, per
   ChatGPT's review (relayed by Randy). Each carries a `weight` — how many
   copies go in the shuffle bag, so light/warm ones surface more often and
   the heavier ones (The White Bed, A Life of Service) surface rarely
   without ever being excluded. `seconds` overrides the default dwell;
   PALMA SOLA runs longer since the room is full of people who knew her
   through this place specifically. */
var VIGNETTES = [
  { weight: 3, html:
        '<div class="label">Her Hobbies</div>'
      + '<div class="rule"></div>'
      + '<div class="body">Rose gardening. Shell collecting. Piano. Scuba diving. Horseback riding. Harley riding. Ina found plenty of ways to fill a life.</div>' },

  { weight: 3, html:
        '<div class="label">&ldquo;Hey, Darlin&rsquo;&rdquo;</div>'
      + '<div class="rule"></div>'
      + '<div class="body">Ina greeted people with &ldquo;Hey, Darlin&rsquo;,&rdquo; usually followed by a hug and a kiss. And she rarely let anyone leave without hearing, &ldquo;I love you.&rdquo;</div>' },

  { weight: 3, html:
        '<div class="label">President of Your Fan Club</div>'
      + '<div class="rule"></div>'
      + '<div class="body">Ina had a way of making people feel like they were her favorite. She often told them, &ldquo;I&rsquo;m the president of your fan club.&rdquo;</div>' },

  { weight: 3, html:
        '<div class="label">Elvis</div>'
      + '<div class="rule"></div>'
      + '<div class="body">As a teenager, Ina went to an Elvis Presley concert. Her favorite part of the story: Elvis kissed her. She told that one for the rest of her life.</div>' },

  { weight: 3, html:
        '<div class="label">Adventure</div>'
      + '<div class="rule"></div>'
      + '<div class="body">She traveled to nearly every continent, scuba dived, rode horses, and took road trips on her big Harley.</div>' },

  { weight: 2, html:
        '<div class="label">The Class of &rsquo;58</div>'
      + '<div class="rule"></div>'
      + '<div class="body">Ina graduated from Manatee High School in 1958 and could still recite the motto: &ldquo;Always ready, never late. We&rsquo;re the class of &rsquo;58!&rdquo;</div>' },

  { weight: 2, html:
        '<div class="label">On the Road</div>'
      + '<div class="rule"></div>'
      + '<div class="body">Ina earned her commercial driver&rsquo;s license and helped launch the Manatee Blood Bank&rsquo;s mobile donation program &mdash; then drove the bus around town herself.</div>' },

  { weight: 2, bg: 'photos/PSBP-00072/703871348.jpg', html:
        '<div class="label">The Rose Garden</div>'
      + '<div class="rule"></div>'
      + '<div class="body">Ina loved her roses and proudly showed off her garden. She also collected shells from around the world, and thousands of photographs from a life well traveled.</div>' },

  { weight: 2, html:
        '<div class="label">The Piano</div>'
      + '<div class="rule"></div>'
      + '<div class="body">Ina learned to play piano and kept playing throughout her life &mdash; one interest among many she never seemed too old to begin, or continue.</div>' },

  { weight: 2, html:
        '<div class="label">Scrabble</div>'
      + '<div class="rule"></div>'
      + '<div class="body">Even in later years, Ina remained competitive. One of her favorite pursuits was beating family and friends at online Scrabble.</div>' },

  { weight: 1, html:
        '<div class="label">A Life of Service</div>'
      + '<div class="rule"></div>'
      + '<div class="body">Nurse. Blood-bank worker. Home-health caregiver. Hospice volunteer. And, for many happy years, a familiar face here at Palma Sola Botanical Park.</div>' },

  { weight: 1, html:
        '<div class="label">The White Bed</div>'
      + '<div class="rule"></div>'
      + '<div class="body">When someone was frightened, overwhelmed, or simply needed comfort, Ina had a standing invitation: &ldquo;Come get in the white bed.&rdquo; For generations of her family, it became a place of refuge.</div>' },

  { weight: 2, seconds: 19, bg: 'photos/PSBP-00621/681678425.jpg', html:
        '<div class="label">Palma Sola</div>'
      + '<div class="rule"></div>'
      + '<div class="body">Ina spent many happy years working here. The park was important enough to her that her family asked that memorial gifts be made to Palma Sola Botanical Park.</div>' }
];

/* ?speed=10 previews the whole flow fast — same convention as screen.html.
   Divides every duration (welcome, default vignette, and any vignette's own
   `seconds` override) by this factor. */
var SPEED = Math.max(0.1, Math.min(20, +(new URLSearchParams(location.search).get('speed') || 1) || 1));

var WELCOME_SECONDS  = 50 / SPEED;
var VIGNETTE_SECONDS = 14 / SPEED; // default; a vignette's own `seconds` overrides this

/* Weighted, no-repeat-until-exhausted shuffle bag: each vignette appears
   `weight` times in the bag, the bag is shuffled once, and drawn from in
   order — reshuffled only once empty. That's what gives light/warm stories
   more air time than the heavier ones without ever fully excluding them,
   per ChatGPT's guidance (relayed by Randy) on how the obituary material
   should be weighted. */
var bag = [];
function refillBag(){
  var pool = [];
  VIGNETTES.forEach(function(v){
    for (var i = 0; i < v.weight; i++) pool.push(v);
  });
  // Fisher–Yates
  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  bag = pool;
}
function nextVignette(){
  if (!bag.length) refillBag();
  return bag.pop();
}

var deck = document.getElementById('deck');
var liveEl = null; // the currently-shown slide element, if any

/* A real crossfade, not a swap: the new slide is appended at opacity 0,
   forced to reflow so the browser registers that starting state, then both
   old-fades-out and new-fades-in fire together via the .on toggle — the
   same device screen.html's own multi-slide deck uses, just with only ever
   two elements in the DOM at once here instead of the whole deck. */
function renderSlide(entry){
  var el = document.createElement('div');
  el.className = 'slide' + (entry.welcome ? ' welcome' : ' anec');
  var inner = '';
  if (entry.bg) inner += '<div class="bg" style="background-image:url(\'' + entry.bg + '\')"></div><div class="veil"></div>';
  inner += entry.html;
  el.innerHTML = inner;
  deck.appendChild(el);
  void el.offsetWidth; // force reflow before adding .on, or the transition won't fire

  var prev = liveEl;
  el.classList.add('on');
  if (prev) prev.classList.remove('on');
  liveEl = el;

  if (prev) setTimeout(function(){ prev.remove(); }, 2200); // a bit past --fade
}

/* Randy: welcome should dominate ("come back to that one a lot"); ChatGPT's
   structure (relayed): welcome ~50s, one vignette ~14s (or its own
   override), back to welcome, repeat — never two vignettes back to back.
   That puts welcome at roughly 75–80% of total screen time. */
function loop(){
  renderSlide({ welcome: true, bg: WELCOME.bg, html: WELCOME.html });
  setTimeout(function(){
    var v = nextVignette();
    renderSlide({ welcome: false, bg: v.bg, html: v.html });
    setTimeout(loop, (v.seconds ? v.seconds / SPEED : VIGNETTE_SECONDS) * 1000);
  }, WELCOME_SECONDS * 1000);
}
loop();
</script>
</body>
</html>
