  Arecaceae:'palm', Fabaceae:'pea', Euphorbiaceae:'spurge', Asteraceae:'daisy',
  Malvaceae:'mallow', Apocynaceae:'dogbane', Rubiaceae:'coffee', Ardeidae:'heron',
  Myrtaceae:'myrtle', Moraceae:'fig', Bromeliaceae:'bromeliad', Araceae:'arum',
  Acanthaceae:'acanthus', Lamiaceae:'mint', Anacardiaceae:'cashew',
  Annonaceae:'custard apple', Sapindaceae:'soapberry', Verbenaceae:'verbena',
  Cactaceae:'cactus', Zingiberaceae:'ginger', Musaceae:'banana', Poaceae:'grass',
  Nymphaeaceae:'water lily', Cycadaceae:'cycad', Zamiaceae:'zamia',
  Amaryllidaceae:'amaryllis', Bignoniaceae:'trumpet-vine', Rutaceae:'citrus',
  Solanaceae:'nightshade', Passifloraceae:'passionflower', Nymphalidae:'brush-footed butterfly',
  Anatidae:'duck', Accipitridae:'hawk', Picidae:'woodpecker', Emberizidae:'sparrow'
};

var GROUPS = null;
function buildGroups(){
  var all = D.plants.concat(D.wildlife).filter(function(x){ return x.photo; });
  var g = [];

  function add(label, sub, rows){
    if(!label || rows.length < 6) return;
    /* the same set can arrive from two fields — keep the first label only */
    for(var i=0;i<g.length;i++) if(g[i].label === label) return;
    g.push({ label:label, sub:sub, rows:rows });
  }
  function by(field, fmt, sub){
    var m = {};
    all.forEach(function(x){ var k=x[field]; if(k) (m[k]=m[k]||[]).push(x); });
    for(var k in m){ var label = fmt(k); if(label) add(label, sub, m[k]); }
  }

  /* family — common name where we have one, and the Latin as the subtitle */
  var fams = {};
  all.forEach(function(x){ if(x.family) (fams[x.family]=fams[x.family]||[]).push(x); });
  for(var f in fams){
    var common = FAMILY_NAME[f];
    add(common ? 'The ' + common + ' family' : 'The ' + f + ' family',
        common ? f : 'in the collection', fams[f]);
  }

  by('form',     function(k){ return FORM_LABEL[k] || null; }, 'in the collection');
  by('cat',      function(k){ return k; }, 'in the collection');
  by('category', function(k){ return k; }, 'recorded here');

  add('Florida natives', 'growing here', all.filter(function(x){ return x.native; }));
  add('Nectar plants', 'for butterflies and bees', all.filter(function(x){ return x.nectar; }));
  add('Butterfly host plants', 'where caterpillars feed', all.filter(function(x){ return x.larval_host; }));
  add('Rare fruit', 'from the Rare Fruit Trail', all.filter(function(x){ return x.rare_fruit; }));
  return g;
}

function slideCollection(){
  if(!GROUPS) GROUPS = buildGroups();
  if(!GROUPS.length) return null;
  var g = takeFrom('collection', GROUPS, 1)[0];
  if(!g) return null;

  /* the panels are a fifth as wide as they are tall — exactly what a phone
     photograph is, and there are 846 of them */
  var shots = shuffle(preferOrient(g.rows, 'portrait', 8).slice()).slice(0,5);
  if(shots.length < 5) shots = shuffle(g.rows.slice()).slice(0,5);
  var names = shuffle(g.rows.slice()).slice(0,4)
                .map(function(x){ return x.common; }).filter(Boolean);
  var who = [];
  shots.forEach(function(x){
    var n = x.credit_name || x.credit;
    if(n && who.indexOf(n) < 0) who.push(n);
  });

  return {
    set:true,
    /* a fifth of the frame each — `large` is already more pixels than the
       panel can show, and five originals would be 20MB of wall */
    grid: shots.map(function(x){ return { src: fallbackPhoto(x) || BASE+x.photo, focus: x.focus }; }),
    seconds: Math.round(SECONDS * 1.15),
    html:
        '<div class="count">'+g.rows.length+'<small>'+esc(g.sub)+'</small></div>'
      + '<div class="headline">'+esc(g.label)+'</div>'
      + (names.length?'<div class="roster">'+esc(names.join('  ·  '))+'</div>':'')
      + (who.length?'<div class="shot">Photographs by '+esc(who.join(', '))+'</div>':'')
  };
}

/* Asks get the centred treatment and a dimmed photograph behind. */
function slideAsk(a){
  var pool = D.plants.filter(function(s){ return s.photo; });
  return {
    ask: !posterImage(a),
    poster: posterImage(a),
    bg: posterImage(a) ? null : (screenImage(a) || (pool.length ? BASE+pick(pool).photo : null)),
    credit:'',
    html:
      (logoBlock(a, a.logo_label || '') || (a.emoji?'<div class="emoji">'+a.emoji+'</div>':''))
    + '<div class="headline">'+esc(a.title)+'</div>'
    + (a.body?'<div class="body">'+rich(a.body)+'</div>':'')
    + (a.link_text?'<div class="meta"><span>'+esc(a.link_text)+'</span></div>':'')
    + qrBlock(a, 'Scan to open', a.link_url)
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   THE DECK
   Weighted, shuffled, no two consecutive slides of the same type, and an ask
   Feeds contribute by PERIOD, families are interleaved so none sit adjacent,
   and asks are spaced through. Rebuilt when exhausted, so the mix changes
   shape through the day rather than looping identically.
   ═══════════════════════════════════════════════════════════════════════════ */
/* FAIRNESS WITHIN A FEED
   Random sampling each cycle means a row can go unseen for a long stretch
   purely by luck. Every feed instead keeps a shuffled queue that is consumed
   in order and reshuffled only once exhausted, so every row gets its turn
   before any row gets a second.

   FAIRNESS BETWEEN FEEDS is the weights' job, and the weights are set as a
   PERIOD instead: "each row of this feed should come round about every N
   cycles". A feed with four rows and a period of four contributes one slide
   per cycle; fourteen announcements on the same period contribute three or
   four. That is what stops a lone news item outplaying every announcement. */
var queues = {};
function takeFrom(name, rows, n){
  if(!rows || !rows.length) return [];
  var q = queues[name];
  if(!q || q.at >= q.list.length) q = queues[name] = { list: shuffle(rows.slice()), at: 0 };
  var out = [];
  while(out.length < n){
    if(q.at >= q.list.length) q = queues[name] = { list: shuffle(rows.slice()), at: 0 };
    out.push(q.list[q.at++]);
    if(out.length >= rows.length) break;      /* never repeat inside one cycle */
  }
  return out;
}
function nextAsk(){ return takeFrom('ask', D.announcements, 1)[0]; }

/* SPREADING THE FAMILIES
   Take whichever family has the most left, and the LARGEST family gets placed
   first and most often — so it front-loads the deck and the smallest families
   pile up at the end. With eight schedule slides and four quiet ones, the
   opening ran event, something, event, something, and the ambient and
   collection slides never arrived until the tail. Avoiding adjacency is not
   the same as spreading out.

   So: give every family evenly-spaced ideal positions across the whole deck —
   a family with n slides in a deck of N wants positions (i + ½)·N/n — and
   settle each into the nearest free slot. Large or small, every family is now
   distributed across the entire rotation rather than clustered in part of it. */
function interleave(items){
  var buckets = {}, k, i;
  for(i=0;i<items.length;i++){
    k = famOf(items[i]);
    (buckets[k] = buckets[k] || []).push(items[i]);
  }
  for(k in buckets) shuffle(buckets[k]);

  var N = items.length, slots = new Array(N);
  /* biggest first: it has the least room to move, so let it claim its ideal
     positions before the smaller families fill in around it */
  var keys = Object.keys(buckets).sort(function(a,b){
    return buckets[b].length - buckets[a].length;
  });

  keys.forEach(function(key){
    var rows = buckets[key], n = rows.length;
    rows.forEach(function(item, idx){
      var ideal = Math.floor((idx + 0.5) * N / n);
      var at = -1;
      for(var d=0; d<N; d++){                     /* nearest free slot, either way */
        if(ideal-d >= 0 && !slots[ideal-d]){ at = ideal-d; break; }
        if(ideal+d <  N && !slots[ideal+d]){ at = ideal+d; break; }
      }
      if(at >= 0) slots[at] = item;
    });
  });

  var out = slots.filter(Boolean);

  /* an even spread can still leave the odd neighbouring pair — nudge those */
  for(i=1;i<out.length;i++){
    if(famOf(out[i]) !== famOf(out[i-1])) continue;
    for(var j=i+2;j<out.length;j++){
      if(famOf(out[j]) === famOf(out[i-1])) continue;
      if(j+1 < out.length && famOf(out[j+1]) === famOf(out[i])) continue;
      if(famOf(out[j-1]) === famOf(out[i])) continue;
      var t = out[i]; out[i] = out[j]; out[j] = t; break;
    }
  }
  return out;
}

var cycle = 0;
function buildDeck(){
  cycle++;
  var pool=[], i;
  function add(type,rows,fn){
    if(!rows || !rows.length) return;
    var n = Math.ceil(rows.length / (PERIOD[type] || 3));
    n = Math.max(1, Math.min(n, CAP[type] || 3, rows.length));
    var picks = takeFrom(type, rows, n);
    for(var p=0;p<picks.length;p++) pool.push({type:type,make:fn.bind(null,picks[p])});
  }

  add('right_now',  D.right_now,              slideRightNow);
  add('event',      upcoming(D.events),       slideEvent);
  add('news',       D.news.slice().reverse(), slideNews);
  add('klass',      D.classes,                slideClass);
  add('series',     D.series,                 slideSeries);
  add('volunteer',  D.volunteer,              slideVolunteer);
  add('newsletter', D.newsletters,            slideNewsletter);
  for(i=0;i<SPOTLIGHTS;i++)  pool.push({type:'spotlight', make:slideSpotlight});
  for(i=0;i<AMBIENTS;i++)    pool.push({type:'ambient',   make:slideAmbient});
  for(i=0;i<COLLECTIONS;i++) pool.push({type:'collection',make:slideCollection});
  for(i=0;i<WEEKVIEWS;i++)   pool.push({type:'week',      make:slideWeek});
  /* Special slides lose their occasion if they turn up every seven minutes.
     Once every third cycle is about twenty minutes apart. */
  if(cycle % 3 === 1) for(i=0;i<COHORTS;i++) pool.push({type:'cohort', make:slideCohort});

  pool = interleave(pool);

  /* Asks, spaced evenly through the deck.
     Count is proportional, never zero — a fixed "every 7th slide" silently
     produced NO asks whenever the deck was shorter than 7, which is exactly
     what happens when most Sheet rows are marked web-only. */
  if(D.announcements.length){
    var want = Math.max(1, Math.min(
      Math.ceil(D.announcements.length / (PERIOD.ask || 4)),
      Math.ceil(pool.length / 4)));   /* never more than a quarter of the deck —
                                         the screen is mostly beauty, and an ask
                                         every third slide is how you lose people */
    var gap  = Math.max(1, Math.floor(pool.length / want));
    var out=[];
    for(i=0;i<pool.length;i++){
      out.push(pool[i]);
      if((i+1) % gap === 0 && out.filter(function(x){return x.type==='ask';}).length < want){
        out.push({type:'ask', make:slideAsk.bind(null, nextAsk())});
      }
    }
    pool=out;
  }
  return pool.length ? pool : [{type:'spotlight',make:slideSpotlight}];
}

/* Wrap every word in its own span, measure which rendered line each landed on,
   then stagger by line. Walking text nodes rather than rewriting innerHTML
   keeps the <b> emphasis the writers put in the quick hits. */
var LINE_STEP = 0.42 / SPEED;   /* seconds between lines */
var LINE_LEAD = 0.25 / SPEED;   /* before the first one */

function cascade(el){
  if(!el) return;
  var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  var nodes = [], n;
  while((n = walker.nextNode())) if(n.nodeValue.trim()) nodes.push(n);

  for(var i=0;i<nodes.length;i++){
    var frag = document.createDocumentFragment();
    var parts = nodes[i].nodeValue.split(/(\s+)/);
    for(var j=0;j<parts.length;j++){
      if(!parts[j]) continue;
      if(/^\s+$/.test(parts[j])){ frag.appendChild(document.createTextNode(parts[j])); }
      else {
        var w = document.createElement('span');
        w.className='w'; w.textContent=parts[j];
        frag.appendChild(w);
      }
    }
    nodes[i].parentNode.replaceChild(frag, nodes[i]);
  }

  /* group by vertical position — that's what a "line" actually is */
  var words = el.querySelectorAll('.w'), line = -1, top = null;
  for(var k=0;k<words.length;k++){
    var t = words[k].offsetTop;
    if(top === null || Math.abs(t - top) > 4){ line++; top = t; }
    words[k].style.transitionDelay = (LINE_LEAD + line*LINE_STEP).toFixed(2)+'s';
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   PLAYER
   ═══════════════════════════════════════════════════════════════════════════ */
var stage=document.getElementById('stage'), bar=document.getElementById('bar');
var credEl=document.getElementById('credit');
var deck=[], at=0, cur=null, timer=null, revealTimer=null, beatTimers=[];

var KB = ['kb-in','kb-out','kb-left','kb-right','kb-rise','kb-settle'];
var lastKB = '';

function render(s){
  var dur = s.seconds || SECONDS;
  var el=document.createElement('div');
  el.className='slide'+(s.ask?' ask':'')+(s.atmos?' atmos':'')+(s.poster?' poster':'')
             +(s.ambient?' ambient':'')+(s.set?' set':'')+(s.week?' week-slide':'')+(s.pile?' pile-slide':'');

  /* pick a motion, never the same one twice running */
  var moves = KB.filter(function(k){ return k!==lastKB; });
  var kb = pick(moves); lastKB = kb;

  /* the curated focus point, straight from the search index */
  var pos = s.focus ? ' style="object-position:'+s.focus.replace(/"/g,'')+'"' : '';

  var grid = '';
  if(s.grid){
    grid = '<div class="collection">';
    for(var gi=0; gi<s.grid.length; gi++){
      grid += '<div><img alt="" src="'+s.grid[gi].src+'"'
            + (s.grid[gi].focus?' style="object-position:'+s.grid[gi].focus.replace(/"/g,'')+'"':'')
            + '></div>';
    }
    grid += '</div>';
  }

  var pile = '';
  if(s.pile){
    pile = '<div class="pile">';
    for(var pi=0; pi<s.pile.length; pi++){
      var c = s.pile[pi];
      pile += '<div class="pola" style="left:'+c.x+'%;top:'+c.y+'%;--r:'+c.r+'deg;'
            + 'z-index:'+(10+pi)+';animation-delay:'+c.delay+'s">'
            + '<img alt="" src="'+c.src+'"></div>';
    }
    pile += '</div>';
  }

  el.innerHTML = grid + pile
    + (s.grid ? '<div class="veil"></div>' : '')
    + '<div class="bg">'+(s.bg
        ? '<img class="'+kb+'" alt=""'+pos+' src="'+s.bg+'"'
          + (s.bgFallback && s.bgFallback !== s.bg
              ? ' data-fb="'+s.bgFallback+'" onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb=\'\'}"'
              : '') + '>'
        : '')+'</div>'
    + '<div class="scrim"></div>'
    + '<div class="copy">'+s.html+'</div>'
    + (s.poster?'<div class="poster-art"><img alt="" src="'+s.poster+'"></div>':'');

  /* .copy is position:relative, so a QR left inside it anchors to the text
     column and lands mid-paragraph. Lift it out to sit against the slide.
     On an ask it belongs in the flow, centred under the words — leave it. */
  var qrNode = el.querySelector('.qr');
  if(qrNode && !s.ask && !s.poster){ el.appendChild(qrNode); el.classList.add('has-qr'); }
  el.style.setProperty('--kb', (dur+3)+'s');

  /* step each body down by length so nothing is ever clipped */
  var bodies = el.querySelectorAll('.body'), longest = 0, bi;
  for(bi=0;bi<bodies.length;bi++){
    var n = (bodies[bi].textContent||'').length;
    if(n > 300)      bodies[bi].classList.add('len-3');
    else if(n > 175) bodies[bi].classList.add('len-2');
    if(n > longest) longest = n;
  }
  if(longest > 175 && el.querySelector('.copy')) el.querySelector('.copy').classList.add('tall');

  stage.appendChild(el);

  /* Beats are absolutely stacked, so the container has to reserve the height of
     the taller one or the slide jumps at the turn. Measure after append. */
  var beats = el.querySelector('.beats');
  if(beats){
    var kids = beats.querySelectorAll('.beat'), h = 0, k;
    for(k=0;k<kids.length;k++) h = Math.max(h, kids[k].offsetHeight);
    beats.style.minHeight = Math.max(h, 1) + 'px';
  }

  sizeLogos(el);

  /* split into lines once the type has actually laid out */
  var texts = el.querySelectorAll('.body');
  for(var ti=0; ti<texts.length; ti++) cascade(texts[ti]);

  /* let the browser paint at opacity 0 before fading in */
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    el.classList.add('on');
  });});

  /* Timing. One body: it arrives a little under halfway.
     Two beats: the note lands early, the fact turns over it past the middle,
     leaving each with room to be read rather than glimpsed. */
  clearTimeout(revealTimer); beatTimers.forEach(clearTimeout); beatTimers=[];
  var beatEls = el.querySelectorAll('.beat');
  if(beatEls.length > 1){
    /* Beats share the slide evenly after a short lead. Two on a Right Now,
       three or four on a news story — same mechanism either way. */
    var lead = 1400 / SPEED;
    var share = Math.max(2600 / SPEED, (dur*1000 - lead) / beatEls.length);
    revealTimer = setTimeout(function(){ el.classList.add('reveal'); }, lead);
    (function(){
      for(var bn=0; bn<beatEls.length; bn++){
        beatTimers.push(setTimeout((function(idx){ return function(){
          for(var q=0;q<beatEls.length;q++){
            if(q < idx){ beatEls[q].classList.remove('on'); beatEls[q].classList.add('spent'); }
            else if(q === idx){ beatEls[q].classList.remove('spent'); beatEls[q].classList.add('on'); }
          }
        };})(bn), lead + bn*share));
      }
    })();
  } else {
    revealTimer = setTimeout(function(){ el.classList.add('reveal'); }, 1400 / SPEED);
  }

  if(cur){
    var old=cur; old.classList.remove('on');
    setTimeout(function(){ old.remove(); }, 1400 / SPEED);
  }
  cur=el;

  if(s.credit && s.credit.name){
    credEl.innerHTML =
        '<span class="lbl">Photograph</span>'
      + '<span class="who">'+esc(s.credit.name)+'</span>'
      + (s.credit.terms?'<span class="terms">'+esc(s.credit.terms)+'</span>':'');
    credEl.classList.add('on');
  } else {
    credEl.classList.remove('on');
  }

  bar.style.transition='none'; bar.style.width='0';
  requestAnimationFrame(function(){
    bar.style.transition='width '+dur+'s linear';
    bar.style.width='100%';
  });
  return dur;
}

/* A LOOP, NOT RECURSION.
   Skipping an empty slide used to be `return next()`, which is fine while
   something in the deck still builds — but if EVERY builder returns null the
   deck is walked, rebuilt, and walked again with nothing to stop it, so the
   stack overflows and the wall goes black. It takes a narrow state to reach:
   no species carrying a photo AND every feed empty or web-only, which slips
   past fallback() because that only fires when right_now and plants are BOTH
   empty. Narrow, but the failure is total, on a screen nobody is watching.

   So: iterate, allow one rebuild, and if a whole fresh deck yields nothing,
   hold what is on screen and try again on the next turn. The feeds reload
   every ten minutes, so a transient outage recovers by itself and the worst
   case is a stale slide rather than a dead one. */
function next(){
  var s = null, item = null, rebuilds = 0;
  while(s === null){
    if(at >= deck.length){
      if(++rebuilds > 1){
        console.error('screen.html: no slide could be built from a full deck — '
                    + 'holding, will retry. Check the feeds loaded.');
        timer = setTimeout(next, SECONDS * 1000);
        return;
      }
      deck = buildDeck(); at = 0;
    }
    item = deck[at++];
    try{ s = item.make(); }
    catch(e){
      /* A builder that throws used to be indistinguishable from one that had
         nothing to show, so a broken slide type vanished from the rotation in
         silence — every species slide disappeared for a whole evening that way.
         Skip it, but say so. */
      console.error('screen.html: ' + item.type + ' slide failed —', e && e.message, e);
      s = null;
    }
  }
  var dur = render(s);
  timer=setTimeout(next, dur*1000);
}

function tickClock(){
  var d=new Date();
  document.getElementById('clock').innerHTML =
      '<span class="day">'
    + d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})
    + '</span><span class="sep">&middot;</span>'
    + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

/* ── kiosk housekeeping ──────────────────────────────────────────────────
   Refresh the data every 10 minutes so a Sheet edit reaches the wall without
   anyone touching the TV, and do a hard reload in the small hours to clear
   any long-running drift. */
function start(){
  var root = document.documentElement.style;
  root.setProperty('--sp', SPEED);
  root.setProperty('--fade', (1.1 / SPEED).toFixed(3) + 's');
  root.setProperty('--turn', (0.85 / SPEED).toFixed(3) + 's');
  if(SPEED !== 1) console.log('screen.html running at ' + SPEED + '× — ' + SECONDS.toFixed(1) + 's per slide');

  deck=buildDeck(); at=0; next();
  tickClock(); setInterval(tickClock, 20000);

  /* SCALED BY SPEED, so ?speed= is a time warp and not just a fast-forward.
     Everything else already divides by SPEED — SECONDS, the beat cascade, the
     slide turn — but this timer was hardcoded, so a fast run could exercise the
     ROTATION and never the RELOAD.

     That gap is exactly what hid the BY_SHOOTER accumulation bug: on a fast run
     the cohort slide reported 298 photographs every time and looked right,
     because a second fetch never happened. It only misbehaved on a wall that
     had been up for twenty real minutes.

     At speed=1 (the TV) this is unchanged at ten minutes. At speed=10 the feeds
     reload every minute, so a five-minute test covers five refresh cycles. Do
     not leave a high speed running against GitHub Pages for long — fourteen
     files per cycle adds up.

     To check an accumulator by hand instead, in the console:
       loadAll().then(function(){ console.log(
         Object.values(BY_SHOOTER).reduce(function(n,a){return n+a.length},0)); });
     Run it twice. 1046 both times is correct; 2092 on the second is a leak.

     NOT scaled: the 4am reload below, which is gated on the real wall clock. */
  setInterval(function(){
    loadAll().then(function(){
      /* derived from the feeds, so they go stale with them */
      GROUPS = null;
      queues = {};
    }).catch(function(){});
  }, (10*60*1000) / SPEED);

  setInterval(function(){
    var h=new Date().getHours();
    if(h===4) location.reload();
  }, 30*60*1000);

  /* keep the display awake where the browser allows it */
  if('wakeLock' in navigator){
    navigator.wakeLock.request('screen').catch(function(){});
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState==='visible')
        navigator.wakeLock.request('screen').catch(function(){});
    });
  }
}

loadAll().then(start).catch(function(){ fallback(); start(); });
</script>
</body>
</html>
