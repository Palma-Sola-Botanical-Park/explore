<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palma Sola Botanical Park</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">

<!--
  ═══════════════════════════════════════════════════════════════════════════
  screen.html — the display on the galleria / office TV
  ═══════════════════════════════════════════════════════════════════════════

  READ SCREEN.md FIRST if you want the manual: Sheet columns, slide formats,
  tuning dials, kiosk setup. This header is the orientation for someone about
  to edit this file.

  ───────────────────────────────────────────────────────────────────────────
  WHAT IT IS
  ───────────────────────────────────────────────────────────────────────────
  One HTML file, no build step, no dependencies beyond two Google fonts. Open
  it full-screen on a TV and leave it. It reads the same published JSON feeds
  that drive the website, filtered to display ∈ {screen, both}, and rotates
  through them. Data refreshes every 10 minutes; the page hard-reloads at 4am.

      screen.html                   galleria (default)
      screen.html?mode=office       office mix
      screen.html?mode=anything     a new screen; own routing, galleria mix
      screen.html?speed=5           five times faster, for reviewing
      screen.html?seconds=24        override the per-slide dwell

  ───────────────────────────────────────────────────────────────────────────
  THE THREE IDEAS IT IS BUILT ON
  ───────────────────────────────────────────────────────────────────────────
  1. A SCREEN HAS NO VIEWER. Nobody is watching when the slide changes; they
     glance up mid-rotation. Every slide is complete on its own — no build-up,
     no callback, no punchline that depends on the slide before. Fewer words,
     much bigger, readable across a room.

  2. THE TEST FOR SCREEN CONTENT: does this only make sense because you are
     standing in the park? `right_now.area` rides in the eyebrow as
     "BLOOMING NOW → SERENITY GARDEN" — a label on the web, an instruction to
     walk here. Anything that reads the same from a sofa in Ohio belongs on
     the website.

  3. THE ASK IS OCCASIONAL. The screen is mostly beauty and interest; a
     donation slide every third turn is how you lose people. Asks are capped at
     a quarter of the deck and spaced.

  ───────────────────────────────────────────────────────────────────────────
  HOW THE ROTATION IS BUILT  (buildDeck → interleave → next)
  ───────────────────────────────────────────────────────────────────────────
  Four constraints that actively fight each other, each handled separately:

    COMPLETENESS   every announcement seen, every quick hit used
                   → rotating queues (takeFrom, rotate)
    PROPORTION     one news item must not outplay fourteen announcements
                   → PERIOD: "each row of this feed comes round every N cycles",
                     so slides-per-cycle = ceil(rows / period), capped by CAP
    DISTRIBUTION   no clumping, no family stranded at the end of the deck
                   → interleave(): every family gets evenly spaced ideal
                     positions across the WHOLE deck. Note: an earlier greedy
                     version avoided adjacency but front-loaded the largest
                     family and pushed small ones to the tail. Avoiding
                     adjacency and spreading out are different problems.
    SURPRISE       the visitor should not be able to predict what is next
                   → shuffling within all of the above

  Structure decides what is in the deck and roughly where; randomness decides
  which ones and in what order. Neither alone works — pure randomness clumps,
  pure structure becomes a pattern.

  ───────────────────────────────────────────────────────────────────────────
  WHERE THE DATA COMES FROM
  ───────────────────────────────────────────────────────────────────────────
    data/published/*.json      Bev's Sheet, synced by a GitHub Action.
                               events, classes, series, news, newsletters,
                               announcements, volunteer, right_now
    plants.json                the search index — light, has photo, focus,
    wildlife.json              page, credit, family, form, native, and the
                               boolean flags the collection slides group by
    data/sources/
      photo_credits.json       photographer, licence, observed_on, and (since
                               08-21) w / h / orient
      plant_signage.json       the QUICK HITS come from here, not from the
      wildlife_signage.json    index — see the note at hitsOf()
      photographer_names.json  display names + the `note` field, which is how
                               the Bright Futures cohort slide finds its crew

  ───────────────────────────────────────────────────────────────────────────
  DECISIONS WORTH NOT RE-LITIGATING
  ───────────────────────────────────────────────────────────────────────────
  · NO QR ON SPECIES SLIDES. The reader is standing in front of the plant;
    sending them to a web page about it is worse than looking up. QRs are for
    registration, articles, flyers.
  · QUICK HITS COME FROM THE SIGNAGE MASTERS. The search index flattens the
    array into one space-joined string for search scoring, and 47% of hits run
    to more than one sentence — splitting on sentences tore them in half.
  · BLUR WAS REJECTED for text legibility. A softened photograph reads as a
    mistake; darkening reads as a shadow. See .veil.
  · ONE HORIZONTAL DARKENER PER SLIDE. Two stacked gradients multiply and turn
    the first panel black. .veil owns the horizontal, .scrim owns the vertical.
  · PORTRAITS TO TALL PANELS, LANDSCAPES TO WIDE SLIDES. 846 of the photos are
    portrait against a 16:9 screen. See preferOrient().
  · FULL-BLEED SLIDES PULL `original` FROM iNATURALIST. The local hero files
    are deliberately shrunk for page weight; a wall wants the opposite.

  ───────────────────────────────────────────────────────────────────────────
  THE TRAP THAT COST AN EVENING
  ───────────────────────────────────────────────────────────────────────────
  next() catches exceptions per slide, so one broken format cannot take the
  whole wall down. That is right — but it means a builder that throws is
  indistinguishable from one that simply has nothing to show. A missing helper
  function silently removed SIX of the thirteen formats, and the symptom was
  "the mix feels event-heavy," not a crash.

  Failures now log to the console with the slide type. IF THE ROTATION LOOKS
  WRONG, OPEN THE CONSOLE BEFORE TOUCHING ANY WEIGHTS.

  ───────────────────────────────────────────────────────────────────────────
  ADDING A SLIDE FORMAT
  ───────────────────────────────────────────────────────────────────────────
  1. Write slideThing() returning {html, bg?, poster?, grid?, pile?, credit?,
     seconds?} or null when it has nothing to show.
  2. Add it to PERIOD/CAP (feed-driven) or push a fixed count in buildDeck().
  3. Give it a FAMILY — formats that LOOK alike share one, so they never sit
     adjacent. ambient and collection are both 'quiet'.
  4. If it consumes more than one row, the period accounting does not apply;
     handle it like slideWeek() does.
  ═══════════════════════════════════════════════════════════════════════════
-->
<style>
:root{
  /* Ground — a botanical dark, not a tech dark. Pulled from --green-ink and
     deepened, so it still reads as the park's green under a lit room. */
  --ground:#0c1a10; --ground-2:#122316; --veil:rgba(8,18,9,.55);
  /* Inherited from psbp.css, unchanged */
  --gold:#eabc5a; --gold-deep:#c5922a; --paper:#fdfcf8;
  --ink-invert:rgba(253,252,248,.78); --ink-quiet:rgba(253,252,248,.52);
  --rule:rgba(234,188,90,.34);
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Source Sans 3',-apple-system,'Segoe UI',sans-serif;
  --fade:1.1s;              /* cross-fade between slides — scaled by ?speed */
  --turn:.85s;              /* beat turn within a slide */
  --frame:2.6vmin;          /* inset of the gold frame */
  --pad:4.4vmin;            /* everything inside it shares this margin, so the
                               wordmark, the copy, the credit and the poster
                               all sit on the same two lines */
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ground)}
body{
  font-family:var(--sans);color:var(--paper);
  cursor:none;                       /* kiosk: no pointer on a wall display */
  -webkit-font-smoothing:antialiased;
}

/* ── the frame ───────────────────────────────────────────────────────────
   One device, drawn once, persists across every slide. */
.frame{
  position:fixed;inset:var(--frame);border:1px solid var(--rule);
  pointer-events:none;z-index:40;
}
.wordmark{
  position:fixed;top:calc(var(--frame) - .95em);left:calc(var(--frame) + var(--pad));
  z-index:41;background:var(--ground);padding:0 1.8vmin;
  font-size:2.5vmin;font-weight:700;letter-spacing:.3em;text-transform:uppercase;
  color:var(--gold);white-space:nowrap;
}
.clock{
  position:fixed;top:calc(var(--frame) - .95em);right:calc(var(--frame) + var(--pad));
  z-index:41;background:var(--ground);padding:0 1.8vmin;
  font-size:2.5vmin;font-weight:600;letter-spacing:.16em;
  color:var(--paper);white-space:nowrap;
}
/* The date earns its place: it's what tells a visitor that TODAY and TOMORROW
   on an event slide mean what they say. Set quieter than the time, which is
   the thing anyone actually glances up for. */
.clock .day{opacity:.6;text-transform:uppercase;letter-spacing:.2em;font-size:.86em}
.clock .sep{color:var(--gold);opacity:.55;margin:0 .7em}
/* Attribution is solidarity — so it gets real size, a name in paper white, and
   the licence and date underneath. Sits inside the frame rather than breaking
   the rule, because it is now three lines rather than a caption. */
.credit{
  position:fixed;right:calc(var(--frame) + var(--pad));bottom:calc(var(--frame) + 3.2vmin);
  z-index:41;text-align:right;opacity:0;transition:opacity .8s;
  text-shadow:0 1px 14px rgba(0,0,0,.6);
}
.credit.on{opacity:1}
.credit .lbl{
  display:block;font-size:1.25vmin;font-weight:700;letter-spacing:.34em;
  text-transform:uppercase;color:var(--gold);margin-bottom:.35vmin;
}
.credit .who{
  display:block;font-family:var(--serif);font-size:2.6vmin;font-weight:700;
  line-height:1.1;color:var(--paper);
}
.credit .terms{
  display:block;font-size:1.4vmin;font-weight:600;letter-spacing:.14em;
  color:var(--ink-quiet);margin-top:.5vmin;
}

/* ── stage ───────────────────────────────────────────────────────────────── */
#stage{position:fixed;inset:0;z-index:1}
.slide{
  position:absolute;inset:0;opacity:0;transition:opacity var(--fade) ease;
  display:flex;align-items:flex-end;
}
.slide.on{opacity:1}

.bg{position:absolute;inset:0;overflow:hidden;background:var(--ground-2)}
/* Ken Burns, six ways.
   object-position carries the curated `focus` point from the search index, so
   the motion never drifts off the interesting part of the plant — the
   Madagascar Palm problem is a focus problem, not a crop problem. Translations
   stay under 2% for the same reason. */
.bg img{
  width:100%;height:100%;object-fit:cover;
  will-change:transform;
}
.slide.on .bg img{ animation-duration:var(--kb,24s); animation-timing-function:linear;
                   animation-fill-mode:both; }
.slide.on .bg img.kb-in     { animation-name:kbIn }
.slide.on .bg img.kb-out    { animation-name:kbOut }
.slide.on .bg img.kb-left   { animation-name:kbLeft }
.slide.on .bg img.kb-right  { animation-name:kbRight }
.slide.on .bg img.kb-rise   { animation-name:kbRise }
.slide.on .bg img.kb-settle { animation-name:kbSettle }
@keyframes kbIn     { from{transform:scale(1.04)} to{transform:scale(1.13)} }
@keyframes kbOut    { from{transform:scale(1.13)} to{transform:scale(1.04)} }
@keyframes kbLeft   { from{transform:scale(1.10) translateX(1.6%)}  to{transform:scale(1.10) translateX(-1.6%)} }
@keyframes kbRight  { from{transform:scale(1.10) translateX(-1.6%)} to{transform:scale(1.10) translateX(1.6%)} }
@keyframes kbRise   { from{transform:scale(1.11) translateY(1.8%)}  to{transform:scale(1.11) translateY(-1.8%)} }
@keyframes kbSettle { from{transform:scale(1.11) translateY(-1.8%)} to{transform:scale(1.11) translateY(1.8%)} }
.scrim{
  position:absolute;inset:0;
  background:
    linear-gradient(to top,rgba(8,18,9,.94) 0%,rgba(8,18,9,.72) 26%,
                    rgba(8,18,9,.30) 56%,rgba(8,18,9,.06) 80%),
    linear-gradient(to right,rgba(8,18,9,.72) 0%,rgba(8,18,9,.10) 55%,transparent 78%);
}

.copy{
  position:relative;z-index:3;
  padding:0 0 8.5vmin calc(var(--frame) + var(--pad));
  max-width:72vw;
}
/* The eyebrow carries the location now. Splitting "Blooming now" from "Near
   Office" put the two halves of one thought at opposite ends of the screen,
   and both ended up too small to read across a room. One line, bigger. */
.eyebrow{
  font-size:clamp(1.15rem,3.1vmin,2.6rem);font-weight:700;letter-spacing:.24em;
  text-transform:uppercase;color:var(--gold);margin-bottom:1.8vmin;
  display:flex;align-items:baseline;flex-wrap:wrap;gap:0 1.1em;
}
.eyebrow .where{color:var(--gold);opacity:.92;white-space:nowrap}
.eyebrow .where::before{content:'→';margin-right:.42em;opacity:.75}
.eyebrow .where.plain::before{content:'·';opacity:.5}
.headline{
  font-family:var(--serif);font-weight:700;line-height:1.02;
  font-size:clamp(2.6rem,7.4vmin,7rem);letter-spacing:-.012em;
  text-shadow:0 2px 26px rgba(0,0,0,.45);
  /* Break display type into even lines rather than filling each one to the
     edge. "Fall Plant & Garden / Festival" becomes "Fall Plant & / Garden
     Festival". Ignored by browsers that don't know it, which just fall back
     to the ragged break. */
  text-wrap:balance;
}
.subhead{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(1.05rem,2.85vmin,2.3rem);color:var(--paper);
  margin-top:1vmin;max-width:40ch;line-height:1.25;
}
.latin{
  font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:clamp(1.1rem,2.9vmin,2.4rem);color:var(--ink-invert);
  margin-top:.7vmin;
}
/* The body arrives after the name has had a moment alone. On a screen nobody
   is watching at the cut — the late reveal gives the eye a second reason to
   come back to a slide it has already glanced at.

   Sizing: the copy block bottom-aligns, so anything too tall overflows off the
   TOP and gets clipped. Rather than truncate a quick hit — they're the best
   writing in the whole catalog — the text steps down a size as it gets longer,
   and the measure widens so long hits use the room instead of stacking. */
.body{
  font-size:clamp(1rem,2.6vmin,2.05rem);line-height:1.5;font-weight:300;
  color:var(--ink-invert);margin-top:2.4vmin;max-width:52ch;
  /* No reserved height. The element sits in the layout whether or not it has
     faded in, so nothing below it moves — and reserving three lines for a
     one-line description punched a visible hole above the meta row. The beats
     container still reserves height, because ITS children are absolute. */
  opacity:0;transform:translateY(1.1vmin);
  transition:opacity 1.15s ease,transform 1.15s ease;
}
.body.len-2{font-size:clamp(.95rem,2.3vmin,1.8rem);max-width:58ch}
.body.len-3{font-size:clamp(.9rem,2.05vmin,1.6rem);max-width:64ch;line-height:1.45}
.slide.reveal .body:not(.beat){opacity:1;transform:none}
.slide.reveal .body:not(.beat) .w{opacity:1;transform:none}

/* TWO BEATS
   A Right Now slide has two things to say and they are not the same kind of
   thing. The note is us talking about this week — timely, particular, written
   by a person who just walked past it. The quick hit is the catalog talking —
   durable, factual, and there are three or four of them, so the slide says
   something different every time it comes round.

   Beat one holds. Beat two turns over it. The hairline marks the change of
   voice: no rule is us, gold rule is the catalog. */
.beats{position:relative}
.beat{
  position:absolute;left:0;top:0;right:0;
  opacity:0;transform:translateY(1.2vmin);
  transition:opacity var(--turn) ease,transform var(--turn) ease;
}
.beat.on{opacity:1;transform:none}
.beat.spent{
  opacity:0;transform:translateY(-1.4vmin) scale(.985);filter:blur(5px);
  transition:opacity var(--turn) ease,transform var(--turn) ease,filter var(--turn) ease;
}
.beat.fact{
  padding-left:2.2vmin;border-left:2px solid var(--gold);
  margin-left:-2.4vmin;                 /* rule sits outside the text column */
}
.beats .beat{min-height:0}

/* LINE CASCADE
   Words are wrapped and grouped by the line they landed on, then each line
   gets a delay. The paragraph writes itself on rather than appearing whole.

   Deliberately quick — about half a second between lines. A reader finishes a
   line in roughly a second, so a slow drip leaves them waiting on an unfinished
   sentence, which reads as being held up rather than as movement. The cascade
   is there to catch the eye, not to set the reading pace. */
.w{
  display:inline-block;opacity:0;transform:translateY(.6vmin);
  transition:opacity calc(.55s / var(--sp,1)) ease,transform calc(.55s / var(--sp,1)) ease;
}
.on .w,.body.shown .w{opacity:1;transform:none}

/* A long hit also wants a little of the bottom padding back. */
.copy.tall{padding-bottom:6vmin}
.slide.ask .body{min-height:0}
.body b,.body strong{font-weight:600;color:var(--paper)}
.meta{
  display:flex;gap:3.4vmin;flex-wrap:wrap;margin-top:3vmin;
  font-size:1.95vmin;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);
}
.meta span{white-space:nowrap}

/* ── the date stamp ──────────────────────────────────────────────────────
   An event's most characteristic fact is WHEN, and a wall of title-plus-
   paragraph never says it loudly. The stamp is a calendar tear-off: the day
   carried at display size with the weekday and month set against it. TODAY and
   TOMORROW replace the numeral outright, because on a screen in the park those
   are the only two words that change what somebody does next. */
.stamp{display:flex;align-items:center;gap:2vmin;margin-bottom:3.4vmin}
.stamp .num{
  font-family:var(--serif);font-weight:700;line-height:.86;
  font-size:clamp(2.6rem,9.5vmin,8rem);color:var(--gold);
  letter-spacing:-.02em;
}
.stamp .num.word{font-size:clamp(1.8rem,6.4vmin,5rem);letter-spacing:-.01em}
.stamp .when{display:flex;flex-direction:column;gap:.35vmin}
.stamp .dow{
  font-size:clamp(1rem,2.7vmin,2.2rem);font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--paper);
}
.stamp .sub{
  font-size:clamp(.85rem,2.1vmin,1.7rem);font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-quiet);
}

/* Atmosphere, not illustration. When a slide has no picture of its own, a
   photograph from the collection sits behind it — blurred and dimmed enough to
   read as texture rather than as a claim about the subject. Still credited. */
.slide.atmos .bg img{opacity:.52;filter:blur(2px) saturate(.78)}
/* Darken hard where the words are, then let go. A flat veil across the whole
   frame was what made these read as black rectangles — the photo needs
   somewhere to actually be seen. */
.slide.atmos .scrim{
  background:
    linear-gradient(to top,rgba(8,18,9,.90) 0%,rgba(8,18,9,.62) 32%,
                    rgba(8,18,9,.28) 68%,rgba(8,18,9,.14) 100%),
    linear-gradient(to right,rgba(8,18,9,.74) 0%,rgba(8,18,9,.20) 50%,
                    rgba(8,18,9,0) 74%);
}

/* ── POSTER ──────────────────────────────────────────────────────────────
   A flyer is not a background. It is portrait, it is dense, and every fact is
   already set into it — crop it to 16:9 and the pricing strip falls off the
   bottom. So it is shown WHOLE, as an object hung beside the text, and the
   copy column narrows to make room. The screen supplies only what a poster
   can't: how soon it is, and something to scan. */
/* Both halves are content, so lay them out as a pair rather than pinning one
   to each edge. Anchored to opposite margins, a short headline and a
   height-limited poster left a hole down the middle; centred with a fixed gap,
   they close on each other symmetrically. */
.slide.poster{
  display:flex;align-items:center;justify-content:center;gap:5.5vmin;
  padding:calc(var(--frame) + 3.4vmin) calc(var(--frame) + var(--pad));
}
.slide.poster .copy{
  position:relative;flex:0 1 auto;max-width:44vw;padding:0;
}
.slide.week-slide .copy{max-width:82vw}
.poster-art{
  position:absolute;z-index:4;
  right:calc(var(--frame) + var(--pad));top:calc(var(--frame) + 3vmin);
  bottom:calc(var(--frame) + 3vmin);
  /* width:auto — a fixed-width panel leaves empty box either side of a
     portrait image, and the left-hand emptiness reads as a gap in the middle
     of the screen. Letting the panel be exactly as wide as the image puts the
     poster's real edge against the frame. */
  width:auto;max-width:44vw;
  display:flex;align-items:center;justify-content:flex-end;
}
.poster-art img{
  height:100%;width:auto;max-width:100%;object-fit:contain;
  border-radius:.8vmin;box-shadow:0 1.4vmin 5vmin rgba(0,0,0,.6);
}
/* the QR lives under the words on a poster slide, not in the corner —
   the poster owns the right-hand side */
.slide.poster .poster-art{
  position:static;flex:0 0 auto;height:100%;width:auto;max-width:44vw;
}
.slide.poster .qr{position:static;transform:none;margin-top:3vmin;align-items:flex-start}
.slide.poster .qr .cap{text-align:left}

/* ── ask slides: centred, quiet, no photograph competing ─────────────────
   An ask should read as a breath in the rotation, not a shout. */
.slide.ask{align-items:center;justify-content:center}
/* An ask is a moment, not a notice — the photograph is doing persuasive work
   (the room, the light, the garden), so it needs to be seen. Darkened behind
   the words by the radial and no further. */
.slide.ask .bg img{opacity:.42;filter:saturate(.8)}
.slide.ask .scrim{background:radial-gradient(ellipse at center,
  rgba(8,18,9,.78) 0%,rgba(8,18,9,.66) 45%,rgba(8,18,9,.42) 100%)}
.slide.ask .copy{
  padding:0 8vmin;max-width:none;text-align:center;
  display:flex;flex-direction:column;align-items:center;
}
.slide.ask .body{max-width:34ch}
.slide.ask .emoji{font-size:7vmin;line-height:1;margin-bottom:2vmin}

/* Type over five bright photographs needs something under it, but BLUR was the
   wrong answer — a softened photograph reads as a mistake, as though the
   picture were out of focus. Darkening is honest: it looks like a shadow
   falling across the left of the frame, which is a thing that happens. */
.veil{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  /* The ONLY horizontal darkener on these slides. It used to sit on top of a
     second left-to-right gradient in the scrim, and two of them multiplied:
     the first panel went nearly black while the last got nothing, so five
     photographs read as a brightness ramp instead of five photographs.

     Now: a gentler start on the left, a longer falloff so there's no step
     between panels, and a floor on the right so the last one is seated rather
     than blazing. */
  background:linear-gradient(to right,
    rgba(6,14,8,.82) 0%,  rgba(6,14,8,.76) 18%, rgba(6,14,8,.62) 34%,
    rgba(6,14,8,.44) 50%, rgba(6,14,8,.31) 66%, rgba(6,14,8,.23) 84%,
    rgba(6,14,8,.20) 100%);
}

/* ── THE POLAROID STACK ──────────────────────────────────────────────────
   For the students' slide the subject IS the volume. A tidy grid of five is
   the one arrangement that hides how much there is. So ten of them fall onto
   the screen one after another, slightly crooked, overlapping — a pile of
   photographs on a table rather than a layout.

   It breaks the rules elsewhere on this screen on purpose: this is the only
   slide about people rather than plants. */
.pile{position:absolute;inset:0;z-index:1;overflow:hidden}
.pola{
  position:absolute;background:var(--paper);
  padding:1.1vmin 1.1vmin 3.6vmin;border-radius:.3vmin;
  box-shadow:0 1.2vmin 4vmin rgba(0,0,0,.55);
  opacity:0;animation:drop .85s cubic-bezier(.18,.86,.28,1) both;
}
.pola img{display:block;width:21vmin;height:21vmin;object-fit:cover;background:var(--ground-2)}
@keyframes drop{
  from{opacity:0;transform:translateY(-14vmin) scale(1.14) rotate(calc(var(--r) * 2.4))}
  55% {opacity:1}
  to  {opacity:1;transform:translateY(0) scale(1) rotate(var(--r))}
}
.slide.pile-slide .scrim{
  background:
    linear-gradient(to top,rgba(8,18,9,.92) 0%,rgba(8,18,9,.70) 34%,rgba(8,18,9,.30) 70%,rgba(8,18,9,.12) 100%),
    linear-gradient(to right,rgba(8,18,9,.93) 0%,rgba(8,18,9,.72) 30%,rgba(8,18,9,.22) 52%,rgba(8,18,9,0) 70%);
}
.slide.pile-slide .copy{max-width:44vw}

/* ── THE WEEK ────────────────────────────────────────────────────────────
   A schedule is SCANNED, not read — nobody reads a timetable end to end, they
   look for their own day. So the whole week goes up at once where it fits, and
   a visitor finds Saturday without waiting for Saturday to come round.

   Empty days are simply absent. A park with events on three days should not
   show four blank rows to prove it. */
.week{display:flex;flex-direction:column;gap:1.9vmin;margin-top:1.2vmin}
.week-day{display:grid;grid-template-columns:15vmin 1fr;gap:2.2vmin;align-items:baseline}
.week-day .dw{
  font-size:clamp(.95rem,2.5vmin,2rem);font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-quiet);white-space:nowrap;
}
.week-day.today .dw{color:var(--gold);opacity:1}
.week-day.today .ev{color:var(--paper)}
.week-item{display:flex;gap:1.6vmin;align-items:baseline;margin-bottom:.5vmin}
.week-item .tm{
  font-size:clamp(.85rem,2.1vmin,1.7rem);font-weight:700;letter-spacing:.06em;
  color:var(--gold);opacity:.85;white-space:nowrap;min-width:11vmin;
}
.week-item .ev{
  font-family:var(--serif);font-size:clamp(1rem,2.9vmin,2.4rem);
  font-weight:400;line-height:1.2;color:var(--ink-invert);
}

/* ── AMBIENT ─────────────────────────────────────────────────────────────
   A photograph and nothing else. No eyebrow, no name, no fact — just the
   frame, the credit, and ten seconds of quiet.

   This is a rhythm device, not a content type. Every other slide asks the
   visitor to read something; a room where the screen never stops talking is
   exhausting to sit in. The gap is the point. */
/* Ambient slides carry no words, so the motion is the only thing happening —
   it can afford to be more than a drift. Roughly double the travel of a normal
   slide, and slower, so it reads as deliberate rather than restless. */
.slide.ambient.on .bg img{animation-duration:calc(var(--kb,24s) * 1.5)}
.slide.ambient.on .bg img.kb-in     { animation-name:kbInBig }
.slide.ambient.on .bg img.kb-out    { animation-name:kbOutBig }
.slide.ambient.on .bg img.kb-left   { animation-name:kbLeftBig }
.slide.ambient.on .bg img.kb-right  { animation-name:kbRightBig }
.slide.ambient.on .bg img.kb-rise   { animation-name:kbRiseBig }
.slide.ambient.on .bg img.kb-settle { animation-name:kbSettleBig }
@keyframes kbInBig     { from{transform:scale(1.02)} to{transform:scale(1.24)} }
@keyframes kbOutBig    { from{transform:scale(1.24)} to{transform:scale(1.02)} }
@keyframes kbLeftBig   { from{transform:scale(1.16) translateX(3.4%)}  to{transform:scale(1.16) translateX(-3.4%)} }
@keyframes kbRightBig  { from{transform:scale(1.16) translateX(-3.4%)} to{transform:scale(1.16) translateX(3.4%)} }
@keyframes kbRiseBig   { from{transform:scale(1.18) translateY(3.8%)}  to{transform:scale(1.18) translateY(-3.8%)} }
@keyframes kbSettleBig { from{transform:scale(1.18) translateY(-3.8%)} to{transform:scale(1.18) translateY(3.8%)} }

.slide.ambient .copy{display:none}
.slide.ambient .scrim{
  background:linear-gradient(to top,rgba(8,18,9,.55) 0%,rgba(8,18,9,.16) 34%,
                             rgba(8,18,9,0) 62%);
}

/* ── COLLECTION ──────────────────────────────────────────────────────────
   Five photographs as vertical panels, one grouping, one count. Every other
   slide shows ONE thing; this one shows that the one thing belongs to a set —
   sixty-five palms, fifty-six Florida natives, ten butterflies. It's the only
   format that lets the collection read as a collection. */
.collection{position:absolute;inset:0;z-index:1;display:grid;
            grid-template-columns:repeat(5,1fr);gap:.35vmin}
.collection div{overflow:hidden;background:var(--ground-2)}
.collection img{width:100%;height:100%;object-fit:cover;transform:scale(1.05)}
.slide.on .collection img{animation:kbIn var(--kb,24s) linear both}
.slide.set .scrim{
  /* Vertical only — the horizontal half moved to .veil, where it belongs.
     This just seats the bottom edge so the credit line has ground under it. */
  background:linear-gradient(to top,rgba(8,18,9,.72) 0%,rgba(8,18,9,.40) 22%,
                             rgba(8,18,9,.10) 48%,rgba(8,18,9,0) 70%);
}
.slide.set .headline,.slide.set .count,
.slide.set .roster,.slide.set .shot{text-shadow:0 2px 18px rgba(0,0,0,.85)}
.count{
  font-family:var(--serif);font-weight:700;line-height:.9;color:var(--gold);
  font-size:clamp(2.4rem,8.5vmin,7rem);letter-spacing:-.02em;margin-bottom:.6vmin;
}
.count small{
  display:block;font-family:var(--sans);font-size:2vmin;font-weight:700;
  letter-spacing:.26em;text-transform:uppercase;color:var(--gold);opacity:.85;
  margin-top:.9vmin;
}
.roster{
  font-size:clamp(.95rem,2.35vmin,1.8rem);line-height:1.5;font-weight:400;
  color:var(--paper);opacity:.88;margin-top:2.4vmin;max-width:44ch;
}
.shot{
  margin-top:2.6vmin;font-size:1.6vmin;font-weight:700;letter-spacing:.12em;
  color:var(--gold);opacity:.9;
}

/* ── PARTNER LOGOS ───────────────────────────────────────────────────────
   A partner logo is a CREDIT, not a takeover. On an event or a class the
   organisation is teaching or hosting, not sponsoring the screen — so the mark
   sits at the foot of the text column at credit scale, under a small label,
   exactly like the photographer credit. On an announcement it takes the
   emoji's place instead, because there it IS the slide's icon.

   The white plate is not decoration: most organisational logos are dark-on-
   transparent and would vanish on this ground. Plating every one of them means
   any logo dropped in the folder works without special-casing. */
.logo{display:flex;flex-direction:column;gap:1vmin;margin-top:3.4vmin}
.logo .lbl{
  font-size:1.4vmin;font-weight:700;letter-spacing:.28em;text-transform:uppercase;
  color:var(--gold);
}
.logo-plate{
  background:var(--paper);border-radius:.7vmin;padding:1.2vmin 1.8vmin;
  align-self:flex-start;line-height:0;
  box-shadow:0 .4vmin 2vmin rgba(0,0,0,.45);
}
.logo-plate img{display:block;width:auto;height:auto;max-width:26vmin;max-height:6.5vmin}

/* On an ask it stands in for the emoji — bigger, centred, above the headline */
.slide.ask .logo{align-items:center;margin:0 0 2.4vmin}
.slide.ask .logo .lbl{margin-bottom:.4vmin}
.slide.ask .logo-plate{align-self:center;padding:1.8vmin 2.6vmin}
.slide.ask .logo-plate img{max-width:38vmin;max-height:11vmin}

/* ── QR ──────────────────────────────────────────────────────────────────
   A screen can't be clicked, so any slide whose value is a link needs a code
   or it shouldn't be there. The white card is not decoration — a QR needs a
   quiet zone and hard contrast to scan from across a room. */
/* Bottom CENTRE, not the corner. The photographer credit already owns the
   bottom right, and stacking the two there made them read as one item — as
   though the code led to the photographer. Three zones now: words left,
   code centre, credit right. */
.qr{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(var(--frame) + 3.2vmin);
  z-index:5;display:flex;flex-direction:column;align-items:center;gap:1.1vmin;
}
/* keep the words clear of the centred code */
.slide.has-qr .copy{max-width:52vw}
.qr-card{
  background:var(--paper);padding:1.5vmin;border-radius:1vmin;
  box-shadow:0 .6vmin 3vmin rgba(0,0,0,.5);line-height:0;
}
.qr-card img{width:12.5vmin;height:12.5vmin;display:block}
.qr .cap{
  font-size:1.5vmin;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold);text-align:center;max-width:22vmin;line-height:1.4;
}
/* the printed URL, shown only if the code fails to load */
.qr .raw{font-size:1.3vmin;color:var(--ink-quiet);word-break:break-all;max-width:24vmin;text-align:center}

/* On an ask the QR belongs under the words, centred with them — the ask is the
   whole slide, so the code shouldn't hide in a corner. */
.slide.ask .qr{position:static;transform:none;margin-top:3.4vmin}
.slide.ask .qr-card img{width:17vmin;height:17vmin}


/* ── progress hairline ───────────────────────────────────────────────────── */
#bar{
  position:fixed;left:0;bottom:0;height:2px;width:0;z-index:45;
  background:linear-gradient(90deg,var(--gold-deep),var(--gold));
}

/* Not the target device, but Randy checks it on a phone and the wordmark and
   the date collide at that width. The date and time are the useful half. */
@media (max-width:760px){
  .wordmark{display:none}
  .clock{font-size:1.6vmax}
}

@media (prefers-reduced-motion:reduce){
  .slide{transition:opacity .25s}
  .bg img,.slide.on .bg img{transform:none;transition:none;animation:none}
  .body,.slide.reveal .body{opacity:1;transform:none;transition:none}
  .beat{position:static;opacity:1;transform:none;transition:none}
  .w{opacity:1 !important;transform:none !important;transition:none !important}
  .beat.spent{display:none}
  .beats{min-height:0 !important}
  #bar{transition:none}
}
</style>
</head>
<body>

<div class="frame"></div>
<div class="wordmark">Palma Sola Botanical Park</div>
<div class="clock" id="clock"></div>
<div class="credit" id="credit"></div>

<div id="stage"></div>
<div id="bar"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════════════════════════ */
var Q       = new URLSearchParams(location.search);
/* Any name works: ?mode=galleria (default), ?mode=office, ?mode=bathroom.
   MODE does two jobs — it picks a mix profile, and it decides which rows a
   screen accepts via the optional `screen_where` column. A name with no mix
   profile of its own falls back to the galleria mix but keeps its own
   identity for routing, so a new screen can be added by plugging in a stick
   and pointing it at a URL. */
var MODE    = (Q.get('mode') || 'galleria').trim().toLowerCase() || 'galleria';
var PROFILE = (MODE === 'office') ? 'office' : 'galleria';
var SECONDS = +(Q.get('seconds') || 0) || 18;   // lingers; 14 read as rushed on the wall

/* ?speed=5 runs the whole thing five times faster — slide durations, beat
   turns, line cascades, Ken Burns and cross-fades all together, so the timing
   stays in proportion. For reviewing a full rotation in a couple of minutes
   rather than half an hour. Not for the wall. */
var SPEED = Math.max(0.1, Math.min(20, +(Q.get('speed') || 1) || 1));
SECONDS = SECONDS / SPEED;
var BASE    = Q.get('base') || '';           // '' when served from repo root
var FEEDS   = BASE + 'data/published/';


/* How much of the deck each type gets. Weights, not counts — a type with fewer
   rows than its weight simply contributes fewer slides.

   Note that right_now and spotlight are BOTH full-bleed species photographs.
   Their weights add up as far as the eye is concerned, so keep the pair in
   check rather than tuning either alone. */
/* PERIOD: roughly how many cycles before a given row comes round again.
   Lower = more airtime per row. Slides per cycle = ceil(rows / period), so a
   feed that grows contributes more without anyone retuning anything. */
var PERIOD = {
  event:      2,                            // timely, and the window already filters
  news:       PROFILE === 'office' ? 2 : 3,
  klass:      3,
  series:     3,
  volunteer:  PROFILE === 'office' ? 2 : 4,
  newsletter: 4,
  right_now:  2,                            // what to go look at, right now
  ask:        PROFILE === 'office' ? 3 : 4
};
var CAP = { event:4, news:2, klass:2, series:1, volunteer:2, newsletter:1, right_now:2 };

/* The collection is the one pool with no feed behind it — 320 species, so it
   can't be periodised. A flat count, tuned against everything else. */
var SPOTLIGHTS = PROFILE === 'office' ? 4 : 5;

/* Two per cycle each — enough to change the rhythm, not enough to become the
   rhythm. The point of both is that they are a break from the pattern. */
var AMBIENTS   = PROFILE === 'office' ? 1 : 2;
var COLLECTIONS = 2;
var WEEKVIEWS  = 1;      /* a summary — once a cycle is plenty */
var COHORTS    = 1;

/* Types that LOOK alike, whatever their content. De-clumping works on these
   rather than on type, so a Blooming Now doesn't sit next to a collection
   photograph and read as two of the same slide. */
var FAMILY = {
  right_now:'species', spotlight:'species',
  ambient:'quiet', collection:'quiet', cohort:'quiet', week:'schedule',   /* both are photo-led breaks — keep
                                            them apart from each other too */
  event:'schedule', klass:'schedule', series:'schedule',
  news:'news', newsletter:'news',
  volunteer:'people', ask:'ask'
};
function famOf(item){ return FAMILY[item.type] || item.type; }

/* ═══════════════════════════════════════════════════════════════════════════
   DATA
   Every feed row is filtered to display ∈ {screen, both}. A row marked "web"
   never reaches this screen — that's the whole routing mechanism, and it
   already exists in the Sheet.
   ═══════════════════════════════════════════════════════════════════════════ */
var D = { right_now:[], events:[], classes:[], news:[], announcements:[],
          volunteer:[], series:[], newsletters:[], plants:[], wildlife:[] };

/* `display` decides web vs screen. An optional `screen_where` decides WHICH
   screen — office, galleria, or blank for both.

   The filter is here so the column can be added to the Sheet the day it's
   needed and not before. Blank means everywhere, so an unused column costs
   Bev nothing and costs the screen nothing. */
function onScreen(rows){
  return (rows || []).filter(function(r){
    var d = (r.display || 'web').toLowerCase();
    if(d !== 'screen' && d !== 'both') return false;
    var where = (r.screen_where || r.screen_location || '').trim().toLowerCase();
    return !where || where === 'both' || where === MODE;
  });
}

/* `cache: no-store` matters more than the ten-minute timer.
   GitHub Pages sends cache headers, so a browser left running all day will
   happily re-serve the same JSON it fetched at nine in the morning — the timer
   fires, the fetch "succeeds", and the wall shows yesterday's content. This
   forces every refresh to actually reach the network. */
function grab(url){
  return fetch(url, { cache:'no-store' })
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .catch(function(){
      /* some older TV browsers reject the option outright */
      return fetch(url + (url.indexOf('?') > -1 ? '&' : '?') + 'v=' + Date.now())
        .then(function(r){ if(!r.ok) throw 0; return r.json(); })
        .catch(function(){ return null; });
    });
}

function loadAll(){
  return Promise.all([
    grab(FEEDS+'right_now.json'), grab(FEEDS+'events.json'),
    grab(FEEDS+'classes.json'),   grab(FEEDS+'news.json'),
    grab(FEEDS+'announcements.json'), grab(FEEDS+'volunteer.json'),
    grab(FEEDS+'series.json'),    grab(FEEDS+'newsletters.json'),
    grab(BASE+'plants.json'),     grab(BASE+'wildlife.json'),
    grab(BASE+'data/sources/photo_credits.json'),
    grab(BASE+'data/sources/plant_signage.json'),
    grab(BASE+'data/sources/wildlife_signage.json'),
    grab(BASE+'data/sources/photographer_names.json')
  ]).then(function(r){
    D.right_now=onScreen(r[0]); D.events=onScreen(r[1]);
    D.classes=onScreen(r[2]);   D.news=onScreen(r[3]);
    D.announcements=onScreen(r[4]); D.volunteer=onScreen(r[5]);
    D.series=onScreen(r[6]);    D.newsletters=onScreen(r[7]);
    D.plants=r[8]||[];          D.wildlife=r[9]||[];
    indexCredits(r[10]);
    indexHits(r[11]); indexHits(r[12]);
    NAMES = r[13] || {};
    if(!D.right_now.length && !D.plants.length) fallback();
  });
}

/* QUICK HITS COME FROM THE SIGNAGE MASTERS, NOT THE SEARCH INDEX.
   The index flattens the quick_hits array into one space-joined string for
   search scoring, which is right for search and useless here — there is no way
   to tell where one hit ends, so the screen was splitting on sentences and
   tearing hits in half ("Florida got this species by accident." and then the
   rest of it, lost).

   The signage files are the source of truth and carry the array intact. They
   are large (2.8 MB together) but this is a wired-in TV on purpose-built wifi,
   and only the quick_hits are kept — everything else is dropped the moment it
   is parsed, so the resident cost is small. It also means an edit reaches the
   wall as soon as the file is saved, with no republish in between.

   If the publisher ever emits a real `quick_hits` array in the index, that is
   preferred automatically and these two fetches can be deleted. */
var HITS = {};
function indexHits(blob){
  var rows = (blob && blob.species) || blob || [];
  for(var i=0;i<rows.length;i++){
    var r = rows[i];
    if(r && r.id && r.quick_hits && r.quick_hits.length) HITS[r.id] = r.quick_hits;
  }
  /* `rows` goes out of scope here; only the arrays above are retained. */
}

/* photo_id -> {observed_on, license, name}. The search index carries the
   photographer and licence but not the date, so the credits master fills it in.
   Optional: if the file can't be reached the credit falls back to name + licence. */
var CREDITS = {}, BY_SHOOTER = {}, NAMES = {};
function indexCredits(rows){
  var photos = (rows && rows.photos) || rows || [];

  /* REBUILT EACH REFRESH, NOT APPENDED.
     BY_SHOOTER used push(), and the feeds are re-read every ten minutes, so
     every refresh added all 1,046 photos again. The cohort slide sums those
     arrays: 298 photographs on first load, 596 ten minutes later, 894 after
     twenty, and roughly 43,000 by the 4am reload. The species count stayed
     right the whole time because it is a dict keyed by psbp_id and duplicates
     collapse — which is what made the photo count obviously wrong.

     Guarded: an empty or failed fetch must not wipe what is already loaded.
     The credits master is optional here (see the note above), and losing it
     mid-day would strip dates and orientation off every slide.

     Deliberately NOT done to indexHits() below — that one is called twice per
     refresh, plants then wildlife, and uses assignment. Clearing at its top
     would make the wildlife pass erase the plants pass. */
  if(!photos.length) return;
  CREDITS = {}; BY_SHOOTER = {};

  for(var i=0;i<photos.length;i++){
    var p=photos[i];
    if(p.photo_id) CREDITS[String(p.photo_id)] = p;
    if(p.photographer) (BY_SHOOTER[p.photographer] = BY_SHOOTER[p.photographer] || []).push(p);
  }
}

/* Everyone whose registry note marks them as part of a named programme.
   `photographer_names.json` already records this — the note field is doing
   real work, not just sitting there as a comment. */
function cohort(match){
  var logins = [];
  for(var login in NAMES){
    var n = (NAMES[login] && NAMES[login].note) || '';
    if(n.toLowerCase().indexOf(match.toLowerCase()) > -1) logins.push(login);
  }
  return logins;
}
function photoIdOf(path){
  var m = /\/(\d+)\.jpe?g$/i.exec(path||'');
  return m ? m[1] : null;
}

/* RESOLUTION
   iNaturalist serves square / small / medium / large / original. The credits
   file stores `large` — 1024px on the long edge, fine for a web page and soft
   stretched across a 4K panel. Extensions vary (52 of the rows are .jpeg), so
   only the size segment is swapped. `original` isn't guaranteed to exist, so
   anything using it carries a fallback. */
function inatSize(url, size){
  if(!url) return url;
  return url.replace(/\/(square|small|medium|large|original)(\.\w+)$/i, '/'+size+'$2');
}

/* Local hero files are deliberately shrunk for page weight; the screen wants
   the opposite. Where a local photo came from iNaturalist, go back to source. */
function bigPhoto(sp){
  if(!sp) return null;
  var rec = CREDITS[photoIdOf(sp.photo)];
  if(rec && rec.photo_url) return inatSize(rec.photo_url, 'original');
  return sp.photo ? BASE + sp.photo : null;
}
function fallbackPhoto(sp){
  var rec = sp && CREDITS[photoIdOf(sp.photo)];
  return (rec && rec.photo_url) || (sp && sp.photo ? BASE + sp.photo : '');
}

/* ORIENTATION
   Four photographs in five are portrait — the catalogue is shot on phones and
   the screen is 16:9 — so formats and library have to be matched up: wide
   slides want the 192 landscapes, vertical panels want the 846 portraits.
   With dimensions absent everything stays eligible, so this degrades to the
   old behaviour rather than emptying out. */
function orientOf(sp){
  var rec = sp && CREDITS[photoIdOf(sp.photo)];
  return (rec && rec.orient) || null;
}
function preferOrient(rows, want, floor){
  if(!rows || !rows.length) return rows || [];
  var hit = rows.filter(function(x){
    var o = orientOf(x);
    return o === want || (want === 'portrait' && o === 'square');
  });
  return hit.length >= (floor || 8) ? hit : rows;
}

/* Enough pixels for the region it must fill. A 1152x2048 phone photo is
   perfect in a fifth-of-the-frame panel and soft across a 4K width. */
function bigEnough(sp, minWidth){
  var rec = sp && CREDITS[photoIdOf(sp.photo)];
  if(!rec || !rec.w) return true;          /* unknown — don't exclude it */
  return rec.w >= minWidth;
}
function creditFor(sp){
  if(!sp) return null;
  var rec = CREDITS[photoIdOf(sp.photo)] || {};
  var name = rec.photographer_name || sp.credit_name || sp.credit || '';
  if(!name) return null;
  var lic  = (rec.license || sp.credit_license || '').replace(/^CC-/,'CC ').replace(/_/g,' ');
  var when = rec.observed_on
    ? new Date(rec.observed_on+'T12:00').toLocaleDateString('en-US',{month:'long',year:'numeric'})
    : '';
  return { name:name, terms:[lic, when].filter(Boolean).join('  ·  ') };
}

/* Standalone sample so the file opens and animates off a laptop with no repo.
   Deliberately tiny — this is a smoke test, not a demo reel. */
function fallback(){
  D.right_now=[{common_name:'Turks Turban',scientific_name:'Clerodendrum indicum',
    kind:'blooming',area:'Near Office',display:'screen',
    note:'Very cool red stars topped with a blueberry. Gotta check that out',
    quick_hits:['The real attraction is not the flower but what follows it — a large, waxy, <b>inflated calyx</b> in deep red-purple that persists and swells as the fruit develops inside.']}];
  D.announcements=[{emoji:'🌿',title:'This park is free, every day',
    body:'Open 365 days a year, kept going by members and donors.',
    link_text:'Ask at the office about becoming a member',display:'screen'}];
}

/* ═══════════════════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════════════════ */
var esc = function(s){ return String(s==null?'':s)
  .replace(/&(?!(amp|lt|gt|quot|#\d+);)/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;'); };
/* quick_hits and aside carry deliberate <b> from the Sheet — keep those. */
var rich = function(s){ return String(s==null?'':s)
  .replace(/<(?!\/?(b|strong|i|em)\b)[^>]*>/gi,''); };
var pick = function(a){ return a[Math.floor(Math.random()*a.length)]; };
var shuffle = function(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t; } return a; };

var ABBR = /^(Dr|Mr|Mrs|Ms|St|Mt|Ft|vs|var|cv|subsp|ssp|spp|sp|approx|ca|cf|Fig|No|Inc|Co|etc|e\.g|i\.e|U\.S|U\.K)$/i;

/* Split prose into sentences without a lookbehind — old TV browsers don't all
   support variable-length lookbehind, and the naive /(?<=[.!?]) +/ breaks on
   every botanical abbreviation: "(S. cayennensis)" became its own "sentence".
   A period only ends a sentence when the word before it isn't an abbreviation
   or a single-letter initial, AND the next sentence starts with a capital. */
function sentences(text){
  if(!text) return [];
  var s = String(text), out = [], buf = '', i = 0;
  while(i < s.length){
    var ch = s[i]; buf += ch;
    if(ch === '.' || ch === '!' || ch === '?'){
      while(i+1 < s.length && /[)\]"'\u201d\u2019]/.test(s[i+1])) buf += s[++i];
      var j = i+1;
      while(j < s.length && /\s/.test(s[j])) j++;
      if(j > i+1 || j >= s.length){
        var m = /([A-Za-z.]+)[.!?][)\]"'\u201d\u2019]*$/.exec(buf);
        var word = m ? m[1] : '';
        var isAbbr = (word.length === 1 && /[A-Za-z]/.test(word)) || ABBR.test(word);
        var startsNew = j < s.length && /[A-Z"'\u201c\u2018(]/.test(s[j]);
        if(!isAbbr && (startsNew || j >= s.length)){
          out.push(buf.trim()); buf = ''; i = j - 1;
        }
      }
    }
    i++;
  }
  if(buf.trim()) out.push(buf.trim());
  return out;
}

/* `quick` in the search index is the quick-hits array joined into one string.
   A hit is a written unit — 47% of them run to two or three sentences — so
   splitting on sentence boundaries tears them apart and produces fragments
   that read as continuations ("The founding group is believed to have…").
   That was the cause of most of the non-standalone lines on screen; the
   writing was fine.

   If the index supplies a delimiter, honour it. Sentence-splitting is only the
   fallback for the old format. See plant_publisher.py line ~184: joining with
   " || " instead of " " restores the boundaries and costs nothing. */
function hitsOf(sp){
  if(!sp) return [];
  /* 1. the index already carries the array (publisher updated) */
  if(sp.quick_hits && sp.quick_hits.length) return sp.quick_hits.slice();
  /* 2. the signage master, loaded above — the normal path today */
  if(sp.id && HITS[sp.id]) return HITS[sp.id].slice();
  /* 3. a delimited string */
  var t = String(sp.quick || '');
  if(t.indexOf('||') > -1){
    return t.split('||').map(function(x){ return x.trim(); })
            .filter(function(x){ return x.length > 25; });
  }
  /* 4. last resort: split the flattened string and accept the seams */
  return sentences(t).filter(function(x){ return x.trim().length>25; });
}

/* Two of them, different from each other, in random order — and different from
   whatever this species said last time. A plant that comes round again should
   be telling you something new, not repeating itself, so each species keeps a
   short memory of the hits it has already used and works through the rest
   before any come back. With a median of five or six hits per species that's
   ten to fifteen distinct pairings before anything repeats. */
function twoHits(sp){
  return rotate('sp:'+(sp.id || sp.common || '?'), hitsOf(sp), 2);
}

/* NOT CURRENTLY CALLED — twoHits() superseded it. Kept because a one-beat
   variant is the obvious thing to want back. If you revive it, note that the
   empty case used to read `return String(text)`, referencing a variable that
   does not exist in this scope: it threw a ReferenceError for any species with
   no quick hits, and next() would have swallowed it as "nothing to show". */
function oneHit(sp){
  var parts = hitsOf(sp);
  if(!parts.length) return '';
  var s = pick(parts);
  /* a very short hit reads thin on a big screen — pair it with its neighbour */
  if(s.length < 90){
    var i = parts.indexOf(s);
    var joined = parts[i+1] ? s+' '+parts[i+1]
               : (parts[i-1] ? parts[i-1]+' '+s : s);
    if(joined.length <= 300) s = joined;   /* pair a short hit, but not into a wall of text */
  }
  return s;
}

function speciesById(id){
  for(var i=0;i<D.plants.length;i++)   if(D.plants[i].id===id)   return D.plants[i];
  for(var j=0;j<D.wildlife.length;j++) if(D.wildlife[j].id===id) return D.wildlife[j];
  return null;
}

function niceDate(iso){
  if(!iso) return '';
  var d=new Date(midnight(iso)), days=daysUntil(iso);
  if(days<=0) return 'Today';
  if(days===1) return 'Tomorrow';
  if(days<7)  return d.toLocaleDateString('en-US',{weekday:'long'});
  return d.toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric'});
}

/* WHEN AN EVENT REACHES THE SCREEN
   Ordinary events show inside a 28-day window — beyond that, "coming in three
   months" is noise to somebody standing in the garden today.

   Three ways to override, in order of precedence:
     screen_from   an explicit YYYY-MM-DD. Absolute control.
     save_the_date "Yes" opens the window to a full year. The flag already
                   exists in the events tab and already means exactly this.
     closes_park   "Yes" also gets the long window — a closure is something
                   visitors need warning about, not news on the day.
*/
var NEAR_DAYS = 28, FAR_DAYS = 365;

/* Calendar days apart, not milliseconds apart.
   Parsing the date at noon and comparing it to local midnight gave 0.5 for
   today, and Math.round(0.5) is 1 — so every same-day event announced itself
   as TOMORROW in display type. Both sides are now local midnight, which also
   makes this DST-proof. */
function midnight(iso){
  var p = String(iso).split('-');
  return new Date(+p[0], (+p[1]||1)-1, +p[2]||1).getTime();
}
function daysUntil(iso){
  var now=new Date(); now.setHours(0,0,0,0);
  return Math.round((midnight(iso) - now.getTime())/864e5);
}
function yes(v){ return String(v||'').trim().toLowerCase() === 'yes'; }

function eventWindow(e){
  if(!e.date) return false;
  var d = daysUntil(e.date);
  if(d < 0) return false;
  var from = (e.screen_from || '').trim();
  if(from) return daysUntil(from) <= 0 && d <= FAR_DAYS;
  if(yes(e.save_the_date) || yes(e.closes_park)) return d <= FAR_DAYS;
  return d <= NEAR_DAYS;
}

function upcoming(rows){
  return rows.filter(eventWindow)
             .sort(function(a,b){ return a.date<b.date?-1:1; });
}

/* ═══════════════════════════════════════════════════════════════════════════
   SLIDE BUILDERS
   Each returns {bg, focus, credit, html, ask} or null.
   ═══════════════════════════════════════════════════════════════════════════ */
var KIND_LABEL = { blooming:'Blooming now', budding:'About to bloom',
  fruiting:'Fruiting now', fading:'Last chance', sighting:'Seen recently' };

/* ROTATION, not random-with-one-step-memory.
   Avoiding only the previous pick still lets one hit surface again and again
   while another goes months unseen — with four hits that is a one-in-three
   chance every appearance, which is exactly why Beautyberry kept opening with
   the same line. This works through everything a species has before any of it
   comes back. Shared by Right Now and the collection spotlights. */
var usedHits = {};
function rotate(key, list, n){
  if(!list || !list.length) return [];
  n = Math.min(n || 1, list.length);
  var used = usedHits[key] || (usedHits[key] = []);
  var out = [];
  while(out.length < n){
    var fresh = list.filter(function(h){ return used.indexOf(h) < 0 && out.indexOf(h) < 0; });
    if(!fresh.length){ used.length = 0; fresh = list.filter(function(h){ return out.indexOf(h) < 0; }); }
    if(!fresh.length) break;
    var h = pick(fresh);
    out.push(h); used.push(h);
  }
  /* keep the memory just short of the pool so there's always something fresh */
  while(used.length > list.length - 1) used.shift();
  return out;
}

function freshHit(id, hits){ return rotate('rn:'+id, hits, 1)[0] || ''; }

function slideRightNow(r){
  var sp = r.psbp_id ? speciesById(r.psbp_id) : null;
  var note = (r.note || '').trim();
  /* quick_hits ride along in the right_now feed; fall back to the species
     record's joined `quick` string if the row hasn't got them. */
  var hits = (r.quick_hits && r.quick_hits.length) ? r.quick_hits
           : hitsOf(sp);
  var fact = freshHit(r.psbp_id || r.common_name, hits);

  var list = [note, fact].filter(Boolean);
  var body = beatsMarkup(list, list.length>1 ? 1 : null);

  return {
    bg: bigPhoto(sp), bgFallback: fallbackPhoto(sp),
    focus: sp && sp.focus,
    credit: creditFor(sp),
    html:
      '<div class="eyebrow"><span>'+esc(KIND_LABEL[r.kind]||'Right now')+'</span>'
    + (r.area?'<span class="where">'+esc(r.area)+'</span>':'')+'</div>'
    + '<div class="headline">'+esc(r.common_name)+'</div>'
    + (r.scientific_name?'<div class="latin">'+esc(r.scientific_name)+'</div>':'')
    + body
    /* No default QR here: a species page is a link to the thing the reader is
       already standing next to. Bev can still force one with screen_qr. */
    + qrBlock(r, 'Scan for the full story')
  };
}

var seenSpecies = [];      /* short memory, so the same plant doesn't come round twice in an hour */
function slideSpotlight(){
  var all = D.plants.concat(D.wildlife).filter(function(s){ return s.photo; });
  if(!all.length) return null;
  var pool = all.filter(function(s){ return seenSpecies.indexOf(s.id) < 0; });
  if(!pool.length){ seenSpecies = []; pool = all; }
  var s = pick(pool);
  seenSpecies.push(s.id);
  /* NO CAP — see the reset three lines above, which this used to make
     unreachable.

     It previously read:
       if(seenSpecies.length > Math.floor(all.length * 0.6)) seenSpecies.shift();
     which held seenSpecies at 192 of 320, so `pool` never emptied and the
     reset never fired. Every pick was uniform-random over whichever 128
     species happened to be outside the window — so one plant could come
     round again while a hundred others had never been shown at all. It read
     on the wall as some species appearing constantly and some never.

     Now seenSpecies grows until every species has been shown, the reset
     fires, and the pool refills: sampling WITHOUT replacement across the
     whole catalogue. At 4 spotlights a cycle a full pass takes ~80 cycles.

     Same principle as takeFrom() for the feeds and rotate() for the quick
     hits — everything gets its turn before anything gets a second. */
  var hits = twoHits(s);
  return {
    bg: bigPhoto(s), bgFallback: fallbackPhoto(s), focus: s.focus,
    credit: creditFor(s),
    html:
      '<div class="eyebrow">From the collection</div>'
    + '<div class="headline">'+esc(s.common)+'</div>'
    + (s.sci?'<div class="latin">'+esc(s.sci)+'</div>':'')
    + beatsMarkup(hits)   /* no QR — same reasoning as Right Now */
  };
}

function slideEvent(e){
  var bits=[];
  if(e.time) bits.push(e.time);
  if(e.cost) bits.push(e.cost);
  if(e.kid_friendly==='Yes') bits.push('Kids welcome');
  var far = daysUntil(e.date) > NEAR_DAYS;
  var art = artFor(e);
  return fromArt(art, {
    html:
      dateStamp(e.date, e.date_end)
    + (far || e.series
        ? '<div class="eyebrow">'
          + (far?'<span>'+(yes(e.closes_park)?'Park closed':'Save the date')+'</span>':'')
          + (e.series?'<span class="where plain" style="color:var(--ink-invert)">'+esc(e.series)+'</span>':'')
          + '</div>'
        : '')
    + '<div class="headline">'+esc(e.title)+'</div>'
    + (e.description?'<div class="body">'+rich(e.description)+'</div>':'')
    + (bits.length?'<div class="meta"><span>'+bits.map(esc).join('</span><span>')+'</span></div>':'')
    + logoBlock(e, 'With')
    + qrBlock(e, e.registration_url ? 'Scan to register' : 'Scan for details', e.registration_url || e.link_url)
  });
}

var DOW = {Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',
           Fri:'Friday',Sat:'Saturday',Sun:'Sunday'};
function slideClass(c){
  var art = artFor(c);
  var day = DOW[c.weekday] || c.weekday || 'Weekly';
  return fromArt(art, {
    html:
      '<div class="stamp">'
    +   '<span class="num word">Every</span>'
    +   '<span class="when"><span class="dow">'+esc(day)+'</span>'
    +   (c.time?'<span class="sub">'+esc(c.time)+'</span>':'')+'</span>'
    + '</div>'
    + (c.category?'<div class="eyebrow"><span>'+esc(c.category)+'</span></div>':'')
    + '<div class="headline">'+esc(c.title)+'</div>'
    + (c.description?'<div class="body">'+rich(c.description)+'</div>':'')
    + '<div class="meta">'
    + (c.instructor?'<span>'+esc(c.instructor)+'</span>':'')
    + (c.cost?'<span>'+esc(c.cost)+'</span>':'')+'</div>'
    + logoBlock(c, 'With')
    + qrBlock(c, 'Scan for details', c.registration_url || c.link_url)
  });
}

function slideNews(n){
  /* Headline and subhead hold still — they're the identity of the story.
     Blurb, intro and body2 take turns underneath. */
  var beats = beatsFrom([n.blurb, n.intro, n.body2], 3);
  var art = artFor(n, n.hero_image ? BASE+n.hero_image : null);
  return fromArt(art, {
    /* Set here, so fromArt() leaves it alone: a story with three turns needs
       longer than a species photo. */
    seconds: art.poster ? Math.round(SECONDS * 1.6)
           : (beats.length > 1 ? Math.round(SECONDS * (1 + 0.45*(beats.length-1))) : SECONDS),
    html:
      '<div class="eyebrow"><span>Park news</span></div>'
    + '<div class="headline">'+esc(n.headline)+'</div>'
    + (n.subhead?'<div class="subhead">'+rich(n.subhead)+'</div>':'')
    + beatsMarkup(beats)
    + logoBlock(n, 'With thanks to')
    + qrBlock(n, 'Scan to read the story', n.link_url)
  });
}

function slideSeries(s){
  var art = artFor(s);
  return fromArt(art, {
    html:
      '<div class="eyebrow">'+esc(s.category||'Series')+'</div>'
    + '<div class="headline">'+esc(s.name)+'</div>'
    + (s.blurb?'<div class="body">'+rich(s.blurb)+'</div>':'')
    + logoBlock(s, 'In partnership with')
    + qrBlock(s, 'Scan for the schedule', s.flyer_url)
  });
}

function slideVolunteer(v){
  var vArt = artFor(v, v.photo_url
    ? (/^https?:/.test(v.photo_url) ? v.photo_url : BASE+v.photo_url.replace(/^\//,''))
    : null);
  return fromArt(vArt, {
    html:
      '<div class="eyebrow">'+esc(v.role||'Volunteer')+'</div>'
    + '<div class="headline">'+esc(v.title)+'</div>'
    + (v.body?'<div class="body">'+rich(v.body)+'</div>':'')
    + logoBlock(v, 'With')
    + qrBlock(v, 'Scan to sign up', v.link_url)
  });
}

function slideNewsletter(n){
  var art = artFor(n);
  return fromArt(art, {
    html:
      '<div class="eyebrow">Newsletter · '+esc(niceDate(n.date)||n.title)+'</div>'
    + '<div class="headline">'+esc(n.title)+'</div>'
    + (n.description?'<div class="body">'+rich(n.description)+'</div>':'')
    + (qrUrlOf(n, n.link_url)?'':'<div class="meta"><span>Pick one up at the office</span></div>')
    + qrBlock(n, 'Scan to read it', n.link_url)
  });
}

/* Turn a set of Sheet fields into readable beats.
   The long fields carry "||" paragraph markers (and sometimes <br><br>), so
   split on those first — a whole `intro` is far too much for one turn. Empty
   fields simply don't produce a beat, so a half-filled row still works.
   Duplicates are dropped: at least one live news story repeats a paragraph
   verbatim between `intro` and itself. */
function beatsFrom(fields, cap){
  var out=[], seen={};
  for(var i=0;i<fields.length;i++){
    var raw = (fields[i]||'').trim();
    if(!raw) continue;
    var paras = raw.split(/\|\||<br\s*\/?>\s*<br\s*\/?>/i);
    for(var p=0;p<paras.length;p++){
      var t = paras[p].replace(/<br\s*\/?>/gi,' ').trim();
      if(t.length < 30) continue;
      /* trim an over-long paragraph back to whole sentences */
      if(t.length > 330){
        var sent = sentences(t), acc='';
        for(var q=0;q<sent.length;q++){
          if((acc+' '+sent[q]).length > 330) break;
          acc = acc ? acc+' '+sent[q] : sent[q];
        }
        t = acc || t.slice(0,330);
      }
      var key = t.slice(0,60).toLowerCase();
      if(seen[key]) continue;
      seen[key]=1;
      out.push(t);
      if(out.length >= (cap||4)) return out;
    }
  }
  return out;
}

function beatsMarkup(list, factFrom){
  if(!list.length) return '';
  if(list.length === 1) return '<div class="body">'+rich(list[0])+'</div>';
  var h='<div class="beats">';
  for(var i=0;i<list.length;i++)
    h += '<div class="beat body'+(factFrom!=null && i>=factFrom?' fact':'')+'">'+rich(list[i])+'</div>';
  return h+'</div>';
}

/* An optional Sheet column: a picture for this row, when a generic backdrop
   won't do. Accepts a repo path or a full URL. */
function screenImage(row){
  var v = (row.screen_image || row.screen_img || row.image_url || '').trim();
  if(!v) return null;
  return /^https?:/i.test(v) ? v : BASE + v.replace(/^\//,'');
}

/* SIZING LOGOS BY AREA, NOT BY HEIGHT OR WIDTH
   Real organisational logos run from about 2:1 to 7:1. Cap them all by height
   and the wide ones sprawl; cap by width and the squarish ones shrink to
   nothing. Neither looks deliberate when two appear on consecutive slides.

   So each is scaled to roughly the same PRINTED AREA — width = √(area × ratio),
   height = √(area ÷ ratio) — which is how the eye judges "same size" across
   different shapes. Measured after load, since the ratio isn't known until the
   image arrives. Max-width and max-height still act as a backstop. */
function sizeLogos(el){
  var imgs = el.querySelectorAll('.logo-plate img');
  for(var i=0;i<imgs.length;i++){
    (function(img){
      var isAsk = !!img.closest('.slide.ask');
      var area  = isAsk ? 150 : 62;        /* vmin² */
      function apply(){
        var r = img.naturalWidth / img.naturalHeight;
        if(!r || !isFinite(r)) return;
        img.style.width  = Math.sqrt(area * r).toFixed(2) + 'vmin';
        img.style.height = 'auto';
      }
      if(img.complete && img.naturalWidth) apply();
      else img.addEventListener('load', apply);
    })(imgs[i]);
  }
}

/* A partner or sponsor mark. Repo path or full URL, same as the others. */
function logoBlock(row, defaultLabel){
  var v = (row.screen_logo || row.logo_url || row.partner_logo || '').trim();
  if(!v) return '';
  var src = /^https?:/i.test(v) ? v : BASE + v.replace(/^\//,'');
  var label = (row.logo_label || defaultLabel || '').trim();
  return '<div class="logo">'
    + (label?'<span class="lbl">'+esc(label)+'</span>':'')
    + '<span class="logo-plate"><img alt="" src="'+src+'"></span>'
    + '</div>';
}

/* A flyer or poster: shown whole rather than cropped as a backdrop. */
function posterImage(row){
  var v = (row.screen_poster || row.poster_url || row.flyer_image || '').trim();
  if(!v) return null;
  return /^https?:/i.test(v) ? v : BASE + v.replace(/^\//,'');
}

/* One resolver for all three image columns, so every slide type behaves the
   same way: a poster wins, then the row's own backdrop, then a photograph from
   the collection as atmosphere. Returns the fields a slide needs.
   `fallback` lets a slide keep its existing default (news hero_image,
   volunteer photo_url) ahead of the atmospheric pick. */
/* ALL THREE BRANCHES RETURN THE SAME KEYS. Two of them used to omit
   `bgFallback` rather than setting it null, which made it easy to miss that
   the third computes one — see fromArt() below. */
function artFor(row, fallback){
  var poster = posterImage(row);
  if(poster) return { poster:poster, bg:null, bgFallback:null,
                      focus:null, atmos:false, credit:null };
  var own = screenImage(row) || fallback || null;
  if(own) return { poster:null, bg:own, bgFallback:null,
                   focus:null, atmos:false, credit:null };
  var atm = atmosPhoto();
  return { poster:null, bg: atm ? bigPhoto(atm) : null,
           bgFallback: atm ? fallbackPhoto(atm) : null,
           focus: atm && atm.focus, atmos: !!atm, credit: creditFor(atm) };
}

/* Forward what artFor() found onto the slide, in ONE place.
   Every feed builder used to hand-copy five properties into its return
   literal, and `bgFallback` was in none of the six — so an atmosphere photo,
   which is pulled at `original` resolution from iNaturalist and is NOT
   guaranteed to exist, had no fallback and rendered as an empty background.
   That is the common path, not an edge case: most feed rows carry no
   screen_image or screen_poster of their own.

   Copying once means a new art property reaches every feed slide by itself.
   `slide` carries what is distinctive about the format; anything it has
   already set is left alone, which is how slideNews keeps its own dwell. */
function fromArt(art, slide){
  slide.bg         = art.bg;
  slide.bgFallback = art.bgFallback || null;
  slide.focus      = art.focus;
  slide.atmos      = art.atmos;
  slide.poster     = art.poster;
  slide.credit     = art.credit;
  /* a poster is read, not glanced at — give it longer */
  if(slide.seconds === undefined)
    slide.seconds = art.poster ? Math.round(SECONDS * 1.6) : null;
  return slide;
}

/* A photograph from the collection, for slides with nothing of their own. */
function atmosPhoto(){
  var all = D.plants.concat(D.wildlife).filter(function(s){ return s.photo; });
  var pool = preferOrient(all, 'landscape', 12);
  return pool.length ? pick(pool) : (all.length ? pick(all) : null);
}

/* The calendar tear-off. */
function dateStamp(iso, endIso){
  if(!iso) return '';
  var d = new Date(midnight(iso)), days = daysUntil(iso);

  /* A run of days is one event, not four — say so, or "17" under-sells a
     four-night festival and misleads anyone planning around a closure. */
  if(endIso && endIso !== iso){
    var e = new Date(midnight(endIso));
    var sameMonth = e.getMonth() === d.getMonth();
    return '<div class="stamp">'
      + '<span class="num word">'+d.getDate()+'&ndash;'+e.getDate()+'</span>'
      + '<span class="when">'
      +   '<span class="dow">'+d.toLocaleDateString('en-US',{month:'long'})
      +     (sameMonth?'':' &ndash; '+e.toLocaleDateString('en-US',{month:'long'}))+'</span>'
      +   '<span class="sub">'+d.toLocaleDateString('en-US',{weekday:'short'})
      +     ' to '+e.toLocaleDateString('en-US',{weekday:'short'})+'</span>'
      + '</span></div>';
  }

  var num, word = false;
  if(days === 0){ num = 'Today'; word = true; }
  else if(days === 1){ num = 'Tomorrow'; word = true; }
  else num = d.getDate();
  return '<div class="stamp">'
    + '<span class="num'+(word?' word':'')+'">'+num+'</span>'
    + '<span class="when">'
    +   '<span class="dow">'+d.toLocaleDateString('en-US',{weekday:'long'})+'</span>'
    +   '<span class="sub">'+d.toLocaleDateString('en-US',{month:'long'})
    +     (word?' '+d.getDate():'')+'</span>'
    + '</span></div>';
}

/* QR
   The Sheet column holds the DESTINATION URL, not an image — Bev pastes a
   normal link and never thinks about QR codes. The image is rendered by a
   public generator; if it can't be reached the slide prints the URL instead,
   so the slide is never silently useless.
   Accepts screen_qr / screen_QRcode / qr_url so the column can be named
   whichever way it ends up in the Sheet. */
function qrUrlOf(row, fallback){
  return (row.screen_qr || row.screen_QRcode || row.screen_qrcode || row.qr_url
          || fallback || '').trim();
}

/* A QR has to carry somewhere a phone can actually go, so repo-relative paths
   like "docs/news/Hort_Magazine.pdf" get resolved against the page's own URL
   before they're encoded. */
function absUrl(u){
  if(!u) return '';
  if(/^https?:/i.test(u)) return u;
  try { return new URL(u.replace(/^\//,''), location.href).href; }
  catch(e){ return u; }
}

function qrBlock(row, caption, fallback){
  var url = absUrl(qrUrlOf(row, fallback));
  if(!url) return '';
  var src = 'https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=0&ecc=M&data='
          + encodeURIComponent(url);
  var pretty = url.replace(/^https?:\/\//,'').replace(/\/$/,'');
  return '<div class="qr">'
    + '<div class="qr-card"><img alt="" src="'+src+'" '
    + 'onerror="this.parentNode.style.display=\'none\';'
    + 'this.closest(\'.qr\').querySelector(\'.raw\').style.display=\'block\'"></div>'
    + (caption?'<div class="cap">'+esc(caption)+'</div>':'')
    + '<div class="raw" style="display:none">'+esc(pretty)+'</div>'
    + '</div>';
}

/* ── a cohort shout-out ──────────────────────────────────────────────────
   The Bright Futures crew has put 300-odd photographs of 117 species into this
   catalogue. Individually that is a credit line under a photo somebody has to
   go looking for. Together it is a fact about the park worth putting on a wall.

   This is also the RIGHT way to recognise students: a group, on a screen in
   the park, transient and local — not a permanent indexed page per child.
   Their names already appear as photo credits, so nothing new is exposed. */
function slideCohort(){
  var logins = cohort('Bright Futures');
  if(!logins.length) return null;

  var photos = [], species = {}, people = [];
  logins.forEach(function(login){
    var mine = BY_SHOOTER[login] || [];
    if(!mine.length) return;
    photos = photos.concat(mine);
    mine.forEach(function(p){ species[p.psbp_id] = 1; });
    people.push((NAMES[login] && NAMES[login].display_name) || login);
  });
  if(people.length < 3 || photos.length < 5) return null;

  /* Round-robin the students so the pile shows the crew, not whoever shot the
     most — one has 116 photographs and would otherwise fill the table. */
  var byPerson = {};
  photos.forEach(function(p){ (byPerson[p.photographer] = byPerson[p.photographer] || []).push(p); });
  var keys = shuffle(Object.keys(byPerson)), picks = [], round = 0;
  while(picks.length < 10 && round < 4){
    for(var k=0; k<keys.length && picks.length<10; k++){
      var mine = byPerson[keys[k]];
      if(mine[round]) picks.push(mine[round]);
    }
    round++;
  }
  if(picks.length < 6) return null;

  /* Scattered across the right-hand two thirds, tilted, dropped in one after
     another. Positions are jittered per render, so the pile falls differently
     every time it comes round. */
  var pile = picks.map(function(p, i){
    var col = i % 4, row = Math.floor(i / 4);
    return {
      src:   p.photo_url || '',
      x:     40 + col * 14 + (Math.random()*7 - 3.5),
      y:      8 + row * 27 + (Math.random()*9 - 4.5),
      r:     (Math.random()*18 - 9).toFixed(1),
      delay: ((0.7 + i * 0.34) / SPEED).toFixed(2)
    };
  });

  return {
    pile: pile,
    seconds: Math.round(SECONDS * 1.6),
    html:
        '<div class="count">'+photos.length+'<small>photographs, by students</small></div>'
      + '<div class="headline">The Bright Futures crew</div>'
      + '<div class="roster">'+esc(shuffle(people).join('  ·  '))+'</div>'
      + '<div class="shot">'+people.length+' high-school volunteers &middot; '
      +   Object.keys(species).length+' species documented</div>'
  };
}

/* ── the week ────────────────────────────────────────────────────────────
   Merges one-off events with the recurring classes, which nothing else does:
   a class row says "every Monday", and this is the only place that turns that
   into "Monday the 24th, 4PM". Trimmed to time and title — instructor, cost
   and series belong on the slide for that one thing, not on a timetable. */
function startHour(t){
  var m = /(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/i.exec(t || '');
  if(!m) return 99;
  var h = +m[1] % 12;
  if(/pm/i.test(m[3])) h += 12;
  return h + (+(m[2]||0))/60;
}

function weekAhead(){
  var days = [], now = new Date(); now.setHours(0,0,0,0);
  var DOWK = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  for(var d=0; d<7; d++){
    var when = new Date(now.getTime() + d*864e5);
    var iso  = when.getFullYear() + '-' + ('0'+(when.getMonth()+1)).slice(-2)
             + '-' + ('0'+when.getDate()).slice(-2);
    var items = [];

    D.events.forEach(function(e){
      if(e.date === iso) items.push({ time:e.time, title:e.title });
    });
    D.classes.forEach(function(c){
      if(DOWK[when.getDay()] === c.weekday) items.push({ time:c.time, title:c.title });
    });

    if(!items.length) continue;                       /* blank days don't appear */
    items.sort(function(a,b){ return startHour(a.time) - startHour(b.time); });
    days.push({ d:d, when:when, items:items });
  }
  return days;
}

function slideWeek(){
  var days = weekAhead();
  var total = days.reduce(function(n,x){ return n + x.items.length; }, 0);
  if(total < 3) return null;                          /* the solo slides cover it */

  var last = new Date(Date.now() + 6*864e5);
  var range = new Date().toLocaleDateString('en-US',{month:'long',day:'numeric'})
            + ' – ' + last.toLocaleDateString('en-US',
                {month: last.getMonth()!==new Date().getMonth() ? 'long' : undefined,
                 day:'numeric'});

  /* A dense week goes day by day; a light one goes up whole. Same beat
     machinery either way — no second layout. */
  var dense = total > 7;

  function dayHtml(x){
    return '<div class="week-day'+(x.d===0?' today':'')+'">'
      + '<span class="dw">'+(x.d===0?'Today':x.when.toLocaleDateString('en-US',{weekday:'long'}))+'</span>'
      + '<span>'+x.items.map(function(it){
          return '<span class="week-item">'
               + '<span class="tm">'+esc(it.time||'')+'</span>'
               + '<span class="ev">'+esc(it.title)+'</span></span>';
        }).join('')+'</span></div>';
  }

  var body;
  if(dense){
    var chunks = [], per = Math.ceil(days.length / Math.ceil(total/6));
    for(var i=0;i<days.length;i+=per) chunks.push(days.slice(i,i+per));
    body = '<div class="beats">' + chunks.map(function(c){
      return '<div class="beat"><div class="week">'+c.map(dayHtml).join('')+'</div></div>';
    }).join('') + '</div>';
  } else {
    body = '<div class="week">'+days.map(dayHtml).join('')+'</div>';
  }

  return {
    week:true,
    bg:null, credit:null,
    seconds: Math.round(SECONDS * (dense ? 2.0 : 1.5)),
    html:
        '<div class="eyebrow"><span>This week at the park</span></div>'
      + '<div class="headline">'+esc(range)+'</div>'
      + body
  };
}

/* ── ambient ─────────────────────────────────────────────────────────────── */
function slideAmbient(){
  var pool = D.plants.concat(D.wildlife).filter(function(x){ return x.photo; });
  /* No text to carry the slide, so the crop has to be right: wide photographs
     with the pixels to fill a 4K width. */
  pool = preferOrient(pool, 'landscape', 12)
           .filter(function(x){ return bigEnough(x, 1800); });
  if(!pool.length) pool = D.plants.concat(D.wildlife).filter(function(x){ return x.photo; });
  if(!pool.length) return null;
  var s = pick(pool);
  return {
    bg: bigPhoto(s), bgFallback: fallbackPhoto(s), focus: s.focus, ambient:true,
    credit: creditFor(s),
    seconds: Math.round(SECONDS * 0.65),   /* a breath, not a dwell */
    html: ''
  };
}

/* ── collection ──────────────────────────────────────────────────────────
   Groupings are built from fields the search index already carries, so this
   needs no new data at all. A group qualifies at six species — below that the
   count isn't impressive and the montage looks thin. */
/* Explicit labels. Machine pluralisation put "Butterflys" and "Others" on the
   wall — a lesson about generating display text from field values. Anything
   without a label here simply doesn't become a slide. */
var FORM_LABEL = {
  'Tree':'Trees',
  'Palm & Cycad':'Palms and cycads',
  'Shrub & Vine':'Shrubs and vines',
  'Groundcover & Wildflower':'Groundcovers and wildflowers',
  'Foliage & Accent':'Foliage and accent plants',
  'Aquatic & Wetland':'Aquatic and wetland plants'
};

/* "The palm family" reads on a wall; "The Arecaceae family" reads in a
   herbarium. The Latin rides along underneath. */
var FAMILY_NAME = {
